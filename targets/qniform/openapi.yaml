          description: Code of the firm whose books to act on.
          example: PERSUS
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: Sufficiency snapshot ID.
          example: 52
      responses:
        "200":
          description: Array of per-security rows (empty if the snapshot ID doesn't exist).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SegregationSufficiencySnapshotRow"
              example:
                - security: NVDA
                  required: "90.000000"
                  segregated: "80.000000"
                  deficit: "10.000000"
