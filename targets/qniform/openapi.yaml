  /firms/{firm}/snapshots/stock-segregation-sufficiency/{id}:
    get:
      tags: [Segregation]
      summary: Stock segregation sufficiency snapshot rows
      description: >
        Per security, the SEC Rule 15c3-3 segregation requirement in force for the
        closing's date against what is actually held in the Seg box. **The confirmed
        check**: taken at `START_OF_DAY`, once the depository has reported what it
        segregated overnight.


        Everything upstream of this is a forecast. `GET /snapshots/stock-segregation/{id}`
        is a lookahead struck at the previous close, and the `seg_instruction_short` /
        `seg_settlement_short` work items are predictions made on a box that had not
        moved yet. A positive `deficit` here is a possession-and-control breach that has
        already happened.


        The requirement is *read* from the lookahead whose `effective_date` is this
        closing's date — the one the overnight instruction worked to — and not
        recomputed. Recomputing at start of trading would answer a different question,
        since the day's settlements have not happened yet. Resolve the snapshot ID via
        `GET /closings/{id}` (`seg_sufficiency_snapshot_id`).
