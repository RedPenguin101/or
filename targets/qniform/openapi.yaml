  /firms/{firm}/snapshots/sbl-contracts/{id}:
    get:
      tags: [Securities Lending]
      summary: SBL contract snapshot rows
      description: >
        Returns the securities borrow and loan contracts outstanding as of a closing: opens
        less closes over the SBL blotter, keeping the ones that do not net to zero. Taken at
        **close of trading only**, which is when the day's contract file from the lending
        system has landed. Resolve the snapshot ID via `GET /closings?date=...` then
        `GET /closings/{id}` (`sbl_contracts_snapshot_id`).

        `quantity` is how much of the contract is still open, not a directional position — a
        loan of 100 and a borrow of 100 both read `100`, and `borrow` says which way the
        contract points. Keeping direction off the sign leaves a **negative quantity meaning
        exactly one thing**: the contract was closed for more than was ever opened on it, or
        closed having never been opened here at all. Nothing rejects that at posting time
        (the return happened at the counterparty whatever this system knows), so it is
        recorded and surfaced here, and it raises an `sbl_overclosed` finding.

        `collateral` counts every mark since the open, so it is what is posted **today**
        rather than what the contract was struck at. A contract can therefore be flat on
        quantity and still carry collateral — a close that returned less than it should
        have, or a mark naming a contract with nothing open — and that row is kept for the
        same reason a negative quantity is. It raises an `sbl_collateral_outstanding`
        finding. An over-closed contract raises only `sbl_overclosed`: its collateral is a
        consequence of the same break, not a second one.

        Rows are at the grain of the whole contract — counterparty, identifier, account,
        side, security and currency — rather than the identifier alone. A close that names a
        different security or side from its open therefore appears as two rows that do not
        net, instead of merging into one row with a quantity nobody can explain.
      operationId: getSBLContractSnapshot
      parameters:
        - name: firm
          in: path
          required: true
          schema:
            type: string
          description: Code of the firm whose books to act on.
          example: PERSUS
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: SBL contract snapshot ID (from `ClosingDetail.sbl_contracts_snapshot_id`).
          example: 61
      responses:
        "200":
          description: Array of outstanding contract rows from the snapshot (empty if the snapshot ID doesn't exist).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SBLContractSnapshotRow"
              example:
                - lending_contra: SBL_GS
                  contract_identifier: GS-2026-0003
                  account: PROP1
                  borrow: true
                  security: AAPL
                  quantity: "250.000000"
                  currency: USD
                  collateral: "37182.50"
                  opened_at: "2026-06-02T10:00:00Z"
        "400":
          description: Invalid (non-integer) snapshot ID.
        "404":
          description: >
            No snapshot of this kind has that ID **on this firm's books**. A snapshot
            belonging to another firm answers the same way as one that does not exist:
            distinguishing them would confirm an ID the caller cannot read.

  /firms/{firm}/snapshots/settlement-positions/{id}:
    get:
      tags: [Settlements]
      summary: Settlement position snapshot rows
      description: >
        Returns open settlement obligation rows from a specific snapshot, one row per open
        lot with a non-zero remaining quantity — a settlement ladder. Unlike
        `GET /lots/settlement/positions`, which computes live from current state and nets per
