      responses:
        "200":
          description: Array of trading position rows from the snapshot (empty if the snapshot ID doesn't exist).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TradingPositionSnapshotRow"
              example:
                - account: INVENTORY
                  subaccount: long
                  security: AAPL
                  currency: USD
                  qty: "100.000000"
                  book_cost: "15000.00"
                  rpl: "250.00"
        "400":
          description: Invalid (non-integer) snapshot ID.
        "404":
          description: >
            No snapshot of this kind has that ID **on this firm's books**. A snapshot
            belonging to another firm answers the same way as one that does not exist:
            distinguishing them would confirm an ID the caller cannot read.
        "500":
          description: Internal server error.

  /firms/{firm}/margin/rates:
    get:
      tags: [Margin]
      summary: Get the firm's house margin rates
      description: >
        Returns this firm's house maintenance margin rates, one entry per security that has
        them configured, ordered by security. A security absent from the list carries no house
        rate and margins at the regulatory minimum (25% long / 30% short).


        House rates are per firm, not per security: the same instrument is legitimately
        margined differently on two firms' books, so these are configuration owned by the
        margin subdomain rather than fields on the security.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The firm's configured house rates.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MarginRate"
        "500":
          description: Internal server error.
    put:
      tags: [Margin]
      summary: Upsert house margin rates
      description: >
        Creates or updates house rates for the named securities. This **merges** — securities
        absent from the body keep whatever they had. Use `DELETE /firms/{firm}/margin/rates/{security}`
        to return one to the regulatory minimum; a body with both legs `0` is rejected rather
        than stored, since that state already means "no house rate".


        A nonzero rate below the regulatory minimum is rejected with 400: house rates may only
        be stricter than the floor, never looser.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/MarginRate"
            example:
              - security: AAPL
                long_bps: 4000
                short_bps: 3500
      responses:
        "204":
          description: Rates written.
        "400":
          description: Unknown security, a rate below the regulatory minimum, or an all-zero entry.
        "500":
          description: Internal server error.

  /firms/{firm}/margin/rates/{security}:
    delete:
      tags: [Margin]
      summary: Remove a house margin rate
      description: >
        Drops this firm's house rate for one security, returning it to the regulatory minimum.
        Deleting a rate that was never configured is not an error — the caller asked for the
        security to carry no house rate, and it doesn't.
      security:
        - bearerAuth: []
      parameters:
        - name: security
          in: path
          required: true
          schema:
            type: string
          description: Security code.
          example: AAPL
      responses:
        "204":
          description: Rate removed (or was already absent).
        "400":
          description: Unknown security.
        "500":
          description: Internal server error.

  /firms/{firm}/margin/config:
    get:
      tags: [Margin]
      summary: Get the firm's margin policy
      description: >
        Firm-level margin policy that isn't per security. A firm that has configured none gets
        the built-in default.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The firm's margin policy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarginConfig"
        "500":
          description: Internal server error.
    put:
      tags: [Margin]
      summary: Set the firm's margin policy
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarginConfig"
      responses:
        "204":
          description: Policy written.
        "400":
          description: Negative threshold.
        "500":
          description: Internal server error.

  /firms/{firm}/mtm/stale-thresholds:
    get:
      tags: [Mark-to-Market]
      summary: Get the firm's price staleness tolerances
      description: >
        Returns this firm's configured tolerance grid, one entry per `(security type, fair
        value level)` cell that has been set. A cell absent from the list uses the built-in
        default for its level — see `GET /firms/{firm}/mtm/stale-thresholds/defaults`.

        Values are **business days**: a Monday closing marking off Friday's close is one day
        stale, not three. Holidays are not yet modelled, so only weekends are excluded.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Array of configured grid cells.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StaleThreshold"
              example:
                - security_type: corp_bond
                  level: "2"
                  threshold_days: 10
        "500":
          description: Internal server error.
    put:
      tags: [Mark-to-Market]
      summary: Upsert price staleness tolerances
      description: >
        Upsert, not replace: cells absent from the body keep whatever they had. Use
        `DELETE /firms/{firm}/mtm/stale-thresholds/{type}/{level}` to return one to its level
        default. `0` is a legitimate value — "today's price or nothing" — and is distinct from
        an unset cell.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/StaleThreshold"
      responses:
        "204":
          description: Thresholds written.
        "400":
          description: Unknown or unpriceable security type, a level outside 1–3, or a negative threshold.
        "500":
          description: Internal server error.

  /firms/{firm}/mtm/stale-thresholds/defaults:
    get:
      tags: [Mark-to-Market]
      summary: Get the per-level default tolerances
      description: >
        The tolerance a level takes when the firm has configured no cell for it. These track
        how often each level's inputs are observed — a Level 1 quote exists every trading day,
        a Level 3 mark comes out of a much slower model cycle.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Array of per-level defaults.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [level, threshold_days]
                  properties:
                    level:
                      type: string
                      enum: ["1", "2", "3"]
                    threshold_days:
                      type: integer
              example:
                - level: "1"
                  threshold_days: 1
                - level: "2"
                  threshold_days: 5
                - level: "3"
                  threshold_days: 30
        "500":
          description: Internal server error.

  /firms/{firm}/mtm/stale-thresholds/{type}/{level}:
    delete:
      tags: [Mark-to-Market]
      summary: Remove a staleness tolerance cell
      description: >
        Returns the cell to its level default. Deleting a cell that was never configured is
        not an error.
      security:
        - bearerAuth: []
      parameters:
        - name: type
          in: path
          required: true
          schema:
            type: string
            enum: [ord, corp_bond, govt_bond, money_market_fund]
          description: Security type.
          example: corp_bond
        - name: level
          in: path
          required: true
          schema:
            type: string
            enum: ["1", "2", "3"]
          description: Fair value hierarchy level.
          example: "2"
      responses:
        "204":
          description: Cell removed (or was already absent).
        "400":
          description: Unknown security type or level.
        "500":
          description: Internal server error.

  /firms/{firm}/stock-seg/policy:
    get:
      tags: [Segregation]
      summary: Get the stock prioritization config
      description: >
        Returns the firm-wide stock prioritization configuration used by the stock segregation
        calculation: securities never offered as collateral, securities offered first (in
        order), and which security types are eligible for collateral at all (in order). All
        three lists default to empty. An empty `eligible_types` is a strict default — nothing is
        eligible for collateral until at least one type is configured.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The current configuration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockSegregationConfig"
    put:
      tags: [Segregation]
      summary: Replace the stock prioritization config
      description: >
        Atomically replaces all three lists **for this firm**, leaving other firms' policies
        untouched. A security must not appear in both `never_free` and `priority_securities`.
        Each list must not contain duplicates, and security/type codes must be valid. List order
        is preserved and is significant (priority/eligibility rank).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StockSegregationConfig"
      responses:
        "204":
          description: Config saved.
        "400":
          description: Invalid security/type code, duplicate entry, or a security on both never_free and priority_securities.

  /firms/{firm}/fx-translation/config:
    get:
      tags: [Finance Trial Balance]
      summary: Base-currency translation settings
      description: >
        The firm's settings for restating its finance trial balance into its base currency.

        **Absence is the off switch.** A firm with no config answers `404`, and every
        base-currency column of its finance trial balance stays `null` — the statement it
        always had. Configuring one turns the restatement on from the next closing.
      operationId: getFinanceTranslationConfig
      parameters:
        - name: firm
          in: path
          required: true
          schema:
            type: string
          description: Code of the firm whose books to act on.
          example: PERSCA
      responses:
        "200":
          description: The firm's translation settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceTranslationConfig"
        "404":
          description: This firm has no translation config, so its finance trial balance is not translated.
        "500":
          description: Internal server error.
    put:
      tags: [Finance Trial Balance]
      summary: Set base-currency translation settings
      description: >
        Creates or replaces the firm's translation settings. The row's presence is what
        turns translation on, so an empty body is a valid request that enables it at the
        defaults below.

        The residual account is not named here. It is the firm's `tb_rounding`
        bookkeeping account, provisioned when the firm is granted its role, so there is
        nothing for a caller to get wrong or leave unset.
      operationId: setFinanceTranslationConfig
      parameters:
        - name: firm
          in: path
          required: true
          schema:
            type: string
          description: Code of the firm whose books to act on.
          example: PERSCA
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinanceTranslationConfig"
            example:
              fx_source: INTERNAL
      responses:
        "204":
          description: Stored.
        "400":
          description: Malformed body, an empty `fx_source`, or a negative `stale_after_days`.
        "500":
          description: Internal server error.

  /firms/{firm}/dtc-funding/config:
    get:
      tags: [DTC Funding]
      summary: List DTC settlement funding configs
      description: >
        Returns all configured DTC settlement funding rows. Each row maps a
        control account (e.g. `DTC_CNS`) and currency to the reserve account
        (e.g. `BNYOPS`) and DTC participant account (e.g. `DTC_P`) used at
        start-of-day to pre-fund or return cash for that day's DTC net
        settlement obligation.
      security:
        - bearerAuth: []
      parameters:
        - name: firm
          in: query
          required: true
          schema:
            type: string
          description: Code of the firm whose funding configs to return.
          example: PERSUS
      responses:
        "200":
          description: Array of DTC funding config rows (may be empty).
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    control_account:
                      type: string
                      example: DTC_CNS
                    currency:
                      type: string
                      example: USD
                    reserve_account:
                      type: string
                      description: Customer reserve/SEA account (custody type).
                      example: BNYOPS
                    settlement_account:
                      type: string
                      description: DTC participant account (custody type).
                      example: DTC_P
    put:
      tags: [DTC Funding]
      summary: Upsert a DTC settlement funding config
      description: >
        Inserts or updates the funding config for a (control_account, currency)
        pair. Validates that `control_account` is type `control`,
        `reserve_account` is type `custody`, and `settlement_account` is type
        `custody`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [control_account, currency, reserve_account, settlement_account]
              properties:
                control_account:
                  type: string
                  example: DTC_CNS
                currency:
                  type: string
                  example: USD
                reserve_account:
                  type: string
                  example: BNYOPS
                settlement_account:
                  type: string
                  example: DTC_P
      responses:
        "204":
          description: Config saved.
        "400":
          description: Missing/invalid field or account not found.

  /sweep/programs:
    get:
      tags: [Cash Sweep]
      summary: List sweep programs
      description: >
        Returns all configured cash sweep programs, each including its bank
        panel (bank_deposit/network_operator) or fund/omnibus account
        (money_market). A program groups the configuration for one of the
        firm's cash sweep arrangements. Retention is not configured here --
        see the `cash_sweep` field on `PUT /accounts`, since every enrolled
        account specifies its own mandatory retention amount. The
        sweep/recall post-close instructions run independently across every
        configured program, each sweeping only its own enrolled accounts
        (via their `cash_sweep` enrollment) -- any number of `bank_deposit`,
        `network_operator`, and `money_market` programs may coexist.
      operationId: listSweepPrograms
      parameters:
        - name: firm
          in: query
          required: true
          schema:
            type: string
          description: >
            Code of the firm to scope to. This data is per firm, so a caller must say
            whose books it is asking about.
          example: PERSUS
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Array of sweep programs (may be empty).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SweepProgram"

  /sweep/programs/{code}:
    get:
      tags: [Cash Sweep]
      summary: Get a sweep program
      description: Returns a single sweep program, including its bank panel.
      operationId: getSweepProgram
      security:
        - bearerAuth: []
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The sweep program.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SweepProgram"
        "404":
          description: Sweep program not found.
    put:
      tags: [Cash Sweep]
      summary: Upsert a sweep program
      description: >
        Creates or updates a single sweep program, keyed by `code` in the
        path. Sweep programs are low volume (a handful per firm at most), so
        this is a single-object upsert, not a batch endpoint.


        `banks` replaces the program's entire bank panel (delete-all,
        reinsert in array order) in the same request; only valid for
        `bank_deposit`/`network_operator` programs. All bank accounts must
        be type `bank`, each account may belong to at most one program's
        panel firm-wide, and duplicates within the list are rejected.
        Validates that `custody_account` is type `custody` and `currency` is
        a currency-type security.


        `network_operator` programs must have exactly one account in
        `banks` -- the operator's single omnibus account -- and are not
        subject to the $250k-per-bank FDIC cap that `bank_deposit` programs'
        waterfall allocation enforces, since the operator (e.g. IntraFi) is
        itself responsible for spreading the omnibus balance across
        underlying banks to stay within FDIC insurance limits.


        `money_market` programs carry `fund` and `omnibus_account` instead
        of `banks`: excess cash buys shares of `fund` (a
        money_market_fund-type security) via a `MoneyMarketTrade`, held in
        the broker's omnibus position at `omnibus_account` (the fund's
        transfer agent). `custody_account` plays the cash settlement role
        for these programs rather than a bank-panel custody role. There is
        no per-bank cap concept, since money market fund shares are
        SIPC-covered securities, not FDIC-insured bank deposits.
      operationId: upsertSweepProgram
      security:
        - bearerAuth: []
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, custody_account, currency]
              properties:
                type:
                  type: string
                  enum: [bank_deposit, network_operator, money_market]
                  description: >
                    Program type. `bank_deposit` waterfalls across an
                    ordered bank panel, capped at $250k per bank.
                    `network_operator` is a single-omnibus-account program
                    run by a third-party operator, with no per-bank cap.
                    `money_market` sweeps into a single money-market fund
                    instead of a bank panel.
                custody_account:
                  type: string
                  description: >
                    Account code; must be type `custody`. For `money_market`
                    programs this is the cash settlement account, not a
                    bank-panel custody account.
                  example: BNYOPS
                currency:
                  type: string
                  description: Security code; must be a currency-type security.
                  example: USD
                banks:
                  type: array
                  items:
                    type: string
                  description: >
                    Ordered bank panel (the accounts swept cash waterfalls
                    across, in priority order). Omit or send an empty array
                    for no bank panel. Not valid for `money_market` programs.
                  example: ["WF_BANK", "BAC_BANK"]
                fund:
                  type: string
                  description: >
                    Security code of the money-market fund; must be type
                    `money_market_fund`. Required for `money_market`
                    programs, invalid for the other two types.
                  example: VMFXX
                omnibus_account:
                  type: string
                  description: >
                    Account code of the broker's omnibus position at the
                    fund's transfer agent; must be type `custody` and
                    different from `custody_account`. Required for
                    `money_market` programs, invalid for the other two
                    types.
                  example: VANGD_OMNI
            example:
              type: bank_deposit
              custody_account: BNYOPS
              currency: USD
              banks: ["WF_BANK", "BAC_BANK"]
      responses:
        "204":
          description: Sweep program saved.
        "400":
          description: Missing/invalid field, account or security not found, or invalid bank panel/fund/omnibus account.

  /firms/{firm}/sweep/programs/{code}/enrollments:
    get:
      tags: [Cash Sweep]
      summary: List a sweep program's enrolled accounts
      description: >
        Returns every customer account enrolled in the program, with each
        enrollment's retention amount (formatted in the program currency) and
        morning-recall trigger flags. Enrollment itself is managed through
        the `cash_sweep` block on `PUT /accounts`.
      operationId: listSweepProgramEnrollments
      security:
        - bearerAuth: []
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
        - name: firm
          in: query
          required: true
          schema:
            type: string
          description: >
            Code of the firm to scope to. Enrollments are per firm, so a caller must
            say whose books it is asking about.
          example: PERSUS
      responses:
        "200":
          description: The program's enrollments (empty array if none).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SweepEnrollment"
        "404":
          description: Sweep program not found.

  /firms/{firm}/stock-seg/custody:
    get:
      tags: [Segregation]
      summary: Get custody segregation config
      description: >
        Returns the firm's segregation arrangement at its custodian: the custody
        account holding its stock at the depository (e.g. `DTC_BOX`), whose Free/Seg
        subaccount positions the custody segregation post-close instruction reads and
        moves between, and the control accounts whose open settlement obligations flow
        through that account.


        The control accounts are configuration, not something the system can work out.
        Nothing in the ledger states which control accounts feed which box — only which
        ones *have*, in settlements already made, which cannot answer a question about
        what is expected to settle.
      security:
        - bearerAuth: []
      parameters:
        - name: firm
          in: query
          required: true
          schema:
            type: string
          description: Code of the firm whose segregation config to return.
          example: PERSUS
      responses:
        "200":
          description: The custody segregation config.
          content:
            application/json:
              schema:
                type: object
                required: [custody_account, control_accounts]
                properties:
                  custody_account:
                    type: string
                    example: DTC_BOX
                  control_accounts:
                    type: array
                    description: Control accounts settling into this custody account.
                    items:
                      type: string
                    example: [DTC_CNS, DTC_DVP]
        "404":
          description: Config not set.
    put:
      tags: [Segregation]
      summary: Set the custody segregation config
      description: >
        Replaces the firm's arrangement wholesale — the control accounts sent are the
        complete set, not additions.


        Scope comes from `{firm}` in the path, not from the accounts named. Validates
        that `custody_account` is type `custody`, that every `control_accounts` entry is
        type `control`, that **every account named is on that firm's books**, and that
        there are no duplicates. **At least one control
        account is required**: without one there is no way to size the Free box against
        expected settlement, so the arrangement would be unusable.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [custody_account, control_accounts]
              properties:
                custody_account:
                  type: string
                  example: DTC_BOX
                control_accounts:
                  type: array
                  minItems: 1
                  items:
                    type: string
                  example: [DTC_CNS, DTC_DVP]
      responses:
        "204":
          description: Config saved.
        "400":
          description: >
            Missing/invalid field, account not found, an empty control account list, an
            account of the wrong type, an account belonging to a firm other than the one
            in the path, or a duplicate.

  /firms/{firm}/stock-instructions:
    get:
      tags: [Settlements]
      summary: Stock instructions — pending third-party stock movement messages
      description: >
        Pending Free↔Seg stock movement instructions produced by the
        custody segregation post-close run, awaiting DTC confirmation. Optionally
        filtered by account code or originating event SEID. The seed uses this to
        mock DTC confirmations as `STOCK_SEG_MOVE` events.
      operationId: listStockInstructions
      parameters:
        - name: firm
          in: path
          required: true
          schema:
            type: string
          description: Code of the firm whose books to act on.
          example: PERSUS
        - name: account
          in: query
          required: false
          schema:
            type: string
        - name: seid
          in: query
          required: false
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Pending stock instruction rows, most-recent-first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StockInstructionRow'
        "400":
          description: Unknown account code.
        "500":
          description: Internal server error.

  /firms/{firm}/regulatory/net-capital:
    get:
      tags: [Net Capital]
      summary: Compute Alternative Method net capital
      description: >
        Computes the SEC Rule 15c3-1 Alternative Method net capital position for
        the given closing, expressed in USD cents. Uses the trial balance and MTM
        snapshots attached to that closing.


        Net Capital = Net Worth − Haircuts


        Haircuts: 15% of market value for ordinary shares (from MTM snapshot).


        Alternative Method test: Net Capital ≥ max($250,000, 2% × Aggregate Debit Items)


        Aggregate Debit Items = sum of positive customer cash balances (credit extended on margin).
      parameters:
        - name: closing_id
          in: query
          required: true
          schema:
            type: integer
          description: ID of the ledger closing whose snapshots to use.
      responses:
        '200':
          description: Net capital computation result in USD.
          content:
            application/json:
              schema:
                type: object
                properties:
                  net_worth:
                    type: string
                    description: Sum of balance-sheet-natured TD amounts (assets minus liabilities), formatted as a decimal USD amount (e.g. "1234567.89").
                  haircuts:
                    type: string
                    description: Aggregate haircut deductions (15% of ordinary-share market value), formatted as a decimal USD amount.
                  net_capital:
                    type: string
                    description: Net Worth minus Haircuts, formatted as a decimal USD amount.
                  aggregate_debit_items:
                    type: string
                    description: Sum of positive customer cash balances (margin credit extended), formatted as a decimal USD amount.
                  minimum_net_capital:
                    type: string
                    description: Required minimum — the greater of $250,000 or 2% of Aggregate Debit Items, formatted as a decimal USD amount.
                  compliant:
                    type: boolean
                    description: True if Net Capital >= Minimum Net Capital.
              example:
                net_worth: "12450000.00"
                haircuts: "187500.00"
                net_capital: "12262500.00"
                aggregate_debit_items: "3200000.00"
                minimum_net_capital: "250000.00"
                compliant: true
        '400':
