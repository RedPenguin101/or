  /firms/{firm}/events/equity_trade:
    post:
      tags: [Events]
      summary: Post equity trade events
      description: >
        Accepts an array of equity trade events and processes them as a
        single all-or-nothing batch, unlike the other event endpoints on
        this page: every item is validated before anything is written, and
        if any item is invalid the entire request is rejected -- nothing is
        written to the ledger. In that case every item in the response is
        marked `"error"`: items that themselves failed validation carry
        their own message, and the rest carry a message noting the batch
        was rejected because of another item. If every item is valid, all
        are processed together in one transaction and each result carries
        `"ok"` with that trade's `seid`. The response is always HTTP 200
        with one result object per input event, in the same order as the
        request. Only malformed JSON and requests exceeding 500 items
        return HTTP 400.


        **Amounts:** All monetary and share amounts are decimal strings (e.g.
        `"195.89"` for USD, `"100.000000"` for shares). The system resolves the
        required number of decimal places from the security definition.


        **Codes:** All account and security references use their string codes
        (e.g. `"JOEBLOGGS"`, `"AAPL"`, `"USD"`), not internal integer IDs.


        **Maker/checker.** The outcome depends on the caller's permissions. A
        caller with `event:self_post` (including any key-only trusted machine
        such as the seed) processes the batch directly and gets the `200`
        described above. A caller with only `event:make` has the event **staged
        for approval** — it returns `202` with a `PendingAction` and nothing is
        posted until a checker approves it via `POST /approvals/event/{id}/approve`.
        Staging takes **exactly one event**: submitting an array of more than one
        item without `event:self_post` returns `400`. A caller with neither
        permission gets `403`.
      operationId: processEquityTrade
      parameters:
        - name: firm
          in: path
          required: true
          schema:
            type: string
          description: Code of the firm whose books to act on.
          example: PERSUS
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              maxItems: 500
              items:
                $ref: "#/components/schemas/EquityTradeEvent"
            example:
              - account: JOEBLOGGS
                contra_account: PROP1
                security: AAPL
                currency: USD
                quantity: "100.000000"
                price: "195.89"
                buy: true
                commission:
                  currency: USD
                  amount: "9.99"
                transaction_date: "2026-06-10T00:00:00Z"
                value_date: "2026-06-12T00:00:00Z"
      responses:
        "200":
          description: Per-item results in the same order as the request.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EventResult"
        "202":
          description: >
            Event staged for approval (caller had `event:make` but not
            `event:self_post`). Nothing is posted yet. Returns the created
            `PendingAction`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PendingAction"
        "400":
          description: >
            Malformed JSON, more than 500 items in the request, or an attempt to
            stage more than one event for approval without `event:self_post`.
        "403":
          description: Caller has neither `event:self_post` nor `event:make`.
        "500":
          description: Internal server error.

  /firms/{firm}/events/equity_trade/simulate:
    post:
      tags: [Events]
      summary: Preview an equity trade
      description: >
        Previews the ledger entries a single equity trade would post, writing nothing.
        Runs the same conversion and validation as `POST /events/equity_trade`, so
        business-rule errors (contra matrix, subaccount requirements, value-date
        ordering, …) surface identically — letting a form validate as-you-go and show
        the simulated journal. The request body is a single event object, not an array.
        Note: realized P&L (which is produced by the lotting process, not the trade-time
        journal) is not included.
      operationId: simulateEquityTrade
      parameters:
        - name: firm
          in: path
          required: true
          schema:
            type: string
          description: Code of the firm whose books to act on.
          example: PERSUS
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EquityTradeEvent"
      responses:
        "200":
          description: The would-be entries, or the validation error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimulateResult"
        "400":
          description: Malformed JSON body.
        "404":
          description: Simulate is not supported for this event type.

  /firms/{firm}/events/equity_trade/fill:
    post:
      tags: [Events]
      summary: Complete a part-keyed equity trade
      description: >
        Takes a **partially keyed** equity trade and returns it with the fields the
        system can work out already filled in, writing nothing. It is the server half
        of the terminal's fill key: the operator states the trade and gets the whole
        of it back to look at before committing.


        **The response body is the patch**: field name to value, for the fields it
        worked out, and nothing else — a delta, not a completed event, and not
        wrapped in an envelope. The caller merges it onto the form it just sent. The
        keys are therefore also the list of what was filled, which a client that
        marks host-supplied values on screen needs and cannot get by comparing two
        copies.


        **It never rejects and never overwrites.** Unknown codes, missing fields and
        amounts that are not numbers are all ignored — an unfinished form is not an
        error, and validation belongs to `POST /events/equity_trade/simulate`, which
        a client wanting both calls second with the merged form. A field that already
        has a value is absent from the response, so merging can never lose what the
        operator keyed.


        **What it fills today is `value_date`**, and only when `transaction_date` is
        present and parses: the next business day, counting weekdays (holidays are
        not modelled). Supplying a value date instead means *special settlement* —
        cash, next-day, seller's option — which is why the fill will not touch one.


        The route is mounted for **every** event type, so a client need not know which
        of them can work anything out; the others return an empty `filled`. Only
        equity trades fill anything today, which is why this is the only one
        documented.
      operationId: fillEquityTrade
      parameters:
        - name: firm
          in: path
          required: true
          schema:
            type: string
          description: Code of the firm whose books to act on.
          example: PERSUS
      requestBody:
        required: true
        description: >
          The event so far. Every field is optional here, whatever the event schema
          requires of a post — a form with four fields of nine keyed is exactly the
          state this endpoint exists to serve.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EquityTradeEvent"
            example:
              account: JOEBLOGGS
              contra_account: PROP1
              security: AAPL
              currency: USD
              quantity: "100.000000"
              price: "195.89"
              buy: true
              transaction_date: "2026-06-10T00:00:00Z"
      responses:
        "200":
          description: The event as the server now reads it, and what it completed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FillResult"
        "400":
          description: Malformed JSON body, or a body that is not the shape of this event.
        "404":
          description: No such event type.

