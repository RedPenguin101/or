  /firms/{firm}/snapshots/mtm/{id}:
    get:
      tags: [Mark-to-Market]
      summary: Mark-to-market snapshot rows
      description: >
        Returns mark-to-market rows from a specific MTM snapshot. Each row gives both the TD
        (trade-date) and VD (value-date/settled) share position, the price used, and the
        resulting market value at each basis in the security's pricing currency. TD reflects
        trade-date exposure (used for risk/credit calculations like margin maintenance); VD
        reflects what's actually settled into the firm's depository position (used for
        possession/custody calculations like stock segregation — an unsettled trade isn't
        physically held yet, so it can't be segregated or pledged).

        Each row also carries the mark's provenance — which price observation was used, how
        many business days old it was, the firm's tolerance for that security's fair value
        level, and whether it exceeded it. A mark struck off a price past tolerance is
        flagged (`stale: true`), not omitted.

        Rows are only present where a price was available at the time of the closing. A
        security with **no** internal price on file at all is still silently omitted — there
        is no mark to record — so the MTM snapshot may not cover every position in the stock
        record snapshot.

        Obtain the snapshot ID from `GET /closings/{id}` (`mtm_snapshot_id`).
      operationId: getMTMSnapshot
      parameters:
        - name: firm
          in: path
          required: true
          schema:
            type: string
          description: Code of the firm whose books to act on.
          example: PERSUS
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: MTM snapshot ID (from `ClosingDetail.mtm_snapshot_id`).
          example: 44
        - name: stale_only
          in: query
          required: false
          schema:
            type: boolean
          description: >
            When `true`, returns only rows whose price exceeded the firm's tolerance
            (`stale: true`).
          example: true
      responses:
        "200":
          description: Array of MTM rows from the snapshot.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MTMSnapshotRow"
              example:
                - account: JOEBLOGGS
                  subaccount: CASH
                  security: AAPL
                  currency: USD
                  td_qty: "100.000000"
                  vd_qty: "100.000000"
                  td_market_value: "19742.00"
                  vd_market_value: "19742.00"
                  price_date: "2026-01-16"
                  price_age_days: 1
                  stale_threshold_days: 1
                  fair_value_level: "1"
                  stale: false
        "400":
          description: Invalid (non-integer) snapshot ID.
        "404":
          description: >
            No snapshot of this kind has that ID **on this firm's books**. A snapshot
            belonging to another firm answers the same way as one that does not exist:
            distinguishing them would confirm an ID the caller cannot read.
        "500":
          description: Internal server error.

