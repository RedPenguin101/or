openapi: "3.1.0"
info:
  title: Qniform API
  version: "0.1.0"
  description: |
    Qniform is a financial services accounting system for broker-dealers.

    For a full explanation of system concepts — events, SEIDs, blotters, double-entry ledger,
    trading lots, settlement lots, closings, sign conventions, and amounts — refer to the
    **[System Manual](/manual)**.

tags:
  - name: Events
    description: >
      Capturing business events, and reading back what they wrote: the reconstructed
      event behind a SEID, and the trade confirm rendered on demand from it.
      See the [System Manual](/manual/events-and-blotters#event-capture).
  - name: Securities
    description: >
      The instrument master: securities, their per-firm overrides, and the interest
      rules that drive bond accruals. See the [System Manual](/manual/securities).
  - name: Prices & Rates
    description: >
      Market data — prices, FX rates, and the benchmark curves that floating rates
      reset against. See the [System Manual](/manual/securities).
  - name: Parties & Accounts
    description: >
      The party model and the accounts it hangs off: firms, parties, the relations
      between them, and the ledger accounts they own.
      See the [System Manual](/manual/parties-and-accounts#accounts).
  - name: Ledger
    description: See the [System Manual](/manual/ledger#ledger).
  - name: Book Cost
    description: >
      Trading lot positions and the book cost they carry, live and as snapshotted at a
      closing. Lots are matched FIFO, LIFO or weighted-average per the account's
      allocation method. See the [System Manual](/manual/balances-and-positions#trading-lots).
  - name: Settlements
    description: >
      What the firm owes and is owed on settlement date: stock instructions, the netted
      obligation behind an event, and settlement lot positions live and at a closing.
      See the [System Manual](/manual/balances-and-positions#settlement-lots).
  - name: Closings
    description: >
      Taking a closing, and the two snapshots every closing strikes whatever its type:
      the trial balance and the stock record. The snapshots belonging to a particular
      operational area are tagged with that area instead.
      See the [System Manual](/manual/closings).
  - name: Margin
    description: >
      Margin rates and call thresholds, and the maintenance and requirement-position
      snapshots they are applied in. See the [System Manual](/manual/regulatory#margin).
  - name: Segregation
    description: >
      Stock segregation policy and custody sizing, and the segregation and sufficiency
      snapshots. See the [System Manual](/manual/regulatory#stock-seg).
  - name: Mark-to-Market
    description: >
      Price staleness thresholds and the mark-to-market snapshot that respects them.
      See the [System Manual](/manual/balances-and-positions).
  - name: Interest Accrual
    description: >
      The accrued bond interest snapshot. Its inputs are the interest rules under
      Securities. See the [System Manual](/manual/closings).
  - name: Securities Lending
    description: >
      The open SBL contract snapshot. The contracts themselves are opened, marked,
      re-rated and charged through the SBL events under Events.
  - name: Finance Trial Balance
    description: >
      The finance trial balance -- the books restated into the firm's base currency --
      and the translation configuration that governs how the restatement is done.
  - name: Cash Sweep
    description: See the [System Manual](/manual/cash-sweep).
  - name: DTC Funding
    description: >
      Configuration for the DTC settlement funding run.
      See the [System Manual](/manual/dtc-funding).
  - name: Net Capital
    description: See the [System Manual](/manual/regulatory#net-capital).
  - name: Authentication
    description: Login, logout, and current-user for web-UI users. Backed by server-side sessions carried in an HttpOnly cookie.
  - name: Approvals
    description: Maker/checker approval queue. Actions requiring four-eyes are staged here until a checker approves. See the [System Manual](/manual).
  - name: System
    description: Instance-wide configuration. Currently the system clock, which is the sole source of every event's knowledge date.
  - name: Work Items
    description: >
      Operational exceptions — things a process could not do, and the tasks that follow.
      A *finding* is the immutable fact ("this closing could not price XYZ"); a *work item*
      is the mutable task it raises, deduplicated so twenty consecutive days of the same
      problem is one item with an occurrence count of twenty.
  - name: Manual
    description: The human-readable System Manual, served page by page as HTML fragments.

# Scalar's sidebar is built from these groups, and a tag left out of every group is
# dropped from the page along with its operations -- so every tag above must appear
# exactly once below.
x-tagGroups:
  - name: Reference Data
    tags: [Securities, Prices & Rates, Parties & Accounts]
  - name: Books & Records
    tags: [Events, Ledger, Book Cost, Settlements]
  - name: Closings and Operations
    tags: [Closings, Margin, Segregation, Mark-to-Market, Interest Accrual,
           Securities Lending, Finance Trial Balance, Cash Sweep, DTC Funding,
           Net Capital]
  - name: Platform
    tags: [Authentication, System, Approvals, Work Items, Manual]

paths:
  /login:
    post:
      tags: [Authentication]
      summary: Log in with username and password
      description: On success, sets an HttpOnly session cookie and returns the user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        "200":
          description: Logged in; session cookie set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid JSON body.
        "401":
          description: Invalid credentials.
  /logout:
    post:
      tags: [Authentication]
      summary: Log out the current session
      description: Deletes the server-side session and clears the cookie. Idempotent.
      responses:
        "204":
          description: Logged out.
  /me:
    get:
      tags: [Authentication]
      summary: Return the currently logged-in user
      responses:
        "200":
          description: The current user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not authenticated.
  /users:
    get:
      tags: [Authentication]
      summary: List users
      description: Requires the `users:view` permission (or a key-only trusted caller).
      responses:
        "200":
          description: All users.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "403":
          description: Caller lacks `users:view`.
    post:
      tags: [Authentication]
      summary: Provision a user
      description: Gated by the API key (a trusted machine); there is no user-management UI. Used by the seed. User creation and role assignment are one transaction.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password, display_name]
              properties:
                username:
                  type: string
                password:
                  type: string
                display_name:
                  type: string
                roles:
                  type: array
                  description: Role names to assign. Each must be a known role.
                  items:
                    type: string
      responses:
        "201":
          description: User created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Missing required fields, invalid JSON, or an unknown role name.
        "409":
          description: Username already exists.
  /roles:
    get:
      tags: [Authentication]
      summary: List roles and the permissions they grant
      description: Requires the `roles:view` permission (or a key-only trusted caller).
      responses:
        "200":
          description: All roles with their permissions.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RoleWithPermissions"
        "403":
          description: Caller lacks `roles:view`.
  /users/{id}:
    get:
      tags: [Authentication]
      summary: User detail, including the user's roles
      description: Requires the `users:view` permission (or a key-only trusted caller).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: The user and their roles.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/User"
                  - type: object
                    required: [roles]
                    properties:
                      roles:
                        type: array
                        items:
                          $ref: "#/components/schemas/Role"
        "400":
          description: Invalid user id.
        "403":
          description: Caller lacks `users:view`.
        "404":
          description: User not found.
  /system/clock:
    get:
      tags: [System]
      summary: Read the system clock
      description: >
        Reports which clock the instance runs on and what it currently reads.
        Every event's `knowledge_date` is stamped from this clock at the moment
        the event is recorded — it is never supplied by a caller, which is why
        no event request body carries a knowledge date.


        In `wall` mode `now` is the host clock, read fresh on each request. In
        `simulated` mode it is derived from a stored epoch and `rate`: at rate
        `0` it only moves when an operator advances it, which is how a seed
        script lays down months of history without naming a knowledge date
        anywhere; at a non-zero rate it runs on its own, at that many simulated
        seconds per host second.
      responses:
        "200":
          description: The clock's mode and current reading.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemClock"
    post:
      tags: [System]
      summary: Set the clock mode, or advance a simulated clock
      description: >
        Requires the `system:clock_set` permission (or a key-only trusted
        caller). Sets the mode, the reading and the rate, which is also how a
        simulated clock is started and paused. Three rules protect the knowledge
        dates already stamped:


        * **The clock never moves backwards.** Advancing a simulated clock to an
          earlier instant, or returning to `wall` mode while the host clock is
          behind the simulated reading, is rejected — rewinding would allow an
          event to be minted backdated into a closed accounting period. A
          negative `rate` is rejected for the same reason.

        * **Only an instance with no events may enter simulated mode.** This is
          what keeps a production instance out of simulation: it has events, so
          it cannot. Entering simulation on an empty instance may start at any
          instant, including one in the past. It is also why a production clock
          cannot be paused — pausing is entering simulated mode at the current
          instant with `rate` `0`.

        * **`rate` is capped at 86400** (a simulated day per host second).


        Returning to `wall` mode is permitted at any time (subject to the first
        rule) — the usual flow is to seed history under a simulated clock, then
        switch to `wall` and use the instance live.


        A restart always resumes **paused**, whatever rate was running: an
        unattended restart silently advancing simulated time by the length of
        the outage would put a hole in the knowledge dates.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode:
                  type: string
                  enum: [wall, simulated]
                now:
                  type: string
                  format: date-time
                  description: >
                    The instant to set. Required when *entering* `simulated`
                    mode, where there is no reading to keep; optional once
                    simulated, where omitting it leaves the clock where it is.
                    Ignored when `mode` is `wall`, which reads the host clock by
                    definition.
                rate:
                  type: integer
                  minimum: 0
                  maximum: 86400
                  default: 0
                  description: >
                    Simulated seconds per host second: `0` pauses, `1` runs in
                    real time, `3600` runs an hour a second. Defaults to `0`, so
                    setting the clock without naming a rate pauses it — starting
                    a clock is always an explicit act. Negative rates are
                    rejected: a clock that runs backwards would breach the
                    never-rewind rule continuously.
            examples:
              startSimulation:
                summary: Begin a simulation on an empty instance, paused
                value: { mode: simulated, now: "2026-01-01T00:00:00Z" }
              advance:
                summary: Advance the simulated clock
                value: { mode: simulated, now: "2026-01-15T00:00:00Z" }
              run:
                summary: Start the clock running at an hour a second
                value: { mode: simulated, rate: 3600 }
              pause:
                summary: Pause where it is, without moving it
                value: { mode: simulated, rate: 0 }
              resumeLive:
                summary: Return to the host clock
                value: { mode: wall }
      responses:
        "200":
          description: The clock's new mode and reading.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemClock"
        "400":
          description: >
            Unknown mode, missing `now` when entering simulated mode, a
            non-RFC3339 `now`, or a `rate` outside `[0, 86400]`.
        "403":
          description: Caller lacks `system:clock_set`.
        "422":
          description: The change would move the clock backwards, or would put an instance that already has events into simulated mode.
  /firms/{firm}/events:
    get:
      tags: [Events]
      summary: List system events (keyset-paginated)
      description: >
        Lists events newest-first (by seid). Pagination is keyset, not offset: pass the seid of
        the last row you saw as `before` to get the next (older) page. `has_more` indicates
        whether a further page exists. Filter by `event_type`, a knowledge-date range
        (`from`/`to`, `YYYY-MM-DD`, both inclusive of their day), and/or a direct `seid`.
      operationId: listEvents
      parameters:
        - name: firm
          in: path
          required: true
          schema:
            type: string
          description: Code of the firm whose books to act on.
          example: PERSUS
        - name: before
          in: query
          required: false
          description: Keyset cursor — return events with seid strictly less than this.
          schema:
            type: integer
            format: int64
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
            maximum: 200
        - name: event_type
          in: query
          required: false
          description: Event type name, e.g. `JOURNAL`.
          schema:
            type: string
        - name: from
          in: query
          required: false
          description: Knowledge date lower bound (inclusive), `YYYY-MM-DD`.
          schema:
            type: string
        - name: to
          in: query
          required: false
          description: Knowledge date upper bound (inclusive of the whole day), `YYYY-MM-DD`.
          schema:
            type: string
        - name: seid
          in: query
          required: false
          description: Return just this event.
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: A page of events.
          content:
            application/json:
              schema:
                type: object
                required: [events, has_more]
                properties:
                  events:
                    type: array
                    items:
                      $ref: "#/components/schemas/EventListItem"
                  has_more:
                    type: boolean
        "400":
          description: Invalid cursor, seid, date, or unknown event_type.
  /firms/{firm}/events/{seid}:
    get:
      tags: [Events]
      summary: System event
      description: >
        Returns the system event for a SEID: its type, knowledge date, and — for
        event types that can be reconstructed — the full business event rebuilt
        from its blotter row(s), with account/security IDs resolved to codes,
        amounts as decimal strings and dates as RFC3339. The reconstructed
        `event` mirrors the shape you would POST to `/events/<type>` to create it.


        `event` is `null` for event types with no reconstructable struct
        (journals, closings, FDIC sweeps/recalls, DTC funding, bond coupon
        payments). Where a field has no blotter column of its own — such as
        `MoneyMarketTrade.settlement_account` or `Settlement.trade_seid` — it is
        carried in the blotter row's annotations, so a reconstructable event
        round-trips in full.
      operationId: getEvent
      parameters:
        - name: firm
          in: path
          required: true
          schema:
            type: string
          description: Code of the firm whose books to act on.
          example: PERSUS
        - name: seid
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: The system event.
          content:
            application/json:
              schema:
                type: object
                required: [id, event_type, knowledge_date, event]
                properties:
                  id:
                    type: integer
                    format: int64
                  event_type:
                    type: string
                    description: Event type name (e.g. `EQUITY_TRADE`, `CLOSING`).
                  knowledge_date:
                    type: string
                    format: date-time
                    description: >
                      When the system learned of this event, stamped from the system clock at
                      allocation. It is metadata about the event, not part of it — which is why
                      it sits on this envelope rather than inside `event`, and why no request
                      body accepts one. See `GET /system/clock`.
                  event:
                    nullable: true
                    type: object
                    description: >
                      The reconstructed business event (fields depend on
                      `event_type`, mirroring the corresponding
                      `POST /events/<type>` request body), or `null` when the
                      event type has no reconstructable struct.
                    additionalProperties: true
        "404":
          description: No event with that SEID.

  /firms/{firm}/confirms/{seid}:
    get:
      tags: [Events]
      summary: Trade confirm document
      description: >
        Renders the trade confirm for a customer equity trade **on demand** from its trade
        blotter row — confirms are not stored. The render is deterministic: the generated
        date shown on the document comes from the trade's knowledge date, not the render
        clock, so repeated calls return the same document (the client name/address block
        reflects current account reference data). Returns 404 unless the SEID identifies an
        equity trade whose account is a customer account — firm (inventory-vs-market) trades
        have no confirm.
      operationId: getConfirm
      parameters:
        - name: firm
          in: path
          required: true
          schema:
            type: string
          description: Code of the firm whose books to act on.
          example: PERSUS
        - name: seid
          in: path
          required: true
          schema:
            type: integer
          description: SEID of the equity trade event.
          example: 50
      responses:
        "200":
          description: The confirm document.
          content:
            text/html:
              schema:
                type: string
        "400":
          description: Malformed SEID.
        "404":
          description: SEID is not a customer equity trade.
        "500":
          description: Internal server error.

  /securities:
    get:
      tags: [Securities]
      summary: List all securities
      description: >
        Returns every security in the system — both currencies (USD, EUR, GBP, …) and
        equities (AAPL, MSFT, …). Use the `type` field to distinguish them. Currencies
        appear on the money leg of ledger entries; equities appear on the stock leg.

        **The full ISO 4217 currency list ships with the schema**, so an unfiltered
        listing is roughly 158 currencies plus whatever instruments the instance
        actually holds. Most callers want `?type=ord`.
      operationId: listSecurities
      parameters:
        - name: type
          in: query
          required: false
          description: >
            Restrict to the given security types. Repeat the parameter or pass a
            comma-separated list; omitting it returns everything. An unrecognised
            type is a 400.
          schema:
            type: array
            items:
              type: string
              enum: [currency, ord, corp_bond, govt_bond, money_market_fund]
          style: form
          explode: true
          example: [ord]
      responses:
        "200":
          description: Array of all securities ordered by code.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Security"
              example:
                - code: USD
                  name: US Dollar
                  cusip: ""
                  type: currency
                  decimals: 2
                  pricing_currency: ""
                - code: AAPL
                  name: Apple Inc.
                  cusip: "037833100"
                  type: ord
                  decimals: 6
                  pricing_currency: USD
        "500":
          description: Internal server error.

    put:
      tags: [Securities]
      summary: Upsert securities (bulk)
      description: >
        Creates or updates securities in bulk. Each item is matched by `code`;
        if a security with that code already exists all mutable fields are updated,
        otherwise a new record is inserted.


        The response always returns HTTP 200 with a per-item result array, even
        when some items fail. Callers must inspect each item's `status` field.
        Maximum 500 items per request.


        **pricing_currency** in the request is a security **code** (e.g. `"USD"`),
        not an integer ID. The currency must already exist in the system; if it
        cannot be resolved the item is returned with `status: "error"` rather than
        failing the entire batch.


        **Currencies cannot be created or modified here.** The ISO 4217 list is seeded
        with the schema — every currency already exists — so an item with
        `type: "currency"`, or one naming a code that already is a currency, comes back
        with `status: "error"`. This is also why `pricing_currency` always resolves:
        there is no ordering requirement between currencies and the equities that
        reference them.


        Seeded currencies are coded by their ISO 4217 code, except that everything
        outside the eight majors (`EUR`, `GBP`, `AUD`, `NZD`, `USD`, `CAD`, `CHF`, `JPY`)
        carries a `CCY_` prefix — `CCY_AMD` is the Armenian Dram. `code` is this
        system's identifier rather than an external one, and the prefix is what keeps
        three-letter tickers such as `AMD` and `ALL` available for the instruments a
        reader would actually expect them to name.
      operationId: upsertSecurities
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              maxItems: 500
              items:
                type: object
                required: [code, name, type, decimals]
                properties:
                  code:
                    type: string
                    description: >
                      This system's unique identifier for the security, and the upsert
                      key. Conventionally the ticker, but not required to be one — it is
                      ours to assign, unlike the `cusip` beside it.
                    example: AAPL
                  name:
                    type: string
                    description: Full human-readable name.
                    example: Apple Inc.
                  cusip:
                    type: string
                    description: CUSIP identifier. Omit or use empty string for currencies.
                    example: "037833100"
                  type:
                    type: string
                    enum: [currency, ord, corp_bond, govt_bond, money_market_fund]
                    description: >
                      Security type. `pricing_currency` is required for every
                      type except `currency`.
                  decimals:
                    type: integer
                    description: Number of decimal places for amounts (e.g. 2 for currencies, 6 for equities).
                    example: 6
                  pricing_currency:
                    type: string
                    description: >
                      Code of the currency this security is priced in (e.g. `"USD"`).
                      Required when `type` is `ord`, `corp_bond`, or `govt_bond`; must be omitted or empty for `currency`.
                      For bonds this field also serves as the denomination currency for interest accrual calculations.
                    example: USD
            example:
              - code: USD
                name: US Dollar
                type: currency
                decimals: 2
              - code: AAPL
                name: Apple Inc.
                cusip: "037833100"
                type: ord
                decimals: 6
                pricing_currency: USD
      responses:
        "200":
          description: >
            Per-item results in the same order as the request. Always returned,
            even on partial failure. An item with an unresolvable `pricing_currency`
            gets `status: "error"` while the rest of the batch proceeds.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [code, status]
                  properties:
                    code:
                      type: string
                      description: The security code from the request.
                    status:
                      type: string
                      enum: [created, updated, error]
                      description: Outcome for this item.
                    error:
                      type: string
                      description: Error message, present only when status is "error".
              example:
                - code: USD
                  status: created
                - code: AAPL
                  status: created
        "400":
          description: >
            Invalid request — malformed JSON, missing required fields, invalid `type`,
            `ord` item missing `pricing_currency`, or more than 500 items supplied.
        "500":
          description: Internal server error (connection-level failure).

  /securities/{code}:
    get:
      tags: [Securities]
      summary: Security detail
      description: >
        Returns static data for a single security identified by its code (ticker or
        currency code).
      operationId: getSecurity
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
          description: Security code — ticker for equities (e.g. `AAPL`) or ISO 4217 code for currencies (e.g. `USD`).
          example: AAPL
      responses:
        "200":
          description: Security static data.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Security"
              example:
                code: AAPL
                name: Apple Inc.
                cusip: "037833100"
                type: ord
                decimals: 6
                pricing_currency: USD
        "404":
          description: No security with the given code exists.
        "500":
          description: Internal server error.

  /securities/{code}/interest-rule:
    put:
      tags: [Securities]
      summary: Associate an interest rule with a security
      description: >
        Associates an existing interest rule with a security. Intended for `corp_bond`
        securities. The interest rule must already exist (create it via `POST /interest-rules`).
      operationId: setSecurityInterestRule
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
          description: Security code.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [interest_rule_id]
              properties:
                interest_rule_id:
                  type: integer
                  format: uint32
      responses:
        "204":
          description: Interest rule associated successfully.
        "400":
          description: Invalid request body or interest_rule_id not found.
        "404":
          description: Security not found.
        "500":
          description: Internal server error.

  /benchmarks:
    get:
      tags: [Prices & Rates]
      summary: List benchmarks
      operationId: listBenchmarks
      responses:
        "200":
          description: All benchmarks.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Benchmark'
        "500":
          description: Internal server error.
    put:
      tags: [Prices & Rates]
      summary: Upsert benchmarks
      description: Creates or updates benchmarks by code.
      operationId: upsertBenchmarks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                required: [code, name]
                properties:
                  code: { type: string, example: US13W }
                  name: { type: string, example: "US 13-Week T-Bill Auction Rate" }
      responses:
        "200":
          description: Per-item upsert results.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UpsertResult'
        "400":
          description: Validation error.
        "500":
          description: Internal server error.

  /benchmark-rates:
    put:
      tags: [Prices & Rates]
      summary: Insert benchmark rate observations
      description: >
        Inserts or replaces rate observations for a benchmark. `rate_time` must be RFC3339.
        On conflict (benchmark + source + rate_time) the rate_bps is overwritten.
      operationId: upsertBenchmarkRates
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                required: [benchmark, source, rate_time, rate_bps]
                properties:
                  benchmark:
                    type: string
                    description: Benchmark code.
                    example: US13W
                  source:
                    type: string
                    description: Rate source identifier (e.g. `TREASURY_AUCTION`).
                    example: TREASURY_AUCTION
                  rate_time:
                    type: string
                    format: date-time
                    example: "2026-02-02T00:00:00Z"
                  rate_bps:
                    type: integer
                    description: Rate in basis points.
                    example: 508
      responses:
        "204":
          description: All rates inserted successfully.
        "400":
          description: Unknown benchmark or invalid fields.
        "500":
          description: Internal server error.

  /interest-rules:
    post:
      tags: [Securities]
      summary: Create an interest rule
      description: >
        Creates a new interest rule and returns its ID. The rule defines the rate and
        payment schedule for a fixed-income instrument over its life. Rate blocks and
        payment blocks must be contiguous and span [start, end].
      operationId: createInterestRule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InterestRule'
      responses:
        "201":
          description: Interest rule created. Returns the new ID.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    format: uint32
        "400":
          description: Invalid request body or validation failure.
        "500":
          description: Internal server error.

  /interest-rules/{id}:
    get:
      tags: [Securities]
      summary: Get an interest rule
      description: Returns a single interest rule by ID.
      operationId: getInterestRule
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: uint32
      responses:
        "200":
          description: Interest rule.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterestRule'
        "404":
          description: Interest rule not found.
        "500":
          description: Internal server error.

  /interest-rules/{id}/calendar:
    get:
      tags: [Securities]
      summary: Interest rule calendar of reset and payment dates
      description: >
        Returns every floating-rate reset date and coupon payment date across the rule's
        full [start, end] range, sorted chronologically (reset before payment on a date
        they coincide). This is the same schedule the rule's rate and accrual calculations
        use internally, surfaced as a flat list rather than a single-date check -- useful
        for seeing at a glance whether a coupon payment fell between two dates, e.g. why
        interest accrued as of a closing can differ from interest purchased at trade time
        if a payment reset the accrual clock in between.
      operationId: getInterestRuleCalendar
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: uint32
      responses:
        "200":
          description: Array of calendar events, sorted chronologically.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InterestCalendarEvent'
              example:
                - date: "2026-01-15"
                  type: reset
                - date: "2026-01-15"
                  type: payment
                - date: "2026-04-15"
                  type: reset
        "400":
          description: Invalid (non-integer) rule ID.
        "404":
          description: Interest rule not found.
        "500":
          description: Internal server error.

  /securities/fair-value-defaults:
    get:
      tags: [Securities]
      summary: Fair value level defaults by security type
      description: >
        The ASC 820 / IFRS 13 level a security takes when its firm has recorded no override.

        Instance-wide rather than firm-scoped: the *overrides* are one firm's judgement and
        live on `GET`/`PATCH /firms/{firm}/securities/{code}`, but what an un-overridden
        security falls back to is a property of its type and the same on every book. Served
        rather than restated client-side so a screen cannot drift from what the resolver
        actually does. Also doubles as the list of priceable security types.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Array of per-type defaults.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [security_type, level]
                  properties:
                    security_type:
                      type: string
                      enum: [ord, corp_bond, govt_bond, money_market_fund]
                    level:
                      type: string
                      enum: ["1", "2", "3"]
              example:
                - security_type: ord
                  level: "1"
                - security_type: corp_bond
                  level: "2"
        "500":
          description: Internal server error.

  /firms/{firm}/securities:
    get:
      tags: [Securities]
      summary: The firm's view of the security master
      description: >
        Every security as one firm sees it: the instrument's own global properties plus that
        firm's overlay on top.

        The overlay exists because a few things about a security are one firm's judgement
        rather than a fact about the instrument — two firms on this instance legitimately
        answer them differently for the same AAPL. Only attributes read by **more than one**
        domain live here; an attribute read by a single calculation stays with that
        calculation (house margin rates under `/firms/{firm}/margin/rates`, segregation
        eligibility under `/firms/{firm}/stock-seg/policy`), because hoisting it would make one
        domain's table a dependency of three for no gain.

        `fair_value_level` is always the resolved level, so a caller never needs the type
        default table to render one; `fair_value_level_overridden` says whether that came from
        a stored classification or the default.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Array of securities with this firm's overlay, ordered by id.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FirmSecurity"
        "500":
          description: Internal server error.

  /firms/{firm}/securities/{code}:
    get:
      tags: [Securities]
      summary: One security as this firm sees it
      security:
        - bearerAuth: []
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
          description: Security code.
          example: ACME2034
      responses:
        "200":
          description: The security with this firm's overlay.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FirmSecurity"
        "404":
          description: Unknown security.
        "500":
          description: Internal server error.
    patch:
      tags: [Securities]
      summary: Set this firm's overlay on a security
      description: >
        Each overlay field is three-valued: **absent** leaves the stored value alone, a
        **value** sets it, and an explicit **null** clears the override back to the type
        default.

        `PATCH` with a nullable field rather than `DELETE` on a per-attribute sub-resource,
        because clearing is an edit to one row of the overlay and a DELETE-per-attribute
        scheme stops scaling the moment a second attribute arrives.

        Global instrument properties (name, CUSIP, type, decimals) are not settable here —
        they are the same on every book and are written through `PUT /securities`.
      security:
        - bearerAuth: []
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
          description: Security code.
          example: ACME2034
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fair_value_level:
                  type: string
                  nullable: true
                  enum: ["1", "2", "3", null]
                  description: >
                    Set this firm's classification, or null to clear it back to the type
                    default.
            examples:
              set:
                summary: Classify as Level 3
                value: { fair_value_level: "3" }
              clear:
                summary: Clear back to the type default
                value: { fair_value_level: null }
      responses:
        "200":
          description: The security with the updated overlay.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FirmSecurity"
        "400":
          description: Invalid body, or a level outside 1–3.
        "404":
          description: Unknown security.
        "500":
          description: Internal server error.

  /prices:
    put:
      tags: [Prices & Rates]
      summary: Upsert price observations
      description: >
        Bulk upsert of price observations, keyed on `(security, currency, source, date)` —
        re-sending a key overwrites that observation rather than adding a second one.

        **Quotation convention is per security type and is applied server-side.** Bonds are
        quoted as a clean price percent of $100 face (`"96.50"` means 96.5% of par); equities,
        money market funds and everything else are a price per unit. Send the decimal string as
        an operator would quote it and the server encodes the right one — a caller that
        pre-scales a bond price will be wrong by 100x.

        Mark-to-market reads `INTERNAL` prices only, and resolves the latest observation on or
        before the closing date. A security with no observation at all is silently omitted from
        the MTM snapshot; one whose latest observation is older than the firm's tolerance is
        included and flagged stale. Entering a price is therefore the fix for both.

        Instance-wide: a price is a market fact, not one firm's opinion, so the same observation
        serves every firm's books.
      operationId: upsertPrices
      security:
        - bearerAuth: []
      parameters:
        - name: work_item_id
          in: query
          required: false
          schema:
            type: integer
            format: int64
          description: >
            Declares that this write cures the named work item, closing it with reason
            `cured_in_system` and recording the request as the resolution's provenance.
            The caller knows the id because they arrived through the action link on the
            queue; reaching this route without it simply writes the price and leaves the
            item open.


            The item's subject must be one of the securities the request writes about,
            checked before anything is written — so a stale or hand-edited id is rejected
            having changed nothing. If that security's own row then fails, the cure is not
            recorded and the item stays open; its per-item `error` says why.


            Nothing verifies the cure worked. If it did not, the next run re-emits the
            finding and the item reopens carrying this resolution: the detector is the
            audit of the declaration.


            Unlike the write it rides on, a cure records who declared it, so this parameter
            needs a logged-in user holding `work_item:resolve` rather than the API key
            alone.
          example: 12
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              maxItems: 500
              items:
                $ref: "#/components/schemas/PriceUpsert"
            example:
              - security: VMFXX
                currency: USD
                source: INTERNAL
                date: "2026-06-12"
                price: "1.00"
      responses:
        "200":
          description: >
            Per-item results, in request order. **A 200 does not mean every item was
            written** — an item that names an unknown security, or whose price cannot be
            parsed, carries `status: "error"` with its own message while the rest still
            apply. Callers must read the body, not just the status code.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PriceUpsertResult"
              example:
                - security: VMFXX
                  currency: USD
                  source: INTERNAL
                  date: "2026-06-12"
                  status: created
        "400":
          description: >
            Malformed body, more than 500 items, or an item missing a required field / with
            an unparseable date or price. Also a `work_item_id` that is not a number or
            whose subject none of the items name — nothing is written in either case.
        "401":
          description: A `work_item_id` was given with no logged-in user to record as declaring the cure.
        "403":
          description: A `work_item_id` was given by a caller lacking `work_item:resolve`.
        "404":
          description: No work item with the given `work_item_id`.
        "409":
          description: The work item named by `work_item_id` is already resolved.
        "500":
          description: Internal server error.

  /fx-rates:
    put:
      tags: [Prices & Rates]
      summary: Upsert exchange rates
      description: >
        Bulk upsert of exchange rates between two currencies, keyed on the pair plus
        `(source, date)` — re-sending a key overwrites that observation rather than adding
        a second one.

        **Quote a pair either way round; it reads back the way you wrote it.** Storage
        direction is not part of this contract — internally a pair is held in exactly one
        orientation, but `GET /securities/{code}/prices` resolves and inverts on the way
        out, so posting `CAD`/`USD` and reading `CAD`/`USD` returns what you sent. The
        inversion is exact: a rate is held as a ratio, never as a rounded decimal.

        What does follow from that: **direction is not part of the key.** `CAD`/`USD` and
        `USD`/`CAD` are one observation, so posting the second overwrites the first for the
        same source and date rather than adding a reciprocal beside it. That is deliberate —
        two feeds quoting a pair in opposite directions will not produce exact reciprocals,
        and the gap between them is an arbitrage a customer could round-trip through the
        firm's own reference data.

        **Both sides must be currencies.** A price against a security belongs on
        `PUT /prices`, which conversely refuses two currencies: the two routes partition the
        space rather than overlapping. Unlike `PUT /prices`, a rate may be quoted finer than
        the quote currency's minor unit — `1.3712` CAD per USD is accepted exactly.

        Instance-wide: an exchange rate is a market fact, not one firm's opinion.
      operationId: upsertFXRates
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              maxItems: 500
              items:
                $ref: "#/components/schemas/FXRateUpsert"
            example:
              - base: USD
                quote: CAD
                source: INTERNAL
                date: "2026-06-12"
                rate: "1.3712"
      responses:
        "200":
          description: >
            Per-item results, in request order. **A 200 does not mean every item was
            written** — an item naming an unknown code, or naming something that is not a
            currency, carries `status: "error"` with its own message while the rest still
            apply. Callers must read the body, not just the status code.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FXRateUpsertResult"
              example:
                - base: CAD
                  quote: USD
                  source: INTERNAL
                  date: "2026-06-12"
                  status: created
        "400":
          description: >
            Malformed body, more than 500 items, or an item missing a required field / with
            an unparseable date or rate.
        "500":
          description: Internal server error.

  /securities/{code}/prices:
    get:
      tags: [Prices & Rates]
      summary: Price history for a security
      description: >
        Returns the full price history for a security in the requested currency.
        Prices are stored per source (e.g. `INTERNAL` for manually entered prices) and
        are used by the closing process when computing mark-to-market values.

        Currencies have prices too — an exchange rate against another currency, entered
        through `PUT /fx-rates`. **A currency pair may be named either way round**, since
        which currency leads is a convention rather than a fact: both
        `GET /securities/USD/prices?currency=CAD` and `.../CAD/prices?currency=USD` work,
        the second inverting the stored row on the way out.

        Everything else must be named the one way that means anything, and the rules are
        the same as `PUT /prices` — a pair either route accepts the other accepts, and a
        pair either refuses the other refuses. A security is quoted in money and never the
        reverse, so `AAPL`/`USD` is a pair and `USD`/`AAPL` is a `400`. So is a security
        against another security (`AAPL`/`ABBV`), and a security against itself.

        `price` is returned in the same convention it was submitted in: a clean price percent
        of $100 face for bonds, a rate at the precision it was quoted for currency pairs
        (`"1.3712"`, not `"1.37"`), and a price per unit for everything else. A currency
        pair read against its stored direction is inverted, and where that has no exact
        decimal form it is given to 8 places (`"0.72928821"`).
      operationId: listPrices
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
          description: Security code (e.g. `AAPL`).
          example: AAPL
        - name: currency
          in: query
          required: true
          schema:
            type: string
          description: Currency code to price the security in (e.g. `USD`). Must match the security's `pricing_currency`.
          example: USD
      responses:
        "200":
          description: Array of price records ordered by source then date ascending.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PriceRecord"
              example:
                - id: 1
                  source: INTERNAL
                  date: "2026-06-10"
                  price: "195.89"
                  currency: USD
                - id: 2
                  source: INTERNAL
                  date: "2026-06-11"
                  price: "197.42"
                  currency: USD
        "400":
          description: Missing or empty `currency` query parameter.
        "404":
          description: No security or currency with the given code exists.
        "500":
          description: Internal server error.

  /securities/{code}/fx-rates:
    get:
      tags: [Prices & Rates]
      summary: Every exchange rate a currency is a leg of
      description: >
        Returns all rate observations for the given currency against every counterpart it
        has been quoted with, each quoted **against `code` as the base**: one unit of `code`
        buys `rate` units of `quote`, whichever direction the pair happens to be stored in.

        This is the listing `GET /securities/{code}/prices` cannot give: that route names
        both sides of a pair, and a caller listing a currency's rates does not yet know the
        counterparts. The partition is the same one the write routes draw — `code` must be a
        currency, and a security is a `400` pointing at `/securities/{code}/prices`. Prices
        of a *security* in this currency are not rates and never appear here, even though
        the currency is a leg of each of them.

        A currency nobody has quoted returns `[]`, not a `404`.

        `rate` carries the precision the observation was quoted at (`"1.3712"`), and an
        inverted rate with no exact decimal form is given to 8 places (`"0.72928821"`) —
        the same convention as the price read.
      operationId: listFXRates
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
          description: Currency code (e.g. `USD`).
          example: USD
      responses:
        "200":
          description: Array of rate records ordered by counterpart code, then source, then date ascending.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FXRateRecord"
              example:
                - id: 91
                  quote: CAD
                  source: INTERNAL
                  date: "2026-06-11T00:00:00Z"
                  rate: "1.341"
                - id: 92
                  quote: CAD
                  source: INTERNAL
                  date: "2026-06-12T00:00:00Z"
                  rate: "1.342"
        "400":
          description: "`code` names a security rather than a currency."
        "404":
          description: No security with the given code exists.
        "500":
          description: Internal server error.

  /parties:
    get:
      tags: [Parties & Accounts]
      summary: List all parties
      description: >
        Returns all parties in the system, each with the roles it holds. A party is
        an individual or group of individuals with agency and shared intent: a natural
        person is a party of one, a company a party of many. Parties are referenced
        via the `links` array on account detail responses, and a party holding the
        `firm` role is a set of books this instance keeps.
      operationId: listParties
      responses:
        "200":
          description: Array of parties.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Party"
              example:
                - id: 1
                  code: JOEBLOGGS
                  name: Bloggs
                  pre_name: Joe
                - id: 2
                  code: PERSCA
                  name: Persepolis Securities Canada Inc.
                  pre_name: ""
                  roles:
                    firm:
                      base_currency: CAD
                    correspondent: {}
        "500":
          description: Internal server error.

    put:
      tags: [Parties & Accounts]
      summary: Upsert parties (bulk)
      description: >
        Creates or updates parties in bulk. Each item is matched by `code`;
        if a party with that code already exists its `name` and `pre_name`
        are updated, otherwise a new record is inserted.


        This is also where a party's **roles** are asserted and retracted — there is
        no separate endpoint, because a role is not a thing that exists apart from
        the party holding it. Omitting `roles` entirely leaves the party's roles
        exactly as they are, so an ordinary name correction cannot strip a firm of
        its books; sending `roles: {}` retracts every role, and sending a role key
        asserts that role with the attributes given. Retracting the `firm` role from
        a firm that still has accounts, ledger entries, closings or user grants fails
        for that item.


        The response always returns HTTP 200 with a per-item result array, even
        when some items fail. Callers must inspect each item's `status` field.
        Maximum 500 items per request.
      operationId: upsertParties
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              maxItems: 500
              items:
                type: object
                required: [code, name]
                properties:
                  code:
                    type: string
                    description: Unique identifier for the party. Used as the upsert key.
                    example: JOEBLOGGS
                  name:
                    type: string
                    description: Display name of the party.
                    example: Bloggs
                  pre_name:
                    type: string
                    description: Optional prefix (e.g. given name or honorific).
                    example: Joe
                  roles:
                    $ref: "#/components/schemas/PartyRoles"
            example:
              - code: JOEBLOGGS
                name: Bloggs
                pre_name: Joe
              - code: PERSUS
                name: Persepolis Securities LLC
                roles:
                  firm:
                    base_currency: USD
      responses:
        "200":
          description: >
            Per-item results in the same order as the request. Always returned,
            even on partial failure.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [code, status]
                  properties:
                    code:
                      type: string
                      description: The party code from the request.
                    status:
                      type: string
                      enum: [created, updated, error]
                      description: Outcome for this item.
                    error:
                      type: string
                      description: Error message, present only when status is "error".
              example:
                - code: JOEBLOGGS
                  status: created
                - code: ACME
                  status: updated
        "400":
          description: >
            Invalid request — malformed JSON, missing required fields, or more
            than 500 items supplied.
        "500":
          description: Internal server error (connection-level failure).

  /parties/{code}:
    get:
      tags: [Parties & Accounts]
      summary: Get a party
      description: Returns one party with the roles it holds.
      operationId: getParty
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
          example: JOE_BLOGGS
      responses:
        "200":
          description: The party.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Party"
        "404":
          description: No party with that code.

  /parties/{code}/relations:
    get:
      tags: [Parties & Accounts]
      summary: List a party's current relationships, from its own side
      description: >
        Returns the party's **sides** of the relationships it currently participates
        in, at either end — each one carrying the role the party is acting in. Group by
        `role` to show a party's relationships under the role they belong to.


        The unit is a side rather than an edge because a party can occupy both slots of
        the same relationship, and those are two true statements about two different
        roles. Such an edge yields **two** entries here, one per role.


        `(type, role)` identifies the slot the party occupies, and the two slots of a
        type read in opposite directions — the source of `IsCorrespondentOf` *is a
        correspondent of* the target, and the target *clears for* the source. How that
        is worded for a reader is the client's to decide; this endpoint returns the
        slot, not a phrase.


        Current relationships by default: ending one is not deleting it, so pass
        `as_of` to read the sides that were live at an instant instead. Ranges are
        half-open, so the instant a relationship ended is already outside it.
      operationId: listPartyRelations
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
          example: PERSUS
        - name: as_of
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: >
            Return the sides live at this instant rather than the current ones.
            Omit for current only — which is not the same question as "as of now",
            since a relationship that ended a moment ago is not current.
          example: 2026-03-01T00:00:00Z
      responses:
        "200":
          description: The party's relations (possibly empty).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PartyRelation"
              example:
                - role: firm
                  type: IsCorrespondentOf
                  other: PERSCA
                  valid_from: "2026-01-01T00:00:00Z"
                - role: firm
                  type: BranchOfFirm
                  other: NYC_RETAIL
                  valid_from: "2026-01-01T00:00:00Z"
        "404":
          description: No party with that code.

  /party-relations:
    put:
      tags: [Parties & Accounts]
      summary: Assert a party relationship
      description: >
        Opens an edge, valid from now until it is ended. Both ends must already hold the
        roles the type requires — that gating is what keeps the graph acyclic, and it is
        checked here because a foreign key cannot point at a table that varies by row.


        Source and target may be the same party. Nothing in the domain currently wants
        a self-edge — a firm is *not* its own correspondent — but role gating stratifies
        the roles rather than requiring the two ends to differ, so one is representable
        and behaves predictably.
      operationId: assertPartyRelation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, source, target]
              properties:
                type:
                  type: string
                  enum:
                    [
                      IsCorrespondentOf,
                      BranchOfFirm,
                      BranchOfCorrespondent,
                      RepInBranch,
                      TraderInBranch,
                    ]
                source:
                  type: string
                  description: Party code of the source end.
                  example: PERSCA
                target:
                  type: string
                  description: Party code of the target end.
                  example: PERSUS
      responses:
        "204":
          description: Relationship asserted.
        "400":
          description: Malformed body, unknown relationship type, or unresolvable party code.
        "409":
          description: >
            An overlapping relationship of this type between these parties is already
            live. Cardinality is enforced as an exclusion constraint over valid time.
        "422":
          description: An end does not hold the role this relationship type requires.

    delete:
      tags: [Parties & Accounts]
      summary: End a party relationship
      description: >
        Closes the currently-valid edge at now. This **ends** the relationship rather
        than deleting it: the historical row survives, so an `as_of` read of a past
        instant still reports it, and the pairing becomes free to assert again.


        Ending a branch membership (`RepInBranch`, `TraderInBranch`) or a branch's
        parentage (`BranchOfFirm`, `BranchOfCorrespondent`) is refused while accounts
        still reach their firm or correspondent through it — every account naming that
        responsible party would otherwise be left rolling up to nobody. Reassign those
        accounts first.
      operationId: endPartyRelation
      parameters:
        - name: type
          in: query
          required: true
          schema:
            type: string
            enum:
              [
                IsCorrespondentOf,
                BranchOfFirm,
                BranchOfCorrespondent,
                RepInBranch,
                TraderInBranch,
              ]
        - name: source
          in: query
          required: true
          schema:
            type: string
          example: PERSCA
        - name: target
          in: query
          required: true
          schema:
            type: string
          example: PERSUS
      responses:
        "204":
          description: Relationship ended.
        "400":
          description: Unknown relationship type or unresolvable party code.
        "404":
          description: No currently-valid relationship of that type between those parties.
        "409":
          description: >
            Accounts still depend on this edge for their responsible party's rollup.
            The message names one of them as the thread to pull.

  /me/firms:
    get:
      tags: [Authentication]
      summary: List the firms the caller may act on
      description: >
        Returns exactly the firms the current user holds a grant for — the set the
        server would authorise. The frontend's firm switcher reads this, so it offers
        no choice the server would refuse. A user with no grants gets an empty array
        and can reach no firm-scoped data.
      operationId: listMyFirms
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Array of firms (possibly empty).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Firm"
        "401":
          description: Not authenticated.

  /transaction-types:
    get:
      tags: [Ledger]
      summary: The transaction type vocabulary
      description: >
        Every transaction type a ledger entry may carry, sorted. A fixed vocabulary compiled
        into the server, not editable reference data — served so a client can populate a
        filter or a journal form without restating the list and drifting from it.
      operationId: listTransactionTypes
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Sorted array of transaction type names.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
              example: ["BUY", "DEPOSIT", "SELL"]
        "500":
          description: Internal server error.

  /manual:
    get:
      tags: [Manual]
      summary: Manual contents
      description: >
        The manual's structure — sections, each with an ordered list of pages. The client needs
        this before it can render a sidebar or resolve `/manual` to a first page, so it is a
        separate request from any page's body.

        The manual is page-based and chrome-less: this endpoint publishes the structure and the
        client renders the navigation, because the sidebar has to track which page is open.
      operationId: getManualContents
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Ordered sections, each with its ordered pages.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [title, pages]
                  properties:
                    title:
                      type: string
                      example: Concepts
                    pages:
                      type: array
                      items:
                        type: object
                        required: [slug, title]
                        properties:
                          slug:
                            type: string
                            example: introduction
                          title:
                            type: string
                            example: Introduction
        "500":
          description: Internal server error.

  /manual/{slug}:
    get:
      tags: [Manual]
      summary: One manual page
      description: >
        One page of the manual as a chrome-less HTML fragment — no navigation, since the
        sidebar is the client's. The fragment's semantic class names are the styling contract.

        Pages are embedded in the binary and looked up by slug, so an unlisted page is
        unreachable rather than merely unlisted. An unknown slug is a 404 rather than a
        fallback to the introduction: a stale bookmark should say so, not silently show
        something else.
      operationId: getManualPage
      security:
        - bearerAuth: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
          description: Page slug, from `GET /manual`.
          example: introduction
      responses:
        "200":
          description: The page body.
          content:
            text/html:
              schema:
                type: string
        "404":
          description: No such manual page.
        "500":
          description: The page is listed in the contents but not embedded — a build-time mistake.

  /firms:
    get:
      tags: [Parties & Accounts]
      summary: List all firms
      description: >
        Returns every firm — every set of books — this instance keeps. A firm is the
        accounting boundary: every account names one, and every journal balances
        within exactly one.


        Read-only. A firm is a party holding the `firm` role, so firms are created and
        retired through `PUT /parties`; there is nothing here that could be created
        apart from its party. A firm's `id`, `code` and `name` are the party's.
      operationId: listFirms
      responses:
        "200":
          description: Array of firms.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Firm"

  /firms/{firm}/accounts:
    get:
      tags: [Parties & Accounts]
      summary: List all accounts
      description: >
        Returns every account in the system. Accounts are the entities that hold
        positions in the ledger. Each account has a `type` (customer, inventory, pab,
        custody, control or bank) and an `allocation_method` that controls trading lot
        allocation.
      operationId: listAccounts
      parameters:
        - name: firm
          in: path
          required: true
          schema:
            type: string
          description: >
            Code of the firm whose books to act on. The caller must hold a grant for
            it; an unknown code is a 400 and an ungranted one a 403.
          example: PERSUS
      responses:
        "200":
          description: Array of accounts.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AccountSummary"
        "500":
          description: Internal server error.

    put:
      tags: [Parties & Accounts]
      summary: Upsert accounts (bulk)
      description: >
        Creates or updates accounts in bulk. Each item is matched by `code`;
        if an account with that code already exists all mutable fields are updated,
        otherwise a new record is inserted.


        The response always returns HTTP 200 with a per-item result array, even
        when some items fail. Callers must inspect each item's `status` field.
        Maximum 500 items per request.


        **links** are merged into the account — existing links not mentioned in
        the request are preserved (no deletions). Each link references an
        party by **code** (e.g. `"JOE_BLOGGS"`); if the party cannot be
        resolved the entire item is returned with `status: "error"`.


        Party slots: an account carries up to three references to parties beside
        its firm — `counterparty` (the other end of the relationship the account
        records), `correspondent` (who introduced the business) and
        `responsible_party` (who is answerable for it). Which slots an account
        type may fill, which it must, and which role the named party has to hold
        vary by `type`; see each field below. Filling a slot the type forbids, or
        leaving a required one empty, returns HTTP 400 for the entire request.


        **cash_sweep** enrolls the account in a cash sweep program, only
        valid for `customer` accounts (HTTP 400 for the entire request
        otherwise). If omitted, any existing enrollment is left unchanged
        (it is not cleared). `program` must reference an existing sweep
        program by code and `retention_amount` is mandatory — if either
        can't be resolved/parsed, the item is returned with `status:
        "error"`.
      operationId: upsertAccounts
      parameters:
        - name: firm
          in: path
          required: true
          schema:
            type: string
          description: >
            Code of the firm whose books to act on. The caller must hold a grant for
            it; an unknown code is a 400 and an ungranted one a 403.
          example: PERSUS
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              maxItems: 500
              items:
                type: object
                required: [code, type, name]
                properties:
                  code:
                    type: string
                    description: Unique identifier for the account. Used as the upsert key.
                    example: JOEBLOGGS
                  type:
                    type: string
                    enum: [customer, inventory, pab, custody, control, bank, sbl]
                    description: >
                      Account type. `pab` = Proprietary Account of a Broker-dealer: a
                      correspondent's own positions and cash on this firm's books, which
                      **requires** a `correspondent`. `bank` = sweep program bank account.
                  counterparty:
                    type: string
                    description: >
                      Party code of the other end of the relationship this account
                      records — the customer whose money it is, the custodian holding the
                      stock, the bank taking the deposit, the correspondent whose `pab`
                      it is. The account's `firm` is the near end.


                      **Required** for `custody` (role `custodian`), `bank` (role
                      `bank`) and `pab` (role `correspondent`). **Optional** for
                      `customer` (role `customer`), where omitting it makes the account
                      an omnibus — balances pooled for end beneficiaries the firm does
                      not identify. **Rejected** for `inventory`, where the firm is both
                      sides of its own positions, and for `control`, whose other side is
                      a depository in one use and a revenue authority in another and so
                      is left unmodelled until something reads it.


                      Supplying one on a type that cannot have it, or omitting one where
                      it is required, fails the whole request with a 400; an unresolvable
                      code, or a party without the required role, fails that item with
                      `status: "error"`.
                    example: JOE_BLOGGS
                  correspondent:
                    type: string
                    description: >
                      Party code of the correspondent who introduced this account's
                      business — a third party to the relationship, standing on the
                      firm's side rather than at either end of it.


                      **Optional** for `customer` and **rejected** for every other type.
                      A `pab` is excluded deliberately: the correspondent *owns* that
                      account rather than introducing it, so it is named as
                      `counterparty` instead and appears once rather than twice.


                      **Usually omit this.** Where the account names a
                      `responsible_party`, the correspondent is *derived* from it: that
                      party belongs to one branch, and a branch hangs off at most one
                      correspondent, so naming the rep already determines who
                      introduced the account. Sending it is only necessary when there
                      is no responsible party, or when the rep's branch hangs off both
                      this firm and a correspondent — a shared office — in which case
                      the item fails asking for it.


                      Sent explicitly, it is still checked: a correspondent the
                      responsible party does not belong to fails the item. A firm is
                      *not* its own correspondent, and naming one fails outright.
                      The party named must hold the `correspondent` role.
                    example: PERSCA
                  responsible_party:
                    type: string
                    description: >
                      Party code of whoever is answerable for this account: a **rep**
                      for `customer`, a **trader** for `inventory` and `pab`. Which role
                      is required depends on the account's own type, so naming a trader
                      on a customer account fails that item.


                      **Required** for `customer` — every customer account names a rep.
                      **Optional** for `inventory` and `pab`, where a desk account
                      between traders or a correspondent's own book can legitimately
                      have nobody named. **Rejected** for `custody`, `control` and
                      `bank`, which have nobody answerable for them in this sense.


                      This is current state. The rep a *trade* was done under is recorded
                      on the trade and does not move when an account is reassigned.
                    example: REP_SMITH
                  name:
                    type: string
                    description: Display name of the account.
                    example: Joe Bloggs
                  allocation_method:
                    type: string
                    enum: [none, fifo, lifo, wac]
                    default: none
                    description: How an event is allocated across lots. For ownership accounts (customer, inventory, pab) this is the trading book cost method.
                  settlement_mode:
                    type: string
                    enum: [none, cns, tft]
                    default: none
                    description: >
                      Settlement lot keying for control accounts: `cns` nets
                      obligations per (security, account, subaccount); `tft`
                      settles each trade independently (lot key = trade SEID).


                      **Fixed once the account exists.** The mode in force when a
                      settlement lot was written is baked into that lot's key, so
                      changing it would strand the account's open lots. An update
                      naming a different mode fails that item, and since this is a
                      full replacement, *omitting* the field on an account that has
                      one asks for `none` and fails the same way — restate the
                      current mode when updating a control account.
                  address1:
                    type: string
                  address2:
                    type: string
                  city:
                    type: string
                  state:
                    type: string
                  zip:
                    type: string
                  cash_sweep:
                    type: object
                    description: >
                      Sweep program enrollment. Only valid for `customer`
                      accounts. Omit to leave any existing enrollment
                      unchanged.
                    required: [program, retention_amount]
                    properties:
                      program:
                        type: string
                        description: Sweep program code.
                        example: FDIC_PANEL
                      retention_amount:
                        type: string
                        description: Decimal amount of cash retained before sweeping.
                        example: "1000.00"
                      sweep_cash_debits:
                        type: boolean
                        default: true
                        description: >
                          Morning recall trigger: bring back enough of the
                          swept balance to cover a TD debit balance on the
                          CASH subaccount.
                      sweep_margin_deficits:
                        type: boolean
                        default: true
                        description: >
                          Morning recall trigger: bring back enough of the
                          swept balance to cover a margin maintenance
                          deficiency from the latest close-of-trading margin
                          snapshot; recalled funds land directly in the
                          MARGIN subaccount. When both triggers apply and the
                          swept balance can't cover both, the cash debit is
                          funded first.
            example:
              - code: JOEBLOGGS
                type: customer
                name: Joe Bloggs
                allocation_method: fifo
                address1: 142 W 72nd St
                city: New York
                state: NY
                zip: "10023"
                counterparty: JOE_BLOGGS
                responsible_party: REP_SMITH
                cash_sweep:
                  program: FDIC_PANEL
                  retention_amount: "1000.00"
              - code: PROP1
                type: inventory
                name: Proprietary Account 1
                allocation_method: wac
      responses:
        "200":
          description: >
            Per-item results in the same order as the request. Always returned,
            even on partial failure.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [code, status]
                  properties:
                    code:
                      type: string
                      description: The account code from the request.
                    status:
                      type: string
                      enum: [created, updated, error]
                      description: Outcome for this item.
                    error:
                      type: string
                      description: Error message, present only when status is "error".
              example:
                - code: JOEBLOGGS
                  status: created
                - code: PROP1
                  status: updated
        "400":
          description: >
            The request could not be interpreted, and nothing was written —
            malformed JSON, more than 500 items, an item missing `code` or
            `name`, or an unparseable `type`, `allocation_method` or
            `settlement_mode`.


            Anything the request *states* validly but that cannot be applied to
            a particular account — a party slot the type forbids or requires, a
            party code that does not resolve, a party not holding the role the
            slot needs, a responsible party that does not roll up to the
            account's introducer, a `settlement_mode` differing from the one the
            account was created with, or `cash_sweep` on a non-customer account —
            is reported as a `200` with that item's `status` set to `error`. One
            unusable account does not reject the other forty-nine.
        "500":
          description: Internal server error (connection-level failure).

  /firms/{firm}/accounts/{code}:
    get:
      tags: [Parties & Accounts]
      summary: Account detail
      description: >
        Returns static data and relationship links for a single account. The `links`
        array identifies the real-world parties connected to this account —
        for example, the `holder` (the beneficial owner) and the `institution`
        (the custodian or counterparty). `cash_sweep` is present only if the
        account (always type `customer`) is enrolled in a sweep program.
      operationId: getAccount
      parameters:
        - name: firm
          in: path
          required: true
          schema:
            type: string
          description: Code of the firm whose books to act on.
          example: PERSUS
        - name: code
          in: path
          required: true
          schema:
            type: string
          description: Account code (e.g. `JOEBLOGGS`).
          example: JOEBLOGGS
      responses:
        "200":
          description: Account static data including party links.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountDetail"
              example:
                id: 1
                code: JOEBLOGGS
                type: customer
                name: Joe Bloggs Account
                allocation_method: fifo
                address1: "123 Main St"
                address2: ""
                city: Springfield
                state: IL
                zip: "62701"
                counterparty: JOE_BLOGGS
                responsible_party: REP_SMITH
                customer_shape: direct
                cash_sweep:
                  program: FDIC_PANEL
                  retention_amount: "1000.00"
        "404":
          description: >
            No account with that code exists in this firm. An account belonging to a
            different firm is reported as not-found rather than forbidden: within this
            firm's namespace it genuinely does not exist.
        "500":
          description: Internal server error.

  /firms/{firm}/reps:
    get:
      tags: [Parties & Accounts]
      summary: The registered representatives who reach this firm
      description: >
        Parties holding the Rep role whose branch reaches this firm: those in a branch
        of the firm itself, and those in a branch of a correspondent that currently
        introduces business to it.


        One route per role rather than one route taking a role or an account type. "This
        firm's reps" is a resource; which role a given kind of account wants in its
        `responsible_party` slot is a fact about accounts, and a caller creating one
        knows its own type. The write validates the choice regardless, so asking the
        wrong list yields a refused account rather than a bad one.


        Each entry carries what naming it would imply about who introduced the business.
        `direct` and `correspondent` are **not** exclusive: both present means the
        party's branch hangs off this firm *and* a correspondent, and an account naming
        them must state `correspondent` explicitly because the server will not guess.


        Deliberately narrower than what the write path accepts. A correspondent that has
        stopped introducing to this firm may still have accounts on its books, and its
        reps remain valid on those; they are not offered for new ones.
      operationId: listReps
      parameters:
        - name: firm
          in: path
          required: true
          schema:
            type: string
          example: PERSUS
      responses:
        "200":
          description: Reps reaching this firm, ordered by code (possibly empty).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PartyRollup"
              example:
                - code: REP_SMITH
                  name: Smith
                  role: rep
                  branch: NYC_RETAIL
                  direct: true
                - code: REP_QUAYLE
                  name: Quayle
                  role: rep
                  branch: MAD_ABQ
                  direct: false
                  correspondent: MADRIGAL
        "500":
          description: Internal server error.

  /firms/{firm}/traders:
    get:
      tags: [Parties & Accounts]
      summary: The traders who reach this firm
      description: >
        Parties holding the Trader role whose branch reaches this firm — the same
        question as `/reps`, asked of the other role. See that route for the shape of
        an entry and why the two are separate.
      operationId: listTraders
      parameters:
        - name: firm
          in: path
          required: true
          schema:
            type: string
          example: PERSUS
      responses:
        "200":
          description: Traders reaching this firm, ordered by code (possibly empty).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PartyRollup"
              example:
                - code: TRADER_KELLY
                  name: Kelly
                  role: trader
                  branch: NYC_TRADING
                  direct: true
        "500":
          description: Internal server error.

  /firms/{firm}/balance:
    get:
      tags: [Ledger]
      summary: Trial balance — cash positions as of a date
      description: >
        Returns the net cash (money leg) position for every `(account, subaccount, nature,
        currency)` group as of the given date, on both a transaction-date (TD) and
        value-date (VD) basis. Rows where both `td_qty` and `vd_qty` are zero are excluded.

        **Snapshot caching:** If a ledger closing exists for the requested date, the stored
        trial balance snapshot is returned (`is_cached: true`) for fast, audit-consistent
        retrieval. Otherwise, the balance is computed live from the entries table
        (`is_cached: false`).

        **Filtering:** Use `account` to scope to a single account. Use `nature` to filter
        by income classification — pass an empty string (`nature=`) to return only normal
        (non-income) entries, or a specific value like `CommissionIncome` to return only
        income entries of that type. Omit `nature` entirely to return all rows regardless
        of nature.
      operationId: trialBalance
      parameters:
        - name: firm
          in: path
          required: true
          schema:
            type: string
          description: Code of the firm whose books to act on.
          example: PERSUS
        - name: as_of
          in: query
          required: true
          schema:
            type: string
            format: date
          description: Include all entries on or before this date (YYYY-MM-DD). Both TD and VD cuts are applied relative to this date.
          example: "2026-06-10"
        - name: account
          in: query
          required: false
          schema:
            type: string
          description: Restrict results to a single account by code.
          example: JOEBLOGGS
        - name: nature
          in: query
          required: false
          schema:
            type: string
            enum: ["", "CustomerChargeIncome", "CommissionIncome", "InterestIncome", "InterestAccrual", "MarketValue", "RPL", "URPL", "OwnMoneyEquity", "OwnPosition", "FXDealing", "FXRounding", "FXURPL", "SecuritiesLendingIncome"]
          description: >
            Filter by entry nature. If omitted, all natures are returned.
            Pass an empty string (`nature=`) to return only normal (NatureNone) entries,
            i.e. the standard balance sheet / P&L trial balance without income segregation accounts.
      responses:
        "200":
          description: >
            Trial balance rows wrapped with snapshot metadata. Check `is_cached` to determine
            whether the data came from a stored snapshot or a live computation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrialBalanceResult"
              example:
                snapshot_id: 42
                snapped_at: "2026-06-10T20:00:00Z"
                is_cached: true
                rows:
                  - account: JOEBLOGGS
                    subaccount: ""
                    nature: ""
                    ccy: USD
                    td_qty: "-10500.00"
                    vd_qty: "-10500.00"
                  - account: PROP1
                    subaccount: ""
                    nature: ""
                    ccy: USD
                    td_qty: "10500.00"
                    vd_qty: "10500.00"
        "400":
          description: Missing or invalid `as_of` parameter, or unrecognised account/nature value.
        "500":
          description: Internal server error.

  /firms/{firm}/stock:
    get:
      tags: [Ledger]
      summary: Stock record — share positions as of a date
      description: >
        Returns the net share (stock leg) position for every `(account, subaccount, security)`
        group as of the given date, on both a transaction-date (TD) and value-date (VD) basis.
        Rows where both `td_qty` and `vd_qty` are zero are excluded.

        **Snapshot caching:** Works identically to `/balance` — if a closing exists for the
        requested date, the stored stock record snapshot is returned (`is_cached: true`).

        **Filtering:** Use `account` and/or `security` to narrow the response.
      operationId: stockRecord
      parameters:
        - name: firm
          in: path
          required: true
          schema:
            type: string
          description: Code of the firm whose books to act on.
          example: PERSUS
        - name: as_of
          in: query
          required: true
          schema:
            type: string
            format: date
          description: Include all entries on or before this date (YYYY-MM-DD).
          example: "2026-06-10"
        - name: account
          in: query
          required: false
          schema:
            type: string
          description: Restrict results to a single account by code.
          example: JOEBLOGGS
        - name: security
          in: query
          required: false
          schema:
            type: string
          description: Restrict results to a single security by code.
          example: AAPL
      responses:
        "200":
          description: >
            Stock record rows wrapped with snapshot metadata. Check `is_cached` to determine
            whether the data came from a stored snapshot or a live computation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockRecordResult"
              example:
                snapshot_id: 43
                snapped_at: "2026-06-10T20:00:00Z"
                is_cached: true
                rows:
                  - account: JOEBLOGGS
                    subaccount: CASH
                    security: AAPL
                    td_qty: "100.000000"
                    vd_qty: "0.000000"
        "400":
          description: Missing or invalid `as_of` parameter, or unrecognised account/security code.
        "500":
          description: Internal server error.

  /firms/{firm}/entries:
    get:
      tags: [Ledger]
      summary: List ledger entries
      description: >
        Returns individual double-entry ledger records. Each entry has a money leg (cash)
        and/or a stock leg (shares). Entries with `ttype = EQUITY_TRADE` have both legs;
        cash-only entries such as `CUSTOMER_DEPOSIT` only populate the money leg.

        Entries are ordered by ledger id ascending — posting order, so a book reads
        chronologically the way a journal does. For large datasets, use the filters below to
        scope the result; a firm's book runs to thousands of entries and this route has no
        paging.
      operationId: GetLedgerEntries
      parameters:
        - name: firm
          in: path
          required: true
          schema:
            type: string
          description: Code of the firm whose books to act on.
          example: PERSUS
        - name: account
          in: query
          required: false
          schema:
            type: string
          description: Restrict results to a single account by code.
          example: JOEBLOGGS
        - name: nature
          in: query
          required: false
          schema:
            type: string
            enum: ["", "CustomerChargeIncome", "CommissionIncome", "InterestIncome", "InterestAccrual", "MarketValue", "RPL", "URPL", "OwnMoneyEquity", "OwnPosition", "FXDealing", "FXRounding", "FXURPL", "SecuritiesLendingIncome"]
          description: >
            Filter by nature. If omitted, all natures are returned.
            Pass an empty string (`nature=`) to return only normal (NatureNone) entries.
        - name: seid
          in: query
          required: false
          schema:
            type: integer
            format: int64
          description: Restrict to the entries of one system event.
          example: 4821
        - name: td_from
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Lower bound on transaction date, inclusive.
          example: "2026-01-01"
        - name: td_to
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Upper bound on transaction date, inclusive — the whole named day counts.
          example: "2026-06-30"
        - name: vd_from
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Lower bound on value date, inclusive.
          example: "2026-01-01"
        - name: vd_to
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Upper bound on value date, inclusive — the whole named day counts.
          example: "2026-06-30"
        - name: security
          in: query
          required: false
          schema:
            type: string
          description: Restrict to entries whose **stock** leg is in this security.
          example: AAPL
        - name: ttype
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
          description: >
            Restrict to these transaction types. Repeatable — `?ttype=TRADE&ttype=COMMISSION`
            returns both.
          example: TRADE
      responses:
        "200":
          description: Array of ledger entries.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Entry"
              example:
                - id: 101
                  seid: 50
                  transaction_date: "2026-06-10"
                  value_date: "2026-06-12"
                  account: JOEBLOGGS
                  subaccount: CASH
                  nature: ""
                  ttype: EQUITY_TRADE
                  money_qty:
                    security: USD
                    amount: "19589.00"
                  stock_qty:
                    security: AAPL
                    amount: "100.000000"
        "400":
          description: Unrecognised account code, nature, security or transaction type, or an unparseable date.
        "500":
          description: Internal server error.

  /firms/{firm}/journals:
    post:
      tags: [Ledger]
      summary: Post a manual journal
      description: >
        Posts a raw, caller-supplied list of entries as a single balanced journal under a
        freshly allocated SEID — everything on an `Entry` except `id`, `seid`, and `ttype`,
        which are system-assigned (every entry posted here gets `ttype = MANUAL_JOURNAL`, since
        this is a thin translation over the same journal-writing path used internally
        (`WriteJournal`) for postings that don't correspond to one of the system's own business
        events — deposits, trades, sweeps, etc. — each of which has its own `ttype`).

        The entries must form one balanced journal: every entry must share the same
        `transaction_date`/`value_date`, and `money_qty`/`stock_qty` amounts must net to zero per
        security once direction is applied. The journal's knowledge date is not an input: it is
        stamped from the system clock at allocation and must be strictly after the current
        high-watermark, same as any other event — see `POST /closings`.

        Unlike the `Entry` schema returned by `GET /entries` (which uses a signed amount),
        `money_qty`/`stock_qty` here take a strictly positive `amount` plus an explicit
        `direction` — `DR`/`CR` for `money_qty`, `LONG`/`SHORT` for `stock_qty` — so callers
        don't have to reason about this system's sign conventions when posting. As with amounts
        elsewhere in this API (e.g. `POST /securities/{code}/prices`), a zero amount is invalid;
        omit the leg entirely (leave `security` empty) if it doesn't apply.


        **Maker/checker.** The outcome depends on the caller's permissions. A caller with
        `journal:self_post` (including any key-only trusted machine such as the seed) posts
        directly and gets `201` with the entries. A caller with only `journal:make` has the
        journal **queued for approval** — it returns `202` with a `PendingAction` and nothing is
        posted until a checker approves it via `POST /approvals/journal/{id}/approve`. A caller with
        neither gets `403`.
      operationId: postJournal
      parameters:
        - name: firm
          in: path
          required: true
          schema:
            type: string
          description: Code of the firm whose books to act on.
          example: PERSUS
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entries]
              properties:
                entries:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items:
                    $ref: "#/components/schemas/JournalEntryInput"
            example:
              entries:
                - transaction_date: "2026-02-01T00:00:00Z"
                  value_date: "2026-02-01T00:00:00Z"
                  account: JOEBLOGGS
                  subaccount: CASH
                  nature: ""
                  money_qty:
                    security: USD
                    amount: "100.00"
                    direction: DR
                - transaction_date: "2026-02-01T00:00:00Z"
                  value_date: "2026-02-01T00:00:00Z"
                  account: PROP1
                  nature: ""
                  money_qty:
                    security: USD
                    amount: "100.00"
                    direction: CR
      responses:
        "201":
          description: >
            Journal posted directly (caller had `journal:self_post`). Returns the persisted
            entries, with system-assigned `id`/`seid` filled in.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Entry"
        "202":
          description: >
            Journal queued for approval (caller had `journal:make` but not `journal:self_post`).
            Nothing is posted yet. Returns the created `PendingAction`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PendingAction"
        "400":
          description: >
            Malformed JSON, empty entry list, more than 500 entries, an unrecognised
            account/security/subaccount/nature code, an invalid or missing direction, a zero
            amount, or the entries don't form a balanced journal (mismatched dates, or
            money/stock legs that don't net to zero per security).
        "403":
          description: Caller has neither `journal:self_post` nor `journal:make`.
        "422":
          description: The stamped knowledge date is not after the current high-watermark — the period is already closed.
        "500":
          description: Internal server error.

  /approvals:
    get:
      tags: [Approvals]
      summary: List pending actions in the approval queue
      description: >
        A caller with `journal:check` sees the whole queue; a caller with only `journal:make`
        sees only their own submissions. Defaults to `status=pending`.
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, approved, rejected]
            default: pending
      responses:
        "200":
          description: Matching pending actions.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PendingAction"
        "403":
          description: Caller has neither `journal:check` nor `journal:make`.
  /approvals/journal/{id}/approve:
    post:
      tags: [Approvals]
      summary: Approve a staged manual journal
      description: >
        Requires `journal:check` and a logged-in user who is **not** the maker. Re-validates and
        posts the stored journal against the world as it is now, allocating a real seid and writing
        the ledger; the knowledge date is stamped from the system clock, so it lands at approval
        time — when the journal actually becomes real. The posting and the queue
        resolution commit together. If the payload can no longer be posted, the action stays
        pending and `422` is returned.


        Approving a journal and approving a business event are **separate authorities** with
        separate permissions, so they are separate endpoints. This route serves journals only:
        given the id of a staged business event it returns `404`, whatever permissions the caller
        holds. Use `/approvals/event/{id}/approve` for those. The pending-action id space is shared
        across both kinds — `event_type` on the queue entry tells you which route applies.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Approved. Returns the resolved `PendingAction` with `resulting_seid` set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PendingAction"
        "403":
          description: Caller lacks `journal:check`, is not logged in, or is the maker (self-approval).
        "404":
          description: No such pending action, or the action is not a manual journal.
        "409":
          description: >
            The action is already approved or rejected, or another checker is resolving it right now.
        "422":
          description: The stored payload can no longer be posted (e.g. a closing now blocks it).

  /approvals/event/{id}/approve:
    post:
      tags: [Approvals]
      summary: Approve a staged business event
      description: >
        Requires `event:check` and a logged-in user who is **not** the maker. Re-parses and posts
        the stored event against the world as it is now, allocating a real seid and writing the
        ledger. The posting and the queue resolution commit together. If the payload can no longer
        be posted, the action stays pending and `422` is returned.


        This route serves business events only: given the id of a staged manual journal it returns
        `404`, whatever permissions the caller holds. Use `/approvals/journal/{id}/approve` for
        those.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Approved. Returns the resolved `PendingAction` with `resulting_seid` set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PendingAction"
        "403":
          description: Caller lacks `event:check`, is not logged in, or is the maker (self-approval).
        "404":
          description: No such pending action, or the action is not a business event.
        "409":
          description: >
            The action is already approved or rejected, or another checker is resolving it right now.
        "422":
          description: The stored payload can no longer be posted.
  /approvals/{id}/reject:
    post:
      tags: [Approvals]
      summary: Reject a pending action
      description: Requires `journal:check` and a logged-in user who is not the maker. Records a reason; nothing is posted.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
      responses:
        "200":
          description: Rejected. Returns the resolved `PendingAction`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PendingAction"
        "400":
          description: Missing reason or invalid JSON.
        "403":
          description: Caller lacks `journal:check`, is not logged in, or is the maker.
        "404":
          description: No such pending action.
        "409":
          description: The action is already approved or rejected.

  /firms/{firm}/lots/positions:
    get:
      tags: [Book Cost]
      summary: Lot positions — aggregated cost basis by account and security
      description: >
        Returns an aggregated lot position for every `(account, subaccount, security, currency)`
        combination that has open or historical lots. Each row shows the net quantity, total
        book cost of the remaining position, and cumulative realised P&L.

        Only accounts with a `allocation_method` other than `none` have lot positions.
        Use `GET /lots/positions/{account}/{security}` to see the individual lot rows
        that make up a position.
      operationId: lotPositions
      parameters:
        - name: firm
          in: path
          required: true
          schema:
            type: string
          description: Code of the firm whose books to act on.
          example: PERSUS
        - name: account
          in: query
          required: false
          schema:
            type: string
          description: Restrict to a single account by code.
          example: JOEBLOGGS
        - name: security
          in: query
          required: false
          schema:
            type: string
          description: Restrict to a single security by code.
          example: AAPL
      responses:
        "200":
          description: Array of aggregated lot positions.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LotPosition"
              example:
                - security: AAPL
                  currency: USD
                  account: JOEBLOGGS
                  subaccount: CASH
                  qty: "100.000000"
                  book_cost: "19589.00"
                  rpl: "0.00"
        "400":
          description: Unrecognised account or security code.
        "500":
          description: Internal server error.

  /firms/{firm}/lots/positions/{account}/{security}:
    get:
      tags: [Book Cost]
      summary: Lot detail — individual lot rows for an account / security
      description: >
        Returns the ordered list of lot rows for the given account and security. Each row
        represents either the opening of a lot (a buy) or a relief against an existing lot
        (a sell). Use this to trace the history of a position and see how realised P&L
        was calculated.

        The `lot_seq` field groups rows into lots — all rows with the same `lot_seq` belong
        to the same lot. The opening row has `is_opening: true`; subsequent relief rows
        are attached to that lot until it is fully closed (`is_closed: true` on the opening row).

        If a trade has not yet been through the lot-matching process, its row will appear
        with `lot_id: 0` (unlotted).
      operationId: tradingLots
      parameters:
        - name: firm
          in: path
          required: true
          schema:
            type: string
          description: Code of the firm whose books to act on.
          example: PERSUS
        - name: account
          in: path
          required: true
          schema:
            type: string
          description: Account code.
          example: JOEBLOGGS
        - name: security
          in: path
          required: true
          schema:
            type: string
          description: Security code.
          example: AAPL
        - name: subaccount
          in: query
          required: false
          schema:
            type: string
            enum: ["", "CASH", "MARGIN", "FDIC", "MM", "BORROWED", "ONLOAN", "FREE", "SEG"]
          description: Restrict to a specific subaccount. Omit to return all subaccounts.
      responses:
        "200":
          description: Lot detail including the account's allocation method and all lot rows.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LotsDetail"
              example:
                account: JOEBLOGGS
                security: AAPL
                subaccount: ""
                allocation_method: fifo
                rows:
                  - lot_id: 1
                    lot_seq: 1
                    seid: 50
                    datetime: "2026-06-10"
                    currency: USD
                    qty: "100.000000"
                    tx_amount: "19589.00"
                    book_cost: "19589.00"
                    rpl: "0.00"
                    is_opening: true
                    is_closed: false
        "404":
          description: Account or security not found.
        "500":
          description: Internal server error.

  /firms/{firm}/lots/settlement/positions:
    get:
      tags: [Settlements]
      summary: Settlement positions — open delivery and receipt obligations
      description: >
        Returns aggregated open settlement obligations for each `(account, subaccount, security)`
        combination. A positive `qty` means the account is due to **receive** securities
        (buy-side unsettled); a negative `qty` means the account is due to **deliver**
        securities (sell-side unsettled, i.e. a potential fail).

        `oldest_vd` is the value date of the oldest unclosed settlement lot in the group —
        the "fail age" used to identify trades that have not settled on time. A lot is
        unclosed if the matching confirmation has not yet been recorded.

        Settlements are tracked independently of cost-basis lot accounting and apply to all
        account types.
      operationId: settlementLotPositions
      parameters:
        - name: firm
          in: path
          required: true
          schema:
            type: string
          description: Code of the firm whose books to act on.
          example: PERSUS
        - name: account
          in: query
          required: false
          schema:
            type: string
          description: Restrict to a single account by code.
        - name: security
          in: query
          required: false
          schema:
            type: string
          description: Restrict to a single security by code.
      responses:
        "200":
          description: Array of aggregated open settlement obligations.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SettlementPosition"
              example:
                - security: AAPL
                  account: JOEBLOGGS
                  subaccount: CASH
                  qty: "100.000000"
                  oldest_vd: "2026-06-12"
        "400":
          description: Unrecognised account or security code.
        "500":
          description: Internal server error.

  /firms/{firm}/lots/settlement/positions/{account}/{security}:
    get:
      tags: [Settlements]
      summary: Settlement lot detail — individual settlement lots for an account / security
      description: >
        Returns the individual settlement lot rows for the given account and security.
        Each opening lot corresponds to a `DELIVER` or `RECEIVE` ledger entry; it is
        closed when the matching confirmation is recorded. Use this to diagnose specific
        failing trades — each row shows the SEID of the originating instruction and
        its value date.
      operationId: settlementLots
      parameters:
        - name: firm
          in: path
          required: true
          schema:
            type: string
          description: Code of the firm whose books to act on.
          example: PERSUS
        - name: account
          in: path
          required: true
          schema:
            type: string
          description: Account code.
        - name: security
          in: path
          required: true
          schema:
            type: string
          description: Security code.
        - name: subaccount
          in: query
          required: false
          schema:
            type: string
          description: Restrict to a specific subaccount. Omit to return all subaccounts.
      responses:
        "200":
          description: Settlement lot detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettlementLotsDetail"
        "404":
          description: Account or security not found.
        "500":
          description: Internal server error.

  /firms/{firm}/closings:
    get:
      tags: [Closings]
      summary: List all ledger closings
      description: >
        Returns end-of-day closing events in reverse chronological order. Each closing
        represents a point in time at which the trial balance, stock record, and
        mark-to-market snapshots were frozen. Use the IDs from `GET /closings/{id}` to
        retrieve the individual snapshot data.
      operationId: listClosings
      parameters:
        - name: firm
          in: path
          required: true
          schema:
            type: string
          description: Code of the firm whose books to act on.
          example: PERSUS
        - name: limit
          in: query
          required: false
          schema:
            type: integer
          description: Maximum number of closings to return (most recent first). Omit for no limit.
          example: 1
        - name: date
          in: query
          required: false
          schema:
            type: string
            format: date
          description: >
            Restrict to closings whose `closed_at` falls on this calendar date (YYYY-MM-DD).
            Used to find the closing ID for a specific date, e.g. before fetching
            `margin_maintenance_snapshot_id` via `GET /closings/{id}`.
          example: "2026-06-10"
      responses:
        "200":
          description: Array of closings ordered by `closed_at` descending.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Closing"
              example:
                - id: 1
                  closing_type: CLOSE_OF_TRADING
                  closed_at: "2026-06-10T20:00:00Z"
        "400":
          description: Malformed `date`.
        "500":
          description: Internal server error.
    post:
      tags: [Closings]
      summary: Record a ledger closing
      description: >
        Records a close-of-trading (or other) closing **as of now** — the closing instant is
        stamped from the system clock, not supplied by the caller, for the same reason
        knowledge dates are not (see `GET /system/clock`). To place closings on specific dates,
        as a seed or simulation does, drive the clock. Before recording the closing, all
        unlotted trading rows and settlement obligations are lotted via `RunTradingLots` and
        `RunSettlementLots`. Trial balance, stock record, and mark-to-market snapshots are then
        frozen atomically.


        The resulting `closed_at` must be strictly after that firm's most recent existing
        closing (its high-watermark). Returns `422` if this constraint is violated — under a wall clock that
        cannot normally happen, since time moves on between closings; under a simulated clock it
        means closing twice without advancing.
      operationId: createClosing
      parameters:
        - name: firm
          in: path
          required: true
          schema:
            type: string
          description: Code of the firm whose books to act on.
          example: PERSUS
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [firm, closing_type]
              properties:
                firm:
                  type: string
                  description: >
                    Code of the firm whose books are being closed. Closings are per
                    firm: another firm's ledger and high-watermark are untouched.
                  example: PERSUS
                closing_type:
                  type: string
                  enum: [CLOSE_OF_TRADING, START_OF_DAY]
                  description: The type of closing event.
            example:
              firm: PERSUS
              closing_type: CLOSE_OF_TRADING
      responses:
        "201":
          description: Closing recorded. Returns the new closing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Closing"
              example:
                id: 1
                firm: PERSUS
                closing_type: CLOSE_OF_TRADING
                closed_at: "2026-01-01T17:00:00Z"
        "400":
          description: Unknown or missing `firm`, or unknown `closing_type`.
        "422":
          description: The closing instant is not after the current high-watermark.
        "500":
          description: Internal server error.

  /firms/{firm}/closings/{id}:
    get:
      tags: [Closings]
      summary: Closing detail — snapshot IDs for a specific closing
      description: >
        Returns a closing record along with the IDs of its associated snapshots.
        Pass these IDs to the `/snapshots/*` endpoints to retrieve the actual snapshot data.

        - `trial_balance_snapshot_id` → `GET /snapshots/trial-balance/{id}`
        - `stock_record_snapshot_id` → `GET /snapshots/stock-record/{id}`
        - `mtm_snapshot_id` → `GET /snapshots/mtm/{id}`
        - `interest_accrual_snapshot_id` → `GET /snapshots/interest-accrual/{id}`
        - `finance_trial_balance_snapshot_id` → `GET /snapshots/finance-trial-balance/{id}`
      operationId: getClosing
      parameters:
        - name: firm
          in: path
          required: true
          schema:
            type: string
          description: Code of the firm whose books to act on.
          example: PERSUS
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: Closing ID.
          example: 1
      responses:
        "200":
          description: Closing record with its snapshot IDs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClosingDetail"
              example:
                id: 1
                closing_type: CLOSE_OF_TRADING
                closed_at: "2026-06-10T20:00:00Z"
                trial_balance_snapshot_id: 42
                stock_record_snapshot_id: 43
                mtm_snapshot_id: 44
                interest_accrual_snapshot_id: 48
                sbl_contracts_snapshot_id: 61
                finance_trial_balance_snapshot_id: 49
        "404":
          description: >
            No closing with the given ID exists **on this firm's books**. A closing
            belonging to another firm answers the same way as one that does not exist —
            the same rule the `/snapshots/*` reads follow, and it applies here first
            because this is where their IDs come from.
