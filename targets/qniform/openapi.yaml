  /firms/{firm}/events/{seid}/settlement-net:
    get:
      tags: [Settlements]
      summary: Settlement net for an event
      description: >
        Returns all settlement lot rows belonging to every lot that the given SEID
        participates in. Rows are divided into two sides:


        - **obligation** — rows arising from trade events (EQUITY_TRADE, BOND_TRADE, etc.)
          that create settlement obligations.

        - **fulfillment** — rows arising from Settlement events that discharge those obligations.


        If the obligation rows net to zero (e.g. matching buy and sell on the same VD),
        there will be no fulfillment rows, since CNS requires no physical settlement.
      operationId: getSettlementNet
      parameters:
        - name: firm
          in: path
          required: true
          schema:
            type: string
          description: Code of the firm whose books to act on.
          example: PERSUS
        - name: seid
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Flat list of settlement lot rows with side classification.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SettlementNetRow"
        "400":
          description: Invalid seid.
        "500":
          description: Internal server error.

  /firms/{firm}/work-items:
    get:
      tags: [Work Items]
      summary: Operational exception queue
      description: >
        Returns the firm's work items — problems raised by operational processes that a
        human needs to look at.


        Each item is one problem about one subject, not one occurrence of it: a security
        that has gone unpriced for twenty consecutive closings is a single item with
        `occurrence_count: 20` and a `first_seen` date in January, because that is the
        signal worth acting on. `reopen_count` counts how often the condition has come
        back after someone resolved it — a non-zero value means earlier resolutions were
        overtaken by events.


        `severity` is assigned by the system from the kind of problem and is not
        adjustable. Currently produced by the mark-to-market snapshot: securities with no
        price on file, and positions marked at a price past the firm's tolerance.
      operationId: listWorkItems
      parameters:
        - name: firm
          in: path
          required: true
          schema:
            type: string
          description: Code of the firm whose books to act on.
          example: PERSUS
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [open, all]
          description: >
            Defaults to open items only. Pass `all` to include resolved items, for
            auditing what has already been dealt with.
          example: all
      responses:
        "200":
          description: Array of work items, most recently seen first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkItem"
              example:
                - id: 12
                  kind: mtm_no_price
                  severity: severe
                  subject_type: security
                  subject: ACME
                  status: open
                  occurrence_count: 20
                  reopen_count: 0
                  first_seen: "2026-01-02T17:00:00Z"
                  last_seen: "2026-01-29T17:00:00Z"
        "500":
          description: Internal server error.

  /firms/{firm}/work-items/{id}/resolve:
    post:
      tags: [Work Items]
      summary: Resolve a work item
      description: >
        Closes a work item, appending to its resolution log. Requires the
        `work_item:resolve` permission and a logged-in user, since the resolution records
        who decided.


        Nothing verifies the claim. If the problem was not really dealt with, the next run
        that finds it again reopens the item and increments its `reopen_count` — recurrence
        is the audit, which is why resolutions need no expiry.
      operationId: resolveWorkItem
      parameters:
        - name: firm
          in: path
          required: true
          schema:
            type: string
          description: Code of the firm whose books to act on.
          example: PERSUS
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: Work item ID.
          example: 12
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  $ref: "#/components/schemas/SelectableResolutionReason"
                note:
                  type: string
                  description: >
                    Free text. Required when `reason` is `handled_externally`, which is
                    useless without saying where.
                  example: Chased the vendor; file resumed Tuesday.
      responses:
        "204":
          description: Resolved.
        "400":
          description: Unknown reason, missing required note, or malformed body.
        "401":
          description: No logged-in user to record as the resolver.
        "403":
          description: Caller lacks `work_item:resolve`.
        "404":
          description: No such work item on this firm's books.
        "409":
          description: The item is already resolved.

  /firms/{firm}/work-items/{id}/assignment:
    put:
      tags: [Work Items]
      summary: Assign a work item to a desk
      description: >
        Sets the role that owns the item, or clears it when `role` is empty. Assignment is
        a label: it does not gate who may resolve, and nothing is notified. It survives a
        reopen, since the desk that owned a problem still owns it when it returns.


        A role rather than a user — "the pricing desk" outlives whoever is on it, and
        nothing needs reassigning when someone is away.
      operationId: assignWorkItem
      parameters:
        - name: firm
          in: path
          required: true
          schema:
            type: string
          description: Code of the firm whose books to act on.
          example: PERSUS
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: Work item ID.
          example: 12
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role:
                  type: string
                  description: Role name to assign to. Empty clears the assignment.
                  example: ops_pricing
      responses:
        "204":
          description: Assigned.
        "400":
          description: Unknown role or malformed body.
        "401":
          description: No logged-in user to record as the assigner.
        "403":
          description: Caller lacks `work_item:resolve`.
        "404":
          description: No such work item on this firm's books.

  /firms/{firm}/work-items/{id}/resolutions:
    get:
      tags: [Work Items]
      summary: A work item's resolution log
      description: >
        Every resolution recorded against the item, oldest first. An item resolved and
        reopened three times says more than its current status does.
      operationId: listWorkItemResolutions
      parameters:
        - name: firm
          in: path
          required: true
          schema:
            type: string
          description: Code of the firm whose books to act on.
          example: PERSUS
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: Work item ID.
          example: 12
      responses:
        "200":
          description: Resolutions, oldest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Resolution"
        "400":
          description: Invalid id.
        "500":
          description: Internal server error.

components:
  schemas:
    User:
      type: object
      required: [id, username, display_name]
      description: A web-UI user.
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        display_name:
          type: string
        permissions:
          type: array
          description: Present only for the logged-in user (from /me and /login), for nav gating.
          items:
            $ref: "#/components/schemas/Permission"

    Permission:
      type: string
      description: >
        A single `resource:action` capability. This is the **closed vocabulary**
        of the RBAC layer: it is defined once in `roles.go` (the `Permission`
        constants) and published here so the frontend derives a checked union
        type from it rather than passing free-form strings to `can()`. A test
        asserts the two lists stay identical, so adding a permission in Go
        without adding it here fails the build.
      enum:
        - users:view
        - roles:view
        - journal:make
        - journal:check
        - journal:self_post
        - event:make
        - event:check
        - event:self_post
        - system:clock_set
        - work_item:resolve

    SystemClock:
      type: object
      required: [mode, now, rate]
      properties:
        mode:
          type: string
          enum: [wall, simulated]
          description: >
            `wall` reads the host clock; `simulated` derives its reading from a
            stored epoch and a rate that an operator controls explicitly.
        now:
          type: string
          format: date-time
          description: What the clock reads at the moment of this response.
        rate:
          type: integer
          minimum: 0
          description: >
            How many simulated seconds pass per host second: `0` is paused, `1`
            is real time, `3600` is an hour a second. Always `0` in `wall` mode,
            where the question does not arise.


            Because the reading advances by a fixed rate from a known instant, a
            client holding `now` and `rate` can compute the clock forward itself
            rather than polling — a ticking display costs no requests.
      example:
        mode: simulated
        now: "2026-01-15T00:00:00Z"
        rate: 0

    PendingAction:
      type: object
      required: [id, event_type, status, maker, made_at, payload, firm]
      description: A staged action in the maker/checker approval queue.
      properties:
        id:
          type: integer
          format: int64
        firm:
          type: string
          description: >
            Code of the firm whose books this action would post to, taken from the
            path of the request that staged it. Present on every row because the
            queue is cross-firm: a checker must see whose books before approving.
          example: PERSUS
        event_type:
          type: string
          description: The kind of action staged (e.g. `JOURNAL`).
        status:
          type: string
          enum: [pending, approved, rejected]
        maker:
          $ref: "#/components/schemas/UserRef"
        made_at:
          type: string
          format: date-time
        checker:
          $ref: "#/components/schemas/UserRef"
          description: Present once resolved.
        checked_at:
          type: string
          format: date-time
        resulting_seid:
          type: integer
          format: int64
          description: The seid allocated on approval; absent until approved.
        reject_reason:
          type: string
          description: Present only when rejected.
        payload:
          description: The raw staged request (shape depends on `event_type`).
      example:
        id: 42
        event_type: JOURNAL
        status: pending
        maker: { id: 3, username: test, display_name: Test User }
        made_at: "2026-07-15T10:00:00Z"
        payload:
          - account: JOEBLOGGS
            money_qty: { security: USD, amount: "100.00", direction: DR }

    UserRef:
      type: object
      required: [id, username, display_name]
      description: A compact reference to a user.
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        display_name:
          type: string

    Role:
      type: object
      required: [id, name]
      description: A named role.
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string

    RoleWithPermissions:
      type: object
      required: [id, name, description, permissions]
      description: A role and the permission strings it grants.
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/Permission"

    EventListItem:
      type: object
      required: [seid, event_type]
      description: One row in the events list.
      properties:
        seid:
          type: integer
          format: int64
        event_type:
          type: string
        knowledge_date:
          type: string
          format: date-time
          description: Denormalised event knowledge date; absent for events that stamp none.

    PriceUpsert:
      type: object
      required: [security, currency, source, date, price]
      description: >
        One price observation to record. The quadruple `(security, currency, source, date)` is
        the key — re-sending it overwrites.
      properties:
        security:
          type: string
          description: Security code.
          example: VMFXX
        currency:
          type: string
          description: >
            Currency code the price is quoted in — normally the security's own
            `pricing_currency`.
          example: USD
        source:
          type: string
          description: >
            Where the price came from. `INTERNAL` is a manually entered price, and is the only
            source mark-to-market reads.
          example: INTERNAL
        date:
          type: string
          format: date
          description: Observation date, YYYY-MM-DD.
          example: "2026-06-12"
        price:
          type: string
          description: >
            Decimal string, quoted the way an operator would state it. For bonds that is a
            clean price percent of $100 face (`"96.50"`); for everything else a price per
            unit. The server applies the convention for the security's type.
          example: "1.00"

    PriceUpsertResult:
      type: object
      required: [security, currency, source, date, status]
      description: Per-item result of a price upsert, in request order.
      properties:
        security:
          type: string
        currency:
          type: string
        source:
          type: string
        date:
          type: string
          format: date
        status:
          type: string
          enum: [created, updated, error]
        error:
          type: string
          description: Error message; present only when status is `error`.

    FXRateUpsert:
      type: object
      required: [base, quote, source, date, rate]
      description: >
        One exchange rate to record. The pair plus `(source, date)` is the key — re-sending
        it overwrites. Direction is not part of the key: posting `CAD`/`USD` overwrites the
        `USD`/`CAD` row for the same source and date.
      properties:
        base:
          type: string
          description: >
            Currency code the rate is quoted *from* — one unit of this buys `rate` units of
            `quote`. Need not be the direction the pair is stored in.
          example: USD
        quote:
          type: string
          description: Currency code the rate is quoted *into*.
          example: CAD
        source:
          type: string
          description: Where the rate came from.
          example: INTERNAL
        date:
          type: string
          format: date
          description: Observation date, YYYY-MM-DD.
          example: "2026-06-12"
        rate:
          type: string
          description: >
            Units of `quote` per one unit of `base`, as a positive decimal string. May be
            finer than the quote currency's minor unit.
          example: "1.3712"

    FXRateRecord:
      type: object
      required: [id, quote, source, date, rate]
      description: >
        One exchange-rate observation, quoted against the currency it was read for: one unit
        of that currency buys `rate` units of `quote`.
      properties:
        id:
          type: integer
          format: int64
          description: >
            Internal price record ID. The pair is one row whichever way it is quoted, so the
            same id is returned reading either side of it.
          example: 91
        quote:
          type: string
          description: The counterpart currency — the rate is expressed in units of this.
          example: CAD
        source:
          type: string
          description: Where the rate came from.
          example: INTERNAL
        date:
          type: string
          format: date-time
          description: Observation instant, UTC.
          example: "2026-06-12T00:00:00Z"
        rate:
          type: string
          description: >
            Units of `quote` per one unit of the currency read, as a decimal string at the
            precision the ratio carries — capped at 8 places where inversion leaves it
            non-terminating.
          example: "1.3712"

    FXRateUpsertResult:
      type: object
      required: [base, quote, source, date, status]
      description: Per-item result of an FX rate upsert, in request order.
      properties:
        base:
          type: string
          description: Echo of the submitted `base`.
        quote:
          type: string
          description: Echo of the submitted `quote`.
        source:
          type: string
        date:
          type: string
          format: date
        status:
          type: string
          enum: [created, updated, error]
        error:
          type: string
          description: Error message; present only when status is `error`.

    UpsertResult:
      type: object
      required: [code, status]
      description: Per-item result of a batch upsert, in request order.
      properties:
        code:
          type: string
          description: The item's code as submitted.
        status:
          type: string
          enum: [created, updated, error]
        error:
          type: string
          description: Error message; present only when status is `error`.

    SettlementNetRow:
      type: object
      required: [lot_id, account, subaccount, security, seid, event_type, side, value_date, qty, is_closed]
      description: A settlement lot row enriched with the event type and side classification of its SEID.
      properties:
        lot_id:
          type: integer
        account:
          type: string
        subaccount:
          type: string
        security:
          type: string
        seid:
          type: integer
          description: The SEID that contributed this row to the lot.
        event_type:
          type: string
          description: Event type of the SEID (e.g. EQUITY_TRADE, SETTLEMENT).
        side:
          type: string
          enum: [obligation, fulfillment]
          description: >
            `obligation` for trade events that give rise to settlement obligations;
            `fulfillment` for Settlement events that discharge them.
        value_date:
          type: string
          format: date-time
        qty:
          type: string
          description: Formatted quantity (positive = receive, negative = deliver).
        is_closed:
          type: boolean

    StockInstructionRow:
      type: object
      required: [seid, event_type, transaction_date, value_date, account, from_subaccount, to_subaccount, security, quantity]
      description: A pending Free↔Seg stock movement instruction from instructions_stock, codes resolved.
      properties:
        seid:
          type: integer
          format: int64
        event_type:
          type: string
        transaction_date:
          type: string
          format: date-time
        value_date:
          type: string
          format: date-time
        account:
          type: string
        from_subaccount:
          type: string
        to_subaccount:
          type: string
        security:
          type: string
        quantity:
          type: string

    SweepProgram:
      type: object
      description: A cash sweep program the firm participates in.
      required: [code, type, custody_account, currency]
      properties:
        code:
          type: string
          example: FDIC_PANEL
        type:
          type: string
          enum: [bank_deposit, network_operator, money_market]
          description: >
            Program type. `bank_deposit` waterfalls across an ordered bank
            panel, capped at $250k per bank. `network_operator` is a
            single-omnibus-account program run by a third-party operator,
            with no per-bank cap. `money_market` sweeps into a single
            money-market fund instead of a bank panel.
        custody_account:
          type: string
          description: >
            For `money_market` programs this is the cash settlement
            account, not a bank-panel custody account.
          example: BNYOPS
        currency:
          type: string
          example: USD
        banks:
          type: array
          items:
            type: string
          description: >
            Ordered bank panel (the accounts swept cash waterfalls across,
            in priority order). Omitted for `money_market` programs.
          example: ["WF_BANK", "BAC_BANK"]
        fund:
          type: string
          description: >
            Security code of the money-market fund. Only present for
            `money_market` programs.
          example: VMFXX
        omnibus_account:
          type: string
          description: >
            Account code of the broker's omnibus position at the fund's
            transfer agent. Only present for `money_market` programs.
          example: VANGD_OMNI

    SweepEnrollment:
      type: object
      description: One customer account's enrollment in a sweep program.
      required: [account, retention_amount, sweep_cash_debits, sweep_margin_deficits]
      properties:
        account:
          type: string
          description: Enrolled customer account code.
          example: JOEBLOGGS
        retention_amount:
          type: string
          description: >
            Decimal floor of cash left unswept, in the program currency.
          example: "1000.00"
        sweep_cash_debits:
          type: boolean
          description: >
            Morning recall trigger: cover a TD debit balance on the CASH
            subaccount.
        sweep_margin_deficits:
          type: boolean
          description: >
            Morning recall trigger: cover a margin maintenance deficiency,
            landing directly in the MARGIN subaccount.

    FirmSecurity:
      type: object
      required: [code, name, type, decimals, fair_value_level, fair_value_level_overridden]
      description: >
        A security as one firm sees it — every field of `Security`, plus that firm's overlay.


        `fair_value_level` is the ASC 820 / IFRS 13 fair value hierarchy classification: Level
        1 quoted prices in active markets, Level 2 observable inputs other than quoted prices
        (matrix pricing, yield curves), Level 3 unobservable inputs (a model, or the firm's own
        assumptions). The three levels are fixed by the standard and cannot be extended — where
        three buckets are too coarse for an instrument, override that security rather than
        inventing a level.
      allOf:
        - $ref: "#/components/schemas/Security"
        - type: object
          properties:
            fair_value_level:
              type: string
              enum: ["1", "2", "3"]
              description: >
                The resolved level — this firm's override where it has one, otherwise the
                default for the security's type.
              example: "3"
            fair_value_level_overridden:
              type: boolean
              description: >
                Whether `fair_value_level` came from a stored classification (true) or the
                type default (false).
              example: true

    StaleThreshold:
      type: object
      required: [security_type, level, threshold_days]
      description: >
        One cell of a firm's price staleness tolerance grid: how old a price it will mark a
        given kind of instrument at, in **business days**.


        Keyed on both axes because they answer different halves of the question — the level
        says how observable the pricing inputs are, the type says what kind of instrument is
        being priced. A firm wanting "Level 2 tolerates a week, except corporate bonds which
        tolerate a fortnight" needs both.
      properties:
        security_type:
          type: string
          enum: [ord, corp_bond, govt_bond, money_market_fund]
          description: >
            Security type. Currencies are rejected — they never reach the MTM snapshot, so a
            threshold for one could never take effect.
          example: corp_bond
        level:
          type: string
          enum: ["1", "2", "3"]
          description: Fair value hierarchy level.
          example: "2"
        threshold_days:
          type: integer
          minimum: 0
          description: >
            Business days of tolerance. A mark is stale when the price is strictly older than
            this, so `1` accepts yesterday's close. `0` means today's price or nothing.
          example: 10

    MarginRate:
      type: object
      required: [security]
      description: >
        One firm's house maintenance margin rates for one security. Rates are basis points
        (`4000` = 40%), an override *above* the regulatory minimum — a nonzero value below it is
        rejected. `0` on a leg means that leg is unset and falls back to the minimum (25% long /
        30% short); both legs `0` is not a storable state.


        The short-side $5/share regulatory floor applies on top of whatever short rate resolves
        and cannot be configured away.
      properties:
        security:
          type: string
          description: Security code.
          example: AAPL
        long_bps:
          type: integer
          description: House maintenance rate for long positions, in basis points.
          example: 4000
        short_bps:
          type: integer
          description: House maintenance rate for short positions, in basis points.
          example: 3500

    MarginConfig:
      type: object
      required: [call_threshold_cents]
      description: Firm-level margin policy that isn't per security.
      properties:
        call_threshold_cents:
          type: integer
          format: int64
          description: >
            De minimis deficiency below which no margin call is issued — house policy, not a
            regulatory requirement, to avoid actioning routine mark-to-market noise. Gates the
            `deficient_only` filter on `GET /snapshots/margin-maintenance/{id}`; the underlying
            excess figures are unaffected. Defaults to `10000` ($100.00).


            In minor units rather than a formatted decimal amount because the record names no
            security to resolve a currency from — the margin subdomain assumes USD throughout.
          example: 10000

    Security:
      type: object
      required: [code, name, cusip, type, decimals, pricing_currency]
      description: >
        A tradeable instrument or currency. Currencies (type=`currency`) form the money leg
        of ledger entries; equities (type=`ord`) form the stock leg and are priced in a currency
        identified by `pricing_currency`.
      properties:
        code:
          type: string
          description: Unique identifier — ticker for equities (e.g. `AAPL`) or ISO 4217 code for currencies (e.g. `USD`).
          example: AAPL
        name:
          type: string
          description: Full human-readable name (e.g. `Apple Inc.` or `US Dollar`).
          example: Apple Inc.
        cusip:
          type: string
          description: CUSIP identifier. Empty string for currencies.
          example: "037833100"
        type:
          type: string
          enum: [currency, ord, corp_bond, govt_bond, money_market_fund]
          description: >
            `currency` — a money denomination (USD, EUR, GBP).
            `ord` — ordinary shares in a company.
            `corp_bond` — a corporate bond; may carry an `interest_rule_id`.
            `govt_bond` — a government bond or note; may carry an `interest_rule_id`.
            `money_market_fund` — a money-market fund traded via `POST /events/money_market_trade`, always at $1.00 NAV.
        decimals:
          type: integer
          description: >
            Number of decimal places used in amount strings for this security.
            Currencies typically use 2 (cent precision); equities use 6 (fractional share precision).
          example: 6
        pricing_currency:
          type: string
          description: >
            Code of the currency this security is priced in (e.g. `"USD"` for US-listed
            equities). Empty string for currency securities, which are not priced in
            another currency.
          example: USD
        interest_rule_id:
          type: integer
          format: uint32
          description: >
            ID of the associated interest rule. Only present for `corp_bond` securities.
            `0` / omitted when no rule is associated.
          example: 1

    Benchmark:
      type: object
      required: [id, code, name]
      properties:
        id:
          type: integer
          format: uint32
        code:
          type: string
          description: Unique short identifier (e.g. `US13W`, `SOFR`).
          example: US13W
        name:
          type: string
          example: US 13-Week T-Bill Auction Rate

    ScheduleGeneratorView:
      type: object
      required: [seed, end, frequency]
      properties:
        seed:
          type: string
          format: date
          example: "2024-01-15"
        end:
          type: string
          format: date
          example: "2034-01-15"
        frequency:
          type: string
          enum: [weekly, monthly, quarterly, semi_annual, annual]
        eom:
          type: boolean
          description: End-of-month anchor; generated dates snap to the last day of each month.
          default: false

    RateBlockView:
      type: object
      required: [type, start, end, day_count]
      properties:
        type:
          type: string
          enum: [fixed, floating]
        start:
          type: string
          format: date
        end:
          type: string
          format: date
        day_count:
          type: string
          enum: ["30A/360", "30U/360", "ACT/ACT ICMA", "ACT/ACT ISDA", "ACT/365", "ACT/360"]
          description: Day count convention for accrued interest calculation.
          example: "30A/360"
        rate_bps:
          type: integer
          description: Fixed rate in basis points. Present when type=`fixed`.
          example: 475
        reset_generator:
          $ref: '#/components/schemas/ScheduleGeneratorView'
          description: Rate reset schedule. Present when type=`floating`.
        calendar_ids:
          type: array
          items: { type: integer, format: uint32 }
          description: Holiday calendar IDs for reset adjustment. Present when type=`floating`.
        reset_adjustment:
          type: string
          enum: [following, preceding, modified_following]
          description: Business day adjustment rule for resets. Present when type=`floating`.
        benchmark:
          type: string
          description: Benchmark code (e.g. `US13W`). Present when type=`floating`.
          example: US13W
        spread_bps:
          type: integer
          description: Spread over benchmark in basis points. Present when type=`floating`.

    PaymentBlockView:
      type: object
      required: [start, end, generator, adjustment, currency]
      properties:
        start:
          type: string
          format: date
        end:
          type: string
          format: date
        generator:
          $ref: '#/components/schemas/ScheduleGeneratorView'
        calendar_ids:
          type: array
          items: { type: integer, format: uint32 }
        adjustment:
          type: string
          enum: [following, preceding, modified_following]
        currency:
          type: string
          description: Security code of the payment currency (e.g. `USD`).
          example: USD

    InterestRule:
      type: object
      required: [start, end, rate_blocks, payment_blocks]
      properties:
        id:
          type: integer
          format: uint32
          description: Auto-assigned ID. Present in responses, omitted in requests.
        start:
          type: string
          format: date
          example: "2024-01-15"
        end:
          type: string
          format: date
          example: "2034-01-15"
        rate_blocks:
          type: array
          items:
            $ref: '#/components/schemas/RateBlockView'
          description: >
            Contiguous, non-overlapping rate blocks spanning [start, end].
        payment_blocks:
          type: array
          items:
            $ref: '#/components/schemas/PaymentBlockView'
          description: >
            Contiguous, non-overlapping payment schedule blocks spanning [start, end].

    InterestCalendarEvent:
      type: object
      required: [date, type]
      description: A single dated event in an interest rule's calendar.
      properties:
        date:
          type: string
          format: date
          example: "2026-01-15"
        type:
          type: string
          enum: [reset, payment]
          description: "`reset`: a floating-rate reset date. `payment`: a coupon payment date."

    PartyRollup:
      type: object
      description: >
        One party's reach to a firm: the role it holds, the branch it holds it in, and
        which arm of the firm's org chart that branch hangs off. What naming them would
        imply about who introduced the business travels with them.
      required: [code, name, role, branch, direct]
      properties:
        code:
          type: string
          example: REP_QUAYLE
        name:
          type: string
          example: Quayle
        role:
          type: string
          enum: [rep, trader]
        branch:
          type: string
          description: Party code of the branch this party belongs to.
          example: MAD_ABQ
        direct:
          type: boolean
          description: >
            Their branch is an office of this firm, so naming them means the account is
            the firm's own direct business.
        correspondent:
          type: string
          description: >
            Present when their branch is an office of a correspondent introducing to
            this firm. Naming them means the account is that correspondent's introduced
            business. Present *together with* `direct` means their branch hangs off
            both, and an account naming them must state `correspondent` explicitly.
          example: MADRIGAL

    Party:
      type: object
      required: [id, code, name, pre_name]
      description: >
        An individual or group of individuals with agency and shared intent. A natural
        person is a party of one; a company is a party of many. For individuals, `name`
        is the surname and `pre_name` is the given name; for institutions, `name` is the
        company name and `pre_name` is empty.


        What a party *is to the system* is carried by the roles it holds, not by this
        record: a party holding the `firm` role is a set of books this instance keeps.
      properties:
        id:
          type: integer
          format: uint32
          description: Internal party ID.
          example: 1
        code:
          type: string
          description: Unique short code used to identify the party (e.g. `JOEBLOGGS`, `PERSUS`).
          example: JOEBLOGGS
        name:
          type: string
          description: Surname (individual) or company name (institution).
          example: Bloggs
        pre_name:
          type: string
          description: Given name for individuals. Empty string for institutions.
          example: Joe
        roles:
          $ref: "#/components/schemas/PartyRoles"

    PartyRoles:
      type: object
      description: >
        The roles a party holds, keyed by role name, with each role's attributes under
        its key. A role is held by virtue of its attribute record existing, so a key
        present means the role is held and an absent key means it is not — there is no
        separate flag that could disagree. Omitted entirely when a party holds no roles.


        The same shape serves reads and writes. On `PUT /parties`, omitting this object
        leaves the party's roles untouched, `{}` retracts them all, and a role key
        asserts that role with the attributes given.
      properties:
        firm:
          type: object
          required: [base_currency]
          description: >
            This party is a firm: a set of books of record, and the accounting boundary
            every journal balances within. The firm's id, code and name are the party's.
          properties:
            base_currency:
              type: string
              description: >
                Code of the firm's reporting currency — a security of type `currency`.
                Balances are still held per currency; this is the one its regulatory
                reports are denominated in. On a write, an unresolvable code or a
                non-currency security fails that item with `status: "error"` while the
                rest still apply.
              example: USD
        correspondent:
          type: object
          description: >
            This party is a correspondent: business is introduced under its name. No
            attributes yet, so the empty object is the whole assertion — its presence
            is the fact. A firm is *not* its own correspondent: its direct business
            simply names none, and an account records that as an absent
            `correspondent` rather than a self-reference.


            On a write, retracting this role fails for that item if live relationships
            still require it.
          properties: {}
        branch:
          type: object
          description: >
            This party is a branch: an office or desk that a firm or a correspondent
            runs, and that reps and traders belong to. A branch is a party like any
            other — it has staff, it acts, it has intent — rather than a structure
            standing beside one.


            Which organisation it belongs to is a relationship, not an attribute, and
            there are two of them: `BranchOfFirm` and `BranchOfCorrespondent`. A party
            holding both the firm and correspondent roles may carry both edges for one
            branch. No attributes yet.
          properties: {}
        rep:
          type: object
          description: >
            This party is a registered representative: the person responsible for a
            customer account, named by that account's `responsible_party`. Every
            customer account names one. No attributes yet — in particular no rep code,
            since the party's own code is it.


            On a write, retracting this role fails for that item if the party is still
            in a branch or still named on an account.
          properties: {}
        trader:
          type: object
          description: >
            This party is a trader: the representative's counterpart on the firm's own
            book, named by an inventory or PAB account's `responsible_party`. Separate
            from `rep` because the two are not interchangeable — a customer account must
            name a representative and a proprietary account a trader. No attributes yet.
          properties: {}
        customer:
          type: object
          description: >
            This party is a customer: someone whose assets a firm holds on their behalf,
            named by a customer account's `counterparty`.


            The role says nothing about the party being a natural person. A joint
            holding, a trust, a partnership and a limited company are each one party in
            their own right and hold the role as such, with the individuals behind them
            recorded as relationships. That is why a customer account names exactly one
            counterparty whatever its legal form. No attributes yet.


            On a write, retracting this role fails for that item if a customer account
            still names the party as its counterparty.
          properties: {}
        custodian:
          type: object
          description: >
            This party is a custodian: an institution holding assets for safekeeping,
            named by a custody account's `counterparty`. A depository such as DTC or
            CDS, a custodian bank, a fund's transfer agent and a clearing broker
            carrying an omnibus position all hold it.


            Separate from `bank` because a safekeeping obligation and a deposit
            liability are different things. A party may hold both, and a custodian bank
            generally does. No attributes yet.


            On a write, retracting this role fails for that item if a custody account
            still names the party as its counterparty.
          properties: {}
        bank:
          type: object
          description: >
            This party is a bank: a depository institution taking cash deposits, named
            by a bank account's `counterparty`. The program banks of a cash sweep are
            what the role is for today. No attributes yet.


            On a write, retracting this role fails for that item if a bank account still
            names the party as its counterparty.
          properties: {}

    PartyRelation:
      type: object
      required: [role, type, other, valid_from]
      description: >
        One party's side of one relationship: the role it is acting in and who is at
        the other end. `(type, role)` identifies the slot the party occupies, which is
        what a client keys on to word the side for a reader.
      properties:
        role:
          type: string
          enum: [firm, correspondent, branch, rep, trader]
          description: >
            The role this party is acting in — the role the slot it occupies requires.
            Group on this. A type never names the same role at both ends, so this
            distinguishes the two sides even of a self-relationship.
        type:
          type: string
          enum:
            [
              IsCorrespondentOf,
              BranchOfFirm,
              BranchOfCorrespondent,
              RepInBranch,
              TraderInBranch,
            ]
          description: The relationship type this is a side of.
        other:
          type: string
          description: >
            Party code at the far end — the same party as this one on a
            self-relationship.
          example: PERSUS
        valid_from:
          type: string
          format: date-time
          description: When the relationship began.
        valid_to:
          type: string
          format: date-time
          description: >
            When the relationship ended. Absent while it is current, so it only ever
            appears on an `as_of` read.

    Firm:
      type: object
      required: [id, code, name, base_currency]
      description: >
        A firm is a set of books of record — one regulated legal entity whose accounts
        this instance keeps. It is the accounting boundary: every journal balances
        within exactly one firm, and business between two firms is two mirrored
        journals rather than one spanning both.


        A firm is not a thing beside a party: it is a **party holding the `firm` role**,
        and the role carries no identity of its own, so `id`, `code` and `name` here are
        the party's. The same legal entity can still appear as an ordinary counterparty
        of another firm — that is simply the same party wearing no role.
      properties:
        id:
          type: integer
          format: uint32
          description: >
            Internal firm ID. This is the party's id: the two are the same number, and
            it is what every `firm_id` in the system holds.
          example: 1
        code:
          type: string
          description: >
            The party's code, used as the firm key throughout the API (in `/firms/{firm}/…`
            paths, for instance).
          example: PERSUS
        name:
          type: string
          description: The party's name — the legal name of the firm.
          example: Persepolis Securities LLC
        base_currency:
          type: string
          description: >
            Code of the firm's reporting currency. Balances are still held per currency;
            this is the one its regulatory reports are denominated in.
          example: USD

    AccountSummary:
      type: object
      required: [id, code, name, type]
      description: >
        An account as it appears in a list: just enough to identify it, name it and
        link to it. Everything else an account knows about itself — its party slots,
        allocation method, settlement mode, address and sweep configuration — is on
        `AccountDetail`, returned by the single-account read.


        The firm whose books the account belongs to is not repeated in the body: every
        account endpoint is already under `/firms/{firm}/…`, so the response would only
        restate its own URL.
      properties:
        id:
          type: integer
          format: uint32
          description: Internal account ID.
          example: 1
        code:
          type: string
          description: Unique human-readable account identifier used as the key throughout the API.
          example: JOEBLOGGS
        name:
          type: string
          description: Human-readable label for the account.
          example: Joe Bloggs Account
        type:
          type: string
          enum: [customer, inventory, pab, custody, control, bank, sbl]
          description: >
            `customer` — a client of the broker; their cash balance is a broker liability.
            `inventory` — proprietary positions belonging to the firm itself.
            `pab` — Proprietary Account of a Broker-dealer: a correspondent's *own*
            positions and cash, as distinct from the accounts of the customers it
            introduces. Always carries a `correspondent`.
            `custody` — positions held at a third-party custodian in the firm's name.
            `control` — settlement/suspense accounts tracking instructed movements.
            `bank` — program bank accounts used by cash sweep programs.

    AccountDetail:
      type: object
      required: [id, code, type, name, allocation_method, settlement_mode, address1, address2, city, state, zip, links]
      description: Account static data plus the list of linked parties.
      properties:
        id:
          type: integer
          format: uint32
        code:
          type: string
        counterparty:
          type: string
          description: >
            Party code of the other end of the relationship this account records — the
            customer, the custodian, the bank, or the correspondent whose `pab` it is.


            **Absent** on `inventory` and `control`, which cannot carry one, and on a
            `customer` account that is an **omnibus**: balances pooled for end
            beneficiaries the firm does not identify, so there is no single other side
            to name. That absence is the omnibus condition rather than a gap — see
            `customer_shape`.
          example: JOE_BLOGGS
        correspondent:
          type: string
          description: >
            Party code of the correspondent that introduced this account — a third party
            to the relationship rather than an end of it. **Customer accounts only**, and
            **absent** when the business is the firm's own direct retail.


            A `pab` never carries it: the correspondent owns that account rather than
            introducing it, so it appears as `counterparty` instead.


            Absent does not mean unscoped: such an account is firm-level, visible at firm
            scope and above and to no correspondent-scoped user. A correspondent grant
            filters on equality, so an absent value correctly matches none.
          example: PERSCA
        responsible_party:
          type: string
          description: >
            Party code of whoever is answerable for this account — a rep on a `customer`
            account, a trader on an `inventory` or `pab` one. Always present on a
            customer account, which requires one; absent where a proprietary account
            names nobody, and absent always on `custody`, `control` and `bank`, which
            cannot carry one.
          example: REP_SMITH
        customer_shape:
          type: string
          enum: [direct, disclosed, omnibus]
          description: >
            Which of the three forms a `customer` account takes, derived from the two
            optional slots above rather than stored. `direct` — the firm's own client:
            counterparty, no correspondent. `disclosed` — a correspondent's client
            carried by name: both present. `omnibus` — a correspondent's clients in
            aggregate: correspondent, no counterparty. Absent on non-customer accounts.
          example: direct
        type:
          type: string
          enum: [customer, inventory, pab, custody, control, bank, sbl]
        name:
          type: string
        allocation_method:
          type: string
          enum: [none, fifo, lifo, wac]
        settlement_mode:
          type: string
          enum: [none, cns, tft]
        address1:
          type: string
        address2:
          type: string
        city:
          type: string
        state:
          type: string
        zip:
          type: string
        cash_sweep:
          type: object
          description: Present only if this account is enrolled in a sweep program.
          required: [program, retention_amount, sweep_cash_debits, sweep_margin_deficits]
          properties:
            program:
              type: string
              description: Sweep program code.
              example: FDIC_PANEL
            retention_amount:
              type: string
              description: Decimal amount of cash retained before sweeping.
              example: "1000.00"
            sweep_cash_debits:
              type: boolean
              description: >
                Morning recall trigger: bring back enough of the swept
                balance to cover a TD debit balance on the CASH subaccount.
            sweep_margin_deficits:
              type: boolean
              description: >
                Morning recall trigger: bring back enough of the swept
                balance to cover a margin maintenance deficiency from the
                latest close-of-trading margin snapshot; recalled funds land
                directly in the MARGIN subaccount. The cash debit is funded
                first when the swept balance can't cover both.

    Quantity:
      type: object
      required: [security, amount]
      description: >
        A signed quantity in a specific security (or currency). Used for both the money
        (cash) leg and the stock (share) leg of a ledger entry. When a leg is absent
        (e.g. a cash-only entry has no stock leg), `security` is an empty string and
        `amount` is an empty string.
      properties:
        security:
          type: string
          description: Security code (e.g. `USD` for cash, `AAPL` for shares). Empty string when this leg is absent.
          example: USD
        amount:
          type: string
          description: >
            Signed decimal string at the security's full precision. Positive = DR / long;
            negative = CR / short. Empty string when the leg is absent.

            Examples: `"1234.56"` (1,234.56 USD), `"-500.00"` (CR 500 USD),
            `"100.000000"` (100 shares), `"-25.500000"` (short 25.5 shares).
          example: "19589.00"

    TrialBalanceRow:
      type: object
      required: [account, subaccount, nature, ccy, td_qty, vd_qty, last_activity]
      description: >
        A single row in the trial balance — the net cash position for one
        `(account, subaccount, nature, currency)` group. Positive = DR (debit balance);
        negative = CR (credit balance). Zero-balance rows are excluded.
      properties:
        account:
          type: string
          description: Account code.
          example: JOEBLOGGS
        subaccount:
          type: string
          enum: ["", "CASH", "MARGIN", "FDIC", "MM", "BORROWED", "ONLOAN", "FREE", "SEG"]
          description: Subaccount within the account. Empty string for accounts that do not use subaccounts.
        nature:
          type: string
          enum: ["", "CustomerChargeIncome", "CommissionIncome", "InterestIncome", "InterestAccrual", "MarketValue", "RPL", "URPL", "OwnMoneyEquity", "OwnPosition", "FXDealing", "FXRounding", "FXURPL", "SecuritiesLendingIncome"]
          description: Income classification. Empty string for normal balance sheet / P&L entries.
        ccy:
          type: string
          description: Currency (or security) code for this balance row.
          example: USD
        td_qty:
          type: string
          description: Net balance including all entries with `transaction_date <= as_of` (decimal string, full currency precision).
          example: "-10500.00"
        vd_qty:
          type: string
          description: Net balance including all entries with `value_date <= as_of` — the settled balance (decimal string, full currency precision).
          example: "-10500.00"
        last_activity:
          type: string
          description: >
            RFC 3339 timestamp of the most recent activity in this row's group —
            the max `transaction_date` across the aggregated entries, bounded by
            the as-of instant.
          example: "2026-06-10T10:00:00Z"

    FinanceTranslationConfig:
      type: object
      description: >
        A firm's settings for restating its finance trial balance into its base currency.

        The per-currency translation residual -- translating rows that sum to zero and
        rounding each to the base currency's minor unit does not leave a set that sums to
        zero -- is posted to the firm's `tb_rounding` bookkeeping account, one row per
        source currency under the `FXRounding` nature, so every other row stays exactly
        its own amount at its own stored rate. That account is provisioned with the firm's
        role and is not nameable here.
      properties:
        fx_source:
          type: string
          default: INTERNAL
          description: Price source the rates are read from, as on `PUT /fx-rates`.
          example: INTERNAL
        stale_after_days:
          type: integer
          default: 3
          description: >
            How old a rate may be before its use is reported as an `fx_stale_rate` finding.
            The rate is used either way — a feed's bad night must not leave a firm with no
            financials. Three days by default, which clears a weekend: closings run every
            calendar day but fixings do not.
          example: 3

    FinanceTrialBalanceRow:
      type: object
      required: [account, subaccount, nature, ccy, currency_balance, previous_currency_balance, currency_delta]
      description: >
        A single row in the finance (general ledger style) trial balance — combines the
        operational trial balance with the trading and interest accrual snapshots. Every
        operational row is carried over as-is (using only its TD balance), except
        `OwnPosition` rows for firm (inventory) accounts, which are replaced by a four-line
        decomposition of the position from cost to market value:

        - `MarketValue` (debit) = M, the position's mark-to-market value
        - `OwnPosition` (credit) = C-R, cost less realized P&L already recognized
        - `RPL` (credit) = R, realized P&L
        - `URPL` (credit) = M-C, unrealized P&L

        Firm accrued interest is booked as `InterestAccrual` (debit) / `InterestIncome`
        (credit). Positive = DR (debit balance); negative = CR (credit balance).

        The statement covers a **period**, not just an instant:
        `previous_currency_balance + currency_delta = currency_balance`, always. The
        opening figures come from this firm's preceding finance trial balance, and the row
        set is the union of both — so a balance that fell to zero is still reported, as a
        row whose balance is `"0.00"` and whose delta is the whole of what it was. A row
        that is zero on both sides is omitted.
      properties:
        account:
          type: string
          description: Account code.
          example: PROP1
        subaccount:
          type: string
          enum: ["", "CASH", "MARGIN", "FDIC", "MM", "BORROWED", "ONLOAN", "FREE", "SEG"]
          description: Subaccount within the account. Empty string for accounts that do not use subaccounts.
        nature:
          type: string
          enum: ["", "CustomerChargeIncome", "CommissionIncome", "MarketValue", "RPL", "URPL", "OwnMoneyEquity", "OwnPosition", "InterestIncome", "InterestAccrual", "FXDealing", "FXRounding", "FXURPL"]
          description: Income/balance-sheet classification.
        ccy:
          type: string
          description: Currency (or security) code for this balance row.
          example: USD
        currency_balance:
          type: string
          description: >
            TD-only net balance for this `(account, subaccount, nature, currency)` group
            (decimal string, full currency precision). There is no VD balance in the finance
            trial balance.
          example: "1600.00"
        previous_currency_balance:
          type: string
          description: >
            The same group's balance in this firm's preceding finance trial balance, or
            `"0.00"` if the row is new (or this is the firm's first snapshot).
          example: "1500.00"
        currency_delta:
          type: string
          description: >
            The period's movement, `currency_balance − previous_currency_balance`. Derived
            from the two balances rather than from ledger entries: a finance trial balance
            row is not always a ledger balance — the position decomposition and accrual
            rows come from other snapshots and have no entries behind them.
          example: "100.00"
        previous_base_balance:
          type: string
          nullable: true
          description: >
            The row's base-currency balance at the previous closing. `null` on every base
            column means this firm has no translation config — see
            `GET /fx-translation/config`.
          example: "75.00"
        base_delta:
          type: string
          nullable: true
          description: >
            `currency_delta` translated into the firm's base currency at `delta_rate`,
            rounded half-up to the base currency's minor unit.
          example: "66.67"
        base_fx_revaluation:
          type: string
          nullable: true
          description: >
            What it takes to get from what the row was carried at, plus what it moved, to
            what its balance is worth at `close_rate`. Non-zero only on **monetary** rows
            (balance-sheet natures) and on the `FXURPL` contras that offset them: income
            and equity keep the rates their movements were struck at.

            Because it is a residual, a monetary row's `base_balance` comes out as exactly
            its `currency_balance` at `close_rate` however the delta was rounded — so the
            base balance sheet does not depend on the chain, only its attribution does.
          example: "-50.00"
        base_balance:
          type: string
          nullable: true
          description: >
            `previous_base_balance + base_delta + base_fx_revaluation`. Unlike the currency
            balance this cannot be recomputed from today's ledger — it accumulates
            translations struck at historical rates — which is why the chain between
            snapshots is recorded rather than implied.
          example: "141.67"
        delta_rate:
          type: string
          nullable: true
          description: >
            The rate `base_delta` was translated at, as a decimal string. `"1"` for rows
            already in the base currency, which are never looked up.
          example: "0.66666667"
        close_rate:
          type: string
          nullable: true
          description: >
            The rate at this closing, which the revaluation is struck at. Equal to
            `delta_rate` while every period is a single day; they diverge once a period
            spans a gap between closings.
          example: "0.66666667"

    StockRecordRow:
      type: object
      required: [account, subaccount, security, td_qty, vd_qty, vd_next_qty, last_activity]
      description: >
        A single row in the stock record — the net share position for one
        `(account, subaccount, security)` group. Positive = long; negative = short.
        Zero-balance rows are excluded.


        Note that a DTC box account (`DTC_BOX`) inverts this: the custody leg is
        posted as the contra of the control account's obligation, so a **negative**
        quantity there means the firm **holds** that stock. Read held quantity as
        the negation. Per security, every row summed together nets to zero — the
        stock record is a double-entry record of shares, not a position list.
      properties:
        account:
          type: string
          description: Account code.
          example: JOEBLOGGS
        subaccount:
          type: string
          enum: ["", "CASH", "MARGIN", "FDIC", "MM", "BORROWED", "ONLOAN", "FREE", "SEG"]
          description: Subaccount within the account.
        security:
          type: string
          description: Security code.
          example: AAPL
        td_qty:
          type: string
          description: Net share position including all entries with `transaction_date <= as_of` (decimal string, full security precision).
          example: "100.000000"
        vd_qty:
          type: string
          description: Net share position including all entries with `value_date <= as_of` — the settled position (decimal string, full security precision).
          example: "0.000000"
        vd_next_qty:
          type: string
          description: >
            The settled position projected to the **next business day** — what the
            account will own once everything already traded has settled. This is the
            basis segregation is decided on, so reconciling a segregation result
            against the stock record needs this column rather than `td_qty` or
            `vd_qty`.
          example: "0.000000"
        last_activity:
          type: string
          description: >
            RFC 3339 timestamp of the most recent activity in this row's group —
            the max `transaction_date` across the aggregated entries, bounded by
            the as-of instant.
          example: "2026-06-10T10:00:00Z"

    TrialBalanceResult:
      type: object
      required: [snapshot_id, snapped_at, is_cached, rows]
      description: >
        Wrapper returned by `GET /balance`. When a closing exists for the requested date,
        the result is served from the stored snapshot (`is_cached: true`) rather than
        recomputed from raw entries. Both paths return the same row structure.
      properties:
        snapshot_id:
          type: integer
          format: int64
          description: >
            ID of the stored trial balance snapshot that was used. `0` if the result was
            computed live (no snapshot exists for this date).
          example: 42
        snapped_at:
          type: string
          description: >
            For cached results: RFC 3339 timestamp of when the snapshot was taken (e.g. `"2026-06-10T20:00:00Z"`).
            For live results: the `as_of` date string (e.g. `"2026-06-10"`).
          example: "2026-06-10T20:00:00Z"
        is_cached:
          type: boolean
          description: >
            `true` if `rows` came from a stored snapshot (fast, audit-consistent).
            `false` if `rows` were computed live from raw ledger entries.
          example: true
        rows:
          type: array
          description: Trial balance rows. Empty array if there are no positions.
          items:
            $ref: "#/components/schemas/TrialBalanceRow"

    StockRecordResult:
      type: object
      required: [snapshot_id, snapped_at, is_cached, rows]
      description: >
        Wrapper returned by `GET /stock`. Identical caching behaviour to `TrialBalanceResult` —
        serves from the stored stock record snapshot when a closing exists for the date.
      properties:
        snapshot_id:
          type: integer
          format: int64
          description: ID of the stored stock record snapshot used. `0` if computed live.
          example: 43
        snapped_at:
          type: string
          description: RFC 3339 timestamp (cached) or `as_of` date string (live).
          example: "2026-06-10T20:00:00Z"
        is_cached:
          type: boolean
          description: >
            `true` if rows came from a stored snapshot; `false` if computed live.
          example: true
        rows:
          type: array
          description: Stock record rows. Empty array if there are no positions.
          items:
            $ref: "#/components/schemas/StockRecordRow"

    Entry:
      type: object
      required:
        - id
        - transaction_date
        - value_date
        - account
        - subaccount
        - nature
        - ttype
        - money_qty
        - stock_qty
      description: >
        A single double-entry ledger record. Each entry belongs to one account and carries
        up to two legs: a money leg (cash) and a stock leg (shares). At least one leg is
        always populated. Multiple entries sharing the same `seid` (System Event ID) form a complete
        balanced journal entry.
      properties:
        id:
          type: integer
          format: int64
          description: Unique entry ID.
          example: 101
        seid:
          type: integer
          format: int64
          description: >
            System Event ID — the unique identifier of the business event that produced this entry.
            All entries sharing the same `seid` form a complete balanced journal (e.g. the two
            sides of a trade, or the debit and credit for a deposit). The SEID also links this
            entry to the trade blotter row, lot rows, and trade confirm for the same event.
            See the "System Event ID (SEID)" section in the API description for full details.
          example: 50
        transaction_date:
          type: string
          format: date
          description: Date the trade or event occurred — used for the TD cut of balances (YYYY-MM-DD).
          example: "2026-06-10"
        value_date:
          type: string
          format: date
          description: Settlement date — used for the VD cut of balances. Equals `transaction_date` for same-day cash entries (YYYY-MM-DD).
          example: "2026-06-12"
        account:
          type: string
          description: Account code this entry is posted to.
          example: JOEBLOGGS
        subaccount:
          type: string
          enum: ["", "CASH", "MARGIN", "FDIC", "MM", "BORROWED", "ONLOAN", "FREE", "SEG"]
          description: Subaccount within the account.
        nature:
          type: string
          enum: ["", "CustomerChargeIncome", "CommissionIncome", "InterestIncome", "InterestAccrual", "MarketValue", "RPL", "URPL", "OwnMoneyEquity", "OwnPosition", "FXDealing", "FXRounding", "FXURPL", "SecuritiesLendingIncome"]
          description: Income classification. Empty string for normal balance sheet entries.
        ttype:
          type: string
          enum: ["", "CUSTOMER_DEPOSIT", "CORRESPONDENT_DEPOSIT", "CUSTOMER_CHARGE", "TRADE", "BOND_TRADE", "COMMISSION", "PURCHASED_INTEREST", "BOND_COUPON_PAYMENT", "MONEY_MARKET_TRADE", "CUSTOMER_FX_TRADE", "DELIVER", "RECEIVE", "OWN_CASH_DEPOSIT", "CASH_TRANSFER", "FDIC_SWEEP", "FDIC_RECALL", "MARK_TO_MARKET", "DTC_FUNDING", "STOCK_SEG_MOVE", "MANUAL_JOURNAL", "SECURITIES_BORROW", "SECURITIES_LOAN", "SBL_MARK", "SBL_FEE"]
          description: Transaction type identifying the business event that generated this entry.
        money_qty:
          $ref: "#/components/schemas/Quantity"
          description: Cash leg of the entry. Security is the currency code; amount is positive for DR, negative for CR. Empty security and amount when there is no cash leg.
        stock_qty:
          $ref: "#/components/schemas/Quantity"
          description: Share leg of the entry. Security is the equity code; amount is positive for long, negative for short. Empty security and amount when there is no stock leg.
        secondary_account:
          type: string
          description: >
            Code of an optional second account referenced by this entry (e.g. the customer
            account on the asset side of an FDIC sweep entry). Omitted when not set.
          example: JOEBLOGGS

    DirectedQuantity:
      type: object
      description: >
        An unsigned quantity in a specific security (or currency) plus an explicit direction,
        used for the `money_qty`/`stock_qty` legs of `JournalEntryInput`. Unlike `Quantity`
        (returned by `GET /entries`), the amount here never carries a sign — direction says
        which way it goes, so callers posting a journal don't need to know this system's DR/CR
        or long/short sign conventions.
      properties:
        security:
          type: string
          description: Security code (e.g. `USD` for cash, `AAPL` for shares). Leave empty if this leg is absent.
          example: USD
        amount:
          type: string
          description: >
            Strictly positive decimal string at the security's full precision — as with amounts
            elsewhere in this API, zero is invalid. Leave empty if this leg is absent.
          example: "100.00"
        direction:
          type: string
          enum: ["DR", "CR", "LONG", "SHORT"]
          description: "`DR`/`CR` for a `money_qty` leg, `LONG`/`SHORT` for a `stock_qty` leg. Required whenever `amount` is set."

    JournalEntryInput:
      type: object
      required:
        - transaction_date
        - value_date
        - account
      description: >
        One leg of a manually-posted journal, as sent inside `POST /journals`'s `entries`. The
        journal's knowledge date is stamped once at the event level, not per entry. Same
        remaining fields as `Entry`, minus the system-assigned `id`, `seid`, and `ttype` (every
        entry posted here gets `ttype = MANUAL_JOURNAL`), and with `money_qty`/`stock_qty` taking
        a `DirectedQuantity` (unsigned amount + direction) instead of a signed one.
      properties:
        transaction_date:
          type: string
          format: date-time
          description: RFC3339 timestamp. Must match across every entry in the journal.
          example: "2026-02-01T00:00:00Z"
        value_date:
          type: string
          format: date-time
          description: RFC3339 timestamp. Must match across every entry in the journal.
          example: "2026-02-01T00:00:00Z"
        account:
          type: string
          description: Account code this entry is posted to.
          example: JOEBLOGGS
        subaccount:
          type: string
          enum: ["", "CASH", "MARGIN", "FDIC", "MM", "BORROWED", "ONLOAN", "FREE", "SEG"]
          description: Subaccount within the account. Omit for none.
        nature:
          type: string
          enum: ["", "CustomerChargeIncome", "CommissionIncome", "InterestIncome", "MarketValue", "RPL", "URPL", "OwnMoneyEquity", "OwnPosition", "InterestAccrual", "FXDealing", "FXRounding", "FXURPL"]
          description: Income classification. Omit or empty string for normal balance sheet entries.
        money_qty:
          allOf:
            - $ref: "#/components/schemas/DirectedQuantity"
          description: >
            Cash leg. Security is a currency code; direction is `DR` or `CR`. Omit (or leave
            security empty) if there's no cash leg.
          example: {security: USD, amount: "100.00", direction: DR}
        stock_qty:
          allOf:
            - $ref: "#/components/schemas/DirectedQuantity"
          description: >
            Share leg. Security is an equity/bond code; direction is `LONG` or `SHORT`. Omit
            (or leave security empty) if there's no stock leg.
          example: {security: AAPL, amount: "10.000000", direction: LONG}
        associated_person_code:
          type: string
          description: Optional party code of an associated person/broker for this entry. Omit if not set.
        secondary_account:
          type: string
          description: >
            Optional code of a second account referenced by this entry (e.g. the customer
            account on the asset side of an FDIC sweep entry). Omit if not set.
          example: JOEBLOGGS

    LotPosition:
      type: object
      required: [security, currency, account, subaccount, qty, book_cost, rpl]
      description: >
        Aggregated lot position for a `(account, subaccount, security, currency)` group.
        Shows the net open quantity, the total book cost of the remaining position,
        and cumulative realised P&L across all lot rows.
      properties:
        security:
          type: string
          description: Security code.
          example: AAPL
        currency:
          type: string
          description: Currency the book cost and RPL are expressed in.
          example: USD
        account:
          type: string
          description: Account code.
          example: JOEBLOGGS
        subaccount:
          type: string
          enum: ["", "CASH", "MARGIN", "FDIC", "MM", "BORROWED", "ONLOAN", "FREE", "SEG"]
        qty:
          type: string
          description: Net open position (positive = long, negative = short; full security precision).
          example: "100.000000"
        book_cost:
          type: string
          description: >
            Total cost basis of the remaining open position (full currency precision).
            Positive for long positions (cost paid); approaches zero as the position is sold off.
          example: "19589.00"
        rpl:
          type: string
          description: Cumulative realised P&L across all closed and partially-closed lots (full currency precision).
          example: "0.00"

    LotRow:
      type: object
      required: [lot_id, lot_seq, seid, datetime, currency, qty, tx_amount, book_cost, rpl, is_opening, is_closed]
      description: >
        A single row within a trading lot. Opening rows (is_opening=true) record the initial
        acquisition; relief rows record subsequent sells that reduce or close the lot.

        All monetary amounts use a position-centric sign:
        - `tx_amount`: positive = cost paid (buy), negative = proceeds received (sell).
        - `book_cost`: positive on openings (cost allocated), negative on reliefs (cost removed).
        - `rpl`: realised P&L on relief rows = `book_cost + tx_amount` (zero on openings).
      properties:
        lot_id:
          type: integer
          format: int64
          description: Persisted lot ID. `0` if the trade has not yet been through the lot-matching process (unlotted).
          example: 1
        lot_seq:
          type: integer
          description: 1-based sequential index grouping rows by lot within this response.
          example: 1
        seid:
          type: integer
          format: int64
          description: SEID of the originating trade entry.
          example: 50
        datetime:
          type: string
          format: date
          description: Transaction date of the originating trade.
          example: "2026-06-10"
        currency:
          type: string
          description: Currency code for `tx_amount`, `book_cost`, and `rpl`.
          example: USD
        qty:
          type: string
          description: Quantity of this lot row (positive = opening or WAC addition, negative = relief).
          example: "100.000000"
        tx_amount:
          type: string
          description: Cash consideration (position-centric). Positive = cost paid on buy; negative = proceeds on sell.
          example: "19589.00"
        book_cost:
          type: string
          description: Book cost for this row. Positive on opening; negative on relief (cost removed from the position).
          example: "19589.00"
        rpl:
          type: string
          description: Realised P&L for this row. Non-zero only on relief rows.
          example: "0.00"
        is_opening:
          type: boolean
          description: True for the initial opening row of each lot.
          example: true
        is_closed:
          type: boolean
          description: True if the parent lot has been fully relieved (position reduced to zero).
          example: false

    LotsDetail:
      type: object
      required: [account, security, subaccount, allocation_method, rows]
      description: Response for a lot detail query — includes the account's allocation method and all lot rows.
      properties:
        account:
          type: string
          description: Account code.
          example: JOEBLOGGS
        security:
          type: string
          description: Security code.
          example: AAPL
        subaccount:
          type: string
          description: Subaccount filter that was applied. Empty string means all subaccounts were returned.
          example: ""
        allocation_method:
          type: string
          enum: [none, fifo, lifo, wac]
          description: Lot allocation method configured for this account.
          example: fifo
        rows:
          type: array
          description: All lot rows for this account / security, ordered by lot and then by date within each lot.
          items:
            $ref: "#/components/schemas/LotRow"

    SettlementPosition:
      type: object
      required: [security, account, subaccount, qty, oldest_vd]
      description: >
        An aggregated open settlement obligation. Positive `qty` = pending receive (buy-side);
        negative `qty` = pending deliver (sell-side, i.e. a potential fail). `oldest_vd` is
        the value date of the oldest unclosed settlement lot — the "fail age" of the position.
      properties:
        security:
          type: string
          description: Security code.
          example: AAPL
        account:
          type: string
          description: Account code.
          example: JOEBLOGGS
        subaccount:
          type: string
          description: Subaccount.
          example: CASH
        qty:
          type: string
          description: Net open settlement quantity. Positive = due to receive; negative = due to deliver.
          example: "100.000000"
        oldest_vd:
          type: string
          format: date
          description: Value date of the oldest unclosed settlement lot in this group. Used to measure settlement fail age.
          example: "2026-06-12"

    SettlementLotRow:
      type: object
      required: [lot_id, lot_seq, seid, value_date, qty, is_opening, is_closed]
      description: >
        A single settlement lot row. Opening rows correspond to DELIVER or RECEIVE ledger
        entries; closing rows are recorded when the counterpart confirmation arrives.
      properties:
        lot_id:
          type: integer
          format: int64
          description: Persisted settlement lot ID.
          example: 10
        lot_seq:
          type: integer
          description: 1-based index grouping rows by settlement lot within this response.
          example: 1
        seid:
          type: integer
          format: int64
          description: SEID of the originating instruction (DELIVER or RECEIVE entry).
          example: 51
        value_date:
          type: string
          format: date
          description: Intended settlement date of this instruction (YYYY-MM-DD).
          example: "2026-06-12"
        qty:
          type: string
          description: Quantity for this row (positive = opening receive or partial fill; negative = closing deliver).
          example: "100.000000"
        is_opening:
          type: boolean
          description: True for the opening row of each settlement lot.
          example: true
        is_closed:
          type: boolean
          description: True if this settlement lot has been fully matched and closed.
          example: false

    SettlementLotsDetail:
      type: object
      required: [account, security, subaccount, rows]
      description: Response for a settlement lot detail query.
      properties:
        account:
          type: string
          description: Account code.
        security:
          type: string
          description: Security code.
        subaccount:
          type: string
          description: Subaccount filter applied. Empty string means all subaccounts were returned.
        rows:
          type: array
          description: All settlement lot rows for this account / security.
          items:
            $ref: "#/components/schemas/SettlementLotRow"

    PriceRecord:
      type: object
      required: [id, source, date, price, currency]
      description: A single price observation for a security on a given date from a given source.
      properties:
        id:
          type: integer
          format: int64
          description: Internal price record ID.
          example: 1
        source:
          type: string
          description: >
            Identifies where the price came from. `INTERNAL` means the price was entered
            manually by an operator. Additional sources could be added for market data feeds.
          example: INTERNAL
        date:
          type: string
          format: date
          description: Date of the price observation (YYYY-MM-DD).
          example: "2026-06-10"
        price:
          type: string
          description: Price per whole unit of the security in the given currency (decimal string, full currency precision).
          example: "195.89"
        currency:
          type: string
          description: Currency the price is expressed in.
          example: USD

    Closing:
      type: object
      required: [id, closing_type, closed_at, known_at]
      description: >
        A closing freezes a set of snapshots and then runs the instructions that read them.
        `CLOSE_OF_TRADING` is the end-of-day pass (marks, margin, the segregation lookahead);
        `START_OF_DAY` is the morning pass, which takes no marks but runs the confirmed checks
        against what happened overnight.
      properties:
        id:
          type: integer
          format: int64
          description: Unique closing ID.
          example: 1
        closing_type:
          type: string
          enum: [CLOSE_OF_TRADING, START_OF_DAY]
          description: The type of closing event.
        closed_at:
          type: string
          format: date-time
          description: >
            The transaction-date basis the closing snapshots to — "the books as at this
            instant" (RFC 3339, UTC).
          example: "2026-06-10T20:00:00Z"
        known_at:
          type: string
          format: date-time
          description: >
            When the closing actually ran, and therefore the **knowledge bound** of its
            snapshots — as distinct from `closed_at`, which is the transaction-date basis they
            snapshot *to*. Normally both come from the system clock and are equal; they diverge
            when a period is closed after the fact. Recomputing this closing's basis with the
            `closed_at`/`known_at` pair reproduces the original rows, so anything back-posted
            into the period afterwards (which carries a later knowledge date) cannot change what
            a closed period reports.
          example: "2026-06-10T20:00:00Z"

    ClosingDetail:
      type: object
      required: [id, closing_type, closed_at, known_at, trial_balance_snapshot_id, stock_record_snapshot_id, mtm_snapshot_id]
      description: >
        Closing record plus the IDs of the snapshots that were taken at close.
        Pass these IDs to the `/snapshots/*` endpoints to retrieve the snapshot data.
      properties:
        id:
          type: integer
          format: int64
          description: Unique closing ID.
          example: 1
        closing_type:
          type: string
          enum: [CLOSE_OF_TRADING, START_OF_DAY]
        closed_at:
          type: string
          format: date-time
          description: >
            The transaction-date basis the closing snapshots to — "the books as at this
            instant" (RFC 3339, UTC).
          example: "2026-06-10T20:00:00Z"
        known_at:
          type: string
          format: date-time
          description: >
            The knowledge bound of this closing's snapshots — when the closing ran. See the
            `Closing` schema.
          example: "2026-06-10T20:00:00Z"
        trial_balance_snapshot_id:
          type: integer
          format: int64
          description: Pass to `GET /snapshots/trial-balance/{id}` to retrieve cash positions as of this closing.
          example: 42
        stock_record_snapshot_id:
          type: integer
          format: int64
          description: Pass to `GET /snapshots/stock-record/{id}` to retrieve share positions as of this closing.
          example: 43
        mtm_snapshot_id:
          type: integer
          format: int64
          description: Pass to `GET /snapshots/mtm/{id}` to retrieve mark-to-market values as of this closing.
          example: 44
        trading_position_snapshot_id:
          type: integer
          format: int64
          description: >
            Pass to `GET /snapshots/trading-positions/{id}` to retrieve open trading (lot)
            positions as of this closing. Present for CLOSE_OF_TRADING closings only.
          example: 45
        settlement_position_snapshot_id:
          type: integer
          format: int64
          description: >
            Pass to `GET /snapshots/settlement-positions/{id}` to retrieve open settlement
            obligations as of this closing. Always present, like `trial_balance_snapshot_id` --
            settlement lots are run for every closing type, not just ones that compute MTM.
          example: 47
        margin_maintenance_snapshot_id:
          type: integer
          format: int64
          description: >
            Pass to `GET /snapshots/margin-maintenance/{id}` to retrieve margin maintenance
            requirements as of this closing. Omitted for closing types that don't compute MTM
            (currently `START_OF_DAY`), since margin maintenance is derived from the MTM snapshot
            and is never computed live.
          example: 45
        stock_segregation_snapshot_id:
          type: integer
          format: int64
          description: >
            Pass to `GET /snapshots/stock-segregation/{id}` to retrieve SEC Rule 15c3-3 stock
            segregation requirements. **A lookahead: the requirement is for the next business
            day, not for this closing's date** — see `stock_segregation_effective_date`.
            Omitted for closing types that don't compute MTM (currently `START_OF_DAY`), since
            this is derived from the MTM snapshot and is never computed live.
          example: 46
        seg_sufficiency_snapshot_id:
          type: integer
          format: int64
          description: >
            Pass to `GET /snapshots/stock-segregation-sufficiency/{id}`. Present only on
            `START_OF_DAY` closings, which is when the confirmed check runs.
          example: 52
        stock_segregation_effective_date:
          type: string
          format: date
          description: >
            The business date the segregation snapshot governs — the next business day after
            `closed_at`. Present whenever `stock_segregation_snapshot_id` is. Label those rows
            with this rather than with the closing date: it is the one snapshot on a closing
            that describes a day other than the closing's own.
          example: "2026-06-15"
        interest_accrual_snapshot_id:
          type: integer
          format: int64
          description: >
            Pass to `GET /snapshots/interest-accrual/{id}` to retrieve accrued interest per bond
            position as of this closing. Omitted for closing types that don't compute MTM
            (currently `START_OF_DAY`), since it is derived from the stock record snapshot.
          example: 48
        sbl_contracts_snapshot_id:
          type: integer
          format: int64
          description: >
            Pass to `GET /snapshots/sbl-contracts/{id}` to retrieve the securities borrow and
            loan contracts outstanding as of this closing. Present on `CLOSE_OF_TRADING`
            closings only — that is when the day's contract file from the lending system has
            landed, and nothing downstream is computed from it.
          example: 61
        finance_trial_balance_snapshot_id:
          type: integer
          format: int64
          description: >
            Pass to `GET /snapshots/finance-trial-balance/{id}` to retrieve the general-ledger
            style trial balance as of this closing. Omitted for closing types that don't compute
            MTM (currently `START_OF_DAY`), since it is derived from the trial balance, MTM,
            trading position, and interest accrual snapshots.
          example: 49

    MTMSnapshotRow:
      type: object
      required:
        [account, subaccount, security, currency, td_qty, vd_qty, td_market_value, vd_market_value,
         price_date, price_age_days, stale_threshold_days, fair_value_level, stale]
      description: >
        A single mark-to-market row. Gives both the TD (trade-date) and VD
        (value-date/settled) share position for an `(account, subaccount, security)` group, and
        the resulting market value at each basis in the security's pricing currency (same
        price applied to both quantities). Only present for securities that had an available
        internal price at the time of the closing. Use `td_*` for risk/credit-exposure
        calculations (e.g. margin maintenance); use `vd_*` for possession/custody calculations
        (e.g. stock segregation) — an unsettled trade isn't yet in the firm's depository
        position, so it can't be segregated or pledged.


        The `price_*`, `fair_value_level` and `stale` fields are the mark's provenance, frozen
        at snapshot time. Pricing uses the last observation on or before the closing, so a
        position whose price file stopped arriving is still marked — at whatever price came
        last. `price_age_days` says how far back that was, and `stale` compares it to the
        firm's tolerance for the security's fair value level. **A stale row is flagged, not
        omitted**: excluding it would read downstream as a zero position, which understates
        the 15c3-3 segregation requirement rather than erring on the safe side.
      properties:
        account:
          type: string
          description: Account code.
          example: JOEBLOGGS
        subaccount:
          type: string
          enum: ["", "CASH", "MARGIN", "FDIC", "MM", "BORROWED", "ONLOAN", "FREE", "SEG"]
          description: Subaccount within the account.
        security:
          type: string
          description: Security code.
          example: AAPL
        currency:
          type: string
          description: Currency the market value is expressed in (the security's pricing currency).
          example: USD
        td_qty:
          type: string
          description: TD (trade-date) share position at the time of the closing (decimal string, full security precision).
          example: "100.000000"
        vd_qty:
          type: string
          description: VD (value-date/settled) share position at the time of the closing (decimal string, full security precision).
          example: "100.000000"
        td_market_value:
          type: string
          description: Market value = td_qty × price, expressed in the pricing currency (decimal string, full currency precision).
          example: "19742.00"
        vd_market_value:
          type: string
          description: Market value = vd_qty × price, expressed in the pricing currency (decimal string, full currency precision).
          example: "19742.00"
        price_date:
          type: string
          format: date
          description: Date of the price observation this mark was struck at. May be earlier than the closing date.
          example: "2026-01-16"
        price_age_days:
          type: integer
          description: >
            Business days between `price_date` and the closing date. Weekends are excluded
            (holidays are not yet modelled), so a Monday closing marking off Friday's close
            gives 1, not 3. Frozen at snapshot time rather than recomputed on read, so adding
            a holiday calendar later cannot change how stale a past mark appears.
          example: 1
        stale_threshold_days:
          type: integer
          description: >
            The firm's tolerance, in business days, that applied to this row — resolved from
            the security's type and fair value level and frozen here, so a past closing
            answers with the policy in force then.
          example: 1
        fair_value_level:
          type: string
          enum: ["1", "2", "3"]
          description: >
            ASC 820 / IFRS 13 fair value hierarchy level resolved for this security, and the
            reason `stale_threshold_days` is what it is.
          example: "1"
        stale:
          type: boolean
          description: >
            `price_age_days > stale_threshold_days`. Derived and sent for convenience; the row
            is present and priced either way.
          example: false

    MarginMaintenanceSnapshotRow:
      type: object
      required: [account, subaccount, currency, lmv, smv, money_balance, equity, requirement, excess]
      description: >
        Margin maintenance requirement for a single `(account, currency)` at the time of a
        closing, scoped to the `MARGIN` subaccount only — `CASH` is a separate Reg T account
        in this system and never contributes to or cures a `MARGIN` deficiency. Only present
        for customer accounts with `MARGIN`-subaccount activity. `excess` negative means a
        margin call for that amount.
      properties:
        account:
          type: string
          description: Account code.
          example: JOEBLOGGS
        subaccount:
          type: string
          enum: [MARGIN]
          description: Always `MARGIN` — stored explicitly rather than implied.
        currency:
          type: string
          description: Currency the figures are expressed in.
          example: USD
        lmv:
          type: string
          description: Long market value of MARGIN-subaccount positions (decimal string).
          example: "2000.00"
        smv:
          type: string
          description: Short market value of MARGIN-subaccount positions (decimal string, always non-negative).
          example: "0.00"
        money_balance:
          type: string
          description: >
            Signed MARGIN-subaccount cash/loan balance. Positive = DR = the customer owes the
            broker (a margin loan).
          example: "2000.00"
        equity:
          type: string
          description: "`lmv − smv − money_balance`."
          example: "0.00"
        requirement:
          type: string
          description: >
            Total maintenance requirement, summed from the per-position detail (each position's
            resolved long/short rate, with the $5/share floor applied on shorts).
          example: "500.00"
        excess:
          type: string
          description: "`equity − requirement`. Negative means a maintenance call for that amount."
          example: "-500.00"

    MarginRequirementPositionRow:
      type: object
      required: [account, subaccount, security, currency, qty, market_value, rate_bps, requirement]
      description: >
        Per-position maintenance margin detail for a single `MARGIN`-subaccount position at the
        time of a closing. Retained at this granularity, rather than only the account-level
        rollup, because the short-side $5/share floor is only meaningful per security — it
        can't be derived once positions are aggregated across securities with different prices
        and share counts.
      properties:
        account:
          type: string
          description: Account code.
          example: JOEBLOGGS
        subaccount:
          type: string
          enum: [MARGIN]
          description: Always `MARGIN` — stored explicitly rather than implied.
        security:
          type: string
          description: Security code.
          example: MSFT
        currency:
          type: string
          description: Currency the market value and requirement are expressed in.
          example: USD
        qty:
          type: string
          description: TD share position (decimal string, full security precision). Negative = short.
          example: "10.000000"
        market_value:
          type: string
          description: Signed market value of the position (negative for shorts).
          example: "2000.00"
        rate_bps:
          type: integer
          format: int64
          description: >
            The resolved maintenance rate actually applied, in basis points — the security's
            house override if set, otherwise the FINRA minimum (2500 long / 3000 short).
          example: 2500
        requirement:
          type: string
          description: >
            Dollar maintenance requirement for this position. For shorts, this is
            `max(rate × |market_value|, $5 × |qty|)` — the $5/share floor is already applied,
            not just the percentage.
          example: "500.00"

    SBLContractSnapshotRow:
      type: object
      description: >
        One securities borrow or loan still outstanding at a closing, or one whose
        collateral has not gone back with it.
      properties:
        lending_contra:
          type: string
          description: The securities lending counterparty the contract is with.
          example: SBL_GS
        contract_identifier:
          type: string
          description: The lender-assigned contract identifier, scoped to the counterparty.
          example: GS-2026-0003
        account:
          type: string
          description: The firm's own account lending or borrowing.
          example: PROP1
        borrow:
          type: boolean
          description: True for stock borrowed in, false for stock lent out.
          example: true
        security:
          type: string
          example: AAPL
        quantity:
          type: string
          description: >
            How much of the contract is still open, at the security's precision. Positive for
            both borrows and loans; negative means the contract was over-closed.
          example: "250.000000"
        currency:
          type: string
          example: USD
        collateral:
          type: string
          description: >
            Collateral still posted against the contract today: opens less closes plus every
            mark since. Summed independently of the quantity rather than derived from it, so
            the gap between the two is the mark exposure. Non-zero against a zero quantity
            means collateral is stranded on a contract that is no longer open.
          example: "37182.50"
        fee_bps:
          type: integer
          description: >
            The lender's fee in force at the closing, in basis points: the last one agreed
            at or before it. Absent only for a contract whose open this system never saw,
            an open being required to carry one.

            Deliberately not the rebate *rate* in force — that needs a benchmark rate
            resolved for the closing's date, which belongs with the accrual rather than
            here. When accrual lands it will follow the interest-accrual snapshot and
            report accrued interest directly.
          example: 25
        rebate_benchmark:
          type: string
          description: >
            Code of the benchmark the fee in force was agreed against, read from the same
            movement as `fee_bps`. Absent when the fee is charged with no rebate leg.
          example: SOFR
        opened_at:
          type: string
          format: date-time
          description: The opening contract date, for aging.
          example: "2026-06-02T10:00:00Z"

    SettlementPositionSnapshotRow:
      type: object
      required: [lot_id, account, subaccount, security, value_date, qty]
      description: >
        One rung of the settlement ladder as of a closing: a single open settlement obligation
        with the date it is due, frozen at that point in time.


        **The grain is the lot, not the position.** A `(account, subaccount, security)` with three
        obligations due on three dates is three rows, so "what is expected to settle by date D"
        is a `value_date <= D` filter and "how long has this failed" is readable per obligation.
        It was previously one netted row per header carrying only the oldest value date, which
        could answer neither.


        **Read the date per settlement mode**, which comes from the control account
        (`Account.settlement_mode`). Under `TFT` each row is a distinct trade settling on its own
        date. Under `CNS` the date is an *aging* date rather than an expectation: relief matches
        on lot key and opposite sign with no date condition, so a newer obligation can be
        consumed relieving an older open lot and the survivor keeps the older date. Everything
        due by a date settles as one net under CNS, so summing `value_date <= D` is still the
        right question — the per-row dates tell you how aged the components are.


        Differs in grain from `GET /lots/settlement/positions`, which is still netted per header.
      properties:
        lot_id:
          type: integer
          format: int64
          description: >
            The settlement lot this obligation belongs to — the row's identity. Join
            `lots_settlement` for the frozen `lot_key`, which records how this obligation
            netted and cannot be reinterpreted if an account's settlement mode changes.
          example: 812
        account:
          type: string
          description: Account code (e.g. the DTC CNS control account).
          example: DTC_CNS
        subaccount:
          type: string
          example: ""
        security:
          type: string
          description: Security code of the outstanding obligation.
          example: AAPL
        value_date:
          type: string
          format: date-time
          description: >
            When this obligation was due — the lot's opening value date. Exact, not the oldest
            of several.
          example: "2026-06-10T00:00:00Z"
        qty:
          type: string
          description: >
            Quantity still outstanding on this lot, as a decimal string. Positive = owed to the
            account; negative = owed by the account. Not the net across the header.
          example: "100.000000"

    TradingPositionSnapshotRow:
      type: object
      required: [account, subaccount, security, currency, qty, book_cost, rpl]
      description: >
        Aggregated lot position for a single `(account, subaccount, security, currency)` header
        in a firm account at the time of a closing. Only non-zero net quantity positions are
        captured.
      properties:
        account:
          type: string
          description: Account code.
          example: INVENTORY
        subaccount:
          type: string
          example: long
        security:
          type: string
          description: Security code of the position.
          example: AAPL
        currency:
          type: string
          description: Currency of cost/RPL amounts.
          example: USD
        qty:
          type: string
          description: Net position quantity as a decimal string.
          example: "100.000000"
        book_cost:
          type: string
          description: Aggregate book cost (positive for long positions).
          example: "15000.00"
        rpl:
          type: string
          description: Realised P&L accumulated on this position header.
          example: "250.00"

    SegregationSufficiencySnapshotRow:
      type: object
      required: [security, required, segregated, excess]
      description: >
        One security's confirmed segregation position at a closing: what had to be
        segregated against what is. `excess` is `segregated - required`, sent rather
        than left to the client to subtract so the two cannot disagree about its sign.
      properties:
        security:
          type: string
          example: NVDA
        required:
          type: string
          description: The requirement in force, from the lookahead struck at the previous close.
          example: "90.000000"
        segregated:
          type: string
          description: Held quantity in the custody account's Seg subaccount.
          example: "80.000000"
        excess:
          type: string
          description: >
            How the box stands against the requirement, signed as the quantity reads and
            not clamped either way. Positive is stock segregated beyond what 15c3-3 asks
            — not a breach, but stock the firm cannot deliver, so its size is reported
            rather than shown as zero. Negative is a shortfall: a possession-and-control
            breach, and the only case that raises a `seg_deficiency` finding, which
            carries the same figure as a positive magnitude.
          example: "-10.000000"

    StockSegregationSnapshotRow:
      type: object
      required: [account, subaccount, security, currency, qty, market_value, segregated_qty, collateral_qty]
      description: >
        SEC Rule 15c3-3 stock segregation result for a single `(account, subaccount, security)`
        long position at the time of a closing.


        **`qty`/`market_value` are the settled position projected to the next business day, not
        today's.** The requirement is a lookahead and has to be: it is computed after the close,
        instructed to the depository overnight, and governs the box tomorrow — so the position it
        must cover is the one the client will own once everything already traded has settled. A
        sale settling tomorrow has already dropped out here while still showing in today's
        `vd_qty` on the stock record; a sale settling later than tomorrow still counts. Marks are
        today's: tomorrow's position at tonight's prices. Settled rather than trade-date for the
        usual reason — an unsettled trade is not in the firm's depository position — the
        projection moves the settlement bound forward a day, it does not switch axis. A
        customer's long stock may be pledged as collateral (`collateral_qty`) up to 140% of the
        TD cash debit balance in that same `(account, subaccount)`; everything beyond that must
        be segregated free of lien (`segregated_qty`). `collateral_qty + segregated_qty` always
        equals `qty`. Customer accounts only; short positions hold nothing to segregate and
        never appear here, so a `CASH`-subaccount position (which carries no debit balance in
        practice) is always fully segregated. A position whose security is on the firm's stock
        prioritization never-free list, or whose type isn't in the eligible types list (see
        `StockSegregationConfig`), is also always fully segregated regardless of available
        capacity.
      properties:
        account:
          type: string
          description: Account code.
          example: JOEBLOGGS
        subaccount:
          type: string
          enum: [CASH, MARGIN]
          example: MARGIN
        security:
          type: string
          description: Security code.
          example: MSFT
        currency:
          type: string
          description: Currency the market value is expressed in.
          example: USD
        qty:
          type: string
          description: VD (settled) long share position (decimal string, full security precision).
          example: "10.000000"
        market_value:
          type: string
          description: Market value of the position.
          example: "2000.00"
        segregated_qty:
          type: string
          description: Shares that must be held free of lien.
          example: "0.000000"
        collateral_qty:
          type: string
          description: Shares that may be pledged as collateral.
          example: "10.000000"

    InterestAccrualSnapshotRow:
      type: object
      required: [account, subaccount, security, currency, qty, accrued_interest]
      description: >
        Accrued interest for a single `(account, subaccount, security)` bond position at the
        time of a closing. `qty` is the TD face-value position from the stock record snapshot
        (minor units as a decimal string). `accrued_interest` is the interest accrued from the
        start of the current coupon period to the closing date, in the bond's pricing currency
        (minor units as a decimal string). Negative values arise for short positions. Only rows
        with a non-zero accrued interest amount are stored.
      properties:
        account:
          type: string
          description: Account code.
          example: JOEBLOGGS
        subaccount:
          type: string
          example: CASH
        security:
          type: string
          description: Bond security code.
          example: ACME2034
        currency:
          type: string
          description: Accrual currency (pricing currency of the bond).
          example: USD
        qty:
          type: string
          description: TD face-value position as a decimal string (minor units).
          example: "10000.00"
        accrued_interest:
          type: string
          description: Accrued interest in the bond's pricing currency (minor units).
          example: "52.08"

    StockSegregationConfig:
      type: object
      required: [never_free, priority_securities, eligible_types]
      description: >
        One firm's stock prioritization configuration for the stock segregation calculation.
        Which of a customer's shares a broker may pledge is that broker's own policy under its
        15c3-3 obligation, so this is held per firm — two firms on the same instance
        legitimately answer it differently. All three lists default to empty when unconfigured,
        which is the strict reading: nothing is eligible for collateral, so everything is
        segregated.
      properties:
        never_free:
          type: array
          items:
            type: string
          description: Securities never offered as collateral, regardless of available capacity. Unordered.
          example: ["COIN"]
        priority_securities:
          type: array
          items:
            type: string
          description: >
            Securities offered as collateral first, in this order, before any other eligible
            security. Must not overlap with `never_free`.
          example: ["AAPL", "MSFT"]
        eligible_types:
          type: array
          items:
            type: string
            enum: [currency, ord, corp_bond, govt_bond, money_market_fund]
          description: >
            Security types eligible for collateral at all, in preference order (used as a
            secondary sort key after `priority_securities`). A type missing from this list is
            never eligible — this is a strict allow-list: an empty list means nothing is
            eligible for collateral.
          example: ["ord"]

    CorrespondentDepositEvent:
      type: object
      required: [account, custody_account, currency, amount, transaction_date, value_date]
      description: >
        Records a correspondent funding its own PAB account with this firm — the clearing
        deposit posted under the carrying agreement, collateral, or cash to buy stock
        with. The system credits the PAB account (increasing the obligation to the
        correspondent) and debits the custody account.


        Mechanically this mirrors `CustomerDeposit`, and it is a separate event because
        the money is a different kind: a customer deposit creates a customer obligation,
        which belongs in the customer reserve computation, while a correspondent's own
        property does not — a broker-dealer is generally not a "customer" of another
        broker-dealer as to its proprietary assets. Each event refuses the other's
        account type.
      properties:
        transaction_date:
          type: string
          format: date-time
          description: Business date of the deposit (RFC3339).
          example: "2026-06-10T00:00:00Z"
        value_date:
          type: string
          format: date-time
          description: Settlement date of the deposit (RFC3339).
          example: "2026-06-12T00:00:00Z"
        account:
          type: string
          description: PAB account code to receive the deposit. Must be a `pab`-type account.
          example: PERSCA_PAB
        subaccount:
          type: string
          description: Subaccount within the account (e.g. `CASH` or `MARGIN`).
          example: CASH
        custody_account:
          type: string
          description: Custody account receiving the funds. Must be a `custody`-type account.
          example: BNYOPS
        currency:
          type: string
          description: Currency of the deposit.
          example: USD
        amount:
          type: string
          description: Deposit amount as a positive decimal string at the currency's precision.
          example: "500000.00"

    CustomerDepositEvent:
      type: object
      required: [account, custody_account, currency, amount, transaction_date, value_date]
      description: >
        Records a cash deposit into a customer account. The system credits the
        customer account (increasing the broker liability to the client) and debits
        the custody account. The net effect is a negative (CR) money entry on the
        customer account and a positive (DR) entry on the custody account.
      properties:
        transaction_date:
          type: string
          format: date-time
          description: Business date of the deposit (RFC3339).
          example: "2026-06-10T00:00:00Z"
        value_date:
          type: string
          format: date-time
          description: Settlement date of the deposit (RFC3339).
          example: "2026-06-12T00:00:00Z"
        account:
          type: string
          description: Customer account code to receive the deposit. Must be a `customer`-type account.
          example: JOEBLOGGS
        subaccount:
          type: string
          description: Subaccount within the account (e.g. `CASH` or `MARGIN`).
          example: CASH
        custody_account:
          type: string
          description: Custody account receiving the funds. Must be a `custody`-type account.
          example: BNYOPS
        currency:
          type: string
          description: Currency of the deposit.
          example: USD
        amount:
          type: string
          description: Deposit amount as a positive decimal string at the currency's precision.
          example: "10500.00"

    OwnCashDepositEvent:
      type: object
      required: [account, custody_account, currency, amount, transaction_date]
      description: >
        Records the firm depositing its own cash into a custody (bank) account. The custody
        account is debited (cash received) and the firm account is credited (equity contribution).
        Transaction and value date can never differ for this event, so there is a single
        `transaction_date` — not a separate `value_date`.
      properties:
        transaction_date:
          type: string
          format: date-time
          example: "2026-01-01T00:00:00Z"
        account:
          type: string
          description: Firm account code being credited. Must be an `inventory`-type account.
          example: PROP1
        custody_account:
          type: string
          description: Custody (bank) account code being debited. Must be a `custody`-type account.
          example: BNYOPS
        currency:
          type: string
          description: Currency of the deposit.
          example: USD
        amount:
          type: string
          description: Deposit amount as a positive decimal string at the currency's precision.
          example: "1000000.00"

    CustomerChargeEvent:
      type: object
      required: [account, currency, amount, transaction_date]
      description: >
        Records a fee or charge against a customer account. The system debits the
        customer account (reducing the credit balance) and credits a firm income account.
        Transaction and value date can never differ for this event, so there is a single
        `transaction_date` — not a separate `value_date`.
      properties:
        transaction_date:
          type: string
          format: date-time
          example: "2026-06-10T00:00:00Z"
        account:
          type: string
          description: Customer account to charge. Must be a `customer`-type account.
          example: JOEBLOGGS
        subaccount:
          type: string
          description: Subaccount within the account.
          example: CASH
        currency:
          type: string
          description: Currency of the charge.
          example: USD
        amount:
          type: string
          description: Charge amount as a positive decimal string.
          example: "25.00"

    CurrencyQuantity:
      type: object
      required: [currency, amount]
      description: >
        An amount of money and the currency it is in. Both are required: the two
        are one fact, and an amount without a currency is a figure with no unit.
        A field of this type is omitted entirely when it does not apply, rather
        than sent half-filled.
      properties:
        currency:
          type: string
          description: Currency code.
          example: USD
        amount:
          type: string
          description: >
            Positive decimal string at the currency's precision. A string, not a
            number — no amount in this API is ever a float.
          example: "9.99"

    EquityTradeEvent:
      type: object
      required: [account, contra_account, security, currency, quantity, price, buy, transaction_date, value_date]
      description: >
        Records a retail equity trade — a buy or sell of shares for a customer or
        firm account. Generates ledger entries for the cash consideration, share
        movement, optional commission, and optional regulatory fees (SEC Section 31
        fee, FINRA TAF). Also writes a trade blotter row and unlotted lot rows for
        subsequent lot-matching.

        Either side may settle in a currency other than the one the trade is
        priced in — see `account_settlement` and `contra_settlement`. A settlement quantity drives the ledger money
        leg, the trading lot amounts and the market settlement obligation on its
        side, so a position settled in CAD is carried in CAD — and a trading lot
        header is keyed by its currency, so settling one account's position in a
        security inconsistently splits it across two headers.
      properties:
        transaction_date:
          type: string
          format: date-time
          description: Trade date.
          example: "2026-06-10T00:00:00Z"
        value_date:
          type: string
          format: date-time
          description: Settlement date — typically T+2 for US equities.
          example: "2026-06-12T00:00:00Z"
        account:
          type: string
          description: Customer or firm account executing the trade.
          example: JOEBLOGGS
        subaccount:
          type: string
          enum: ["", "CASH", "MARGIN", "FDIC", "MM", "BORROWED", "ONLOAN", "FREE", "SEG"]
          description: Subaccount within the account.
          example: CASH
        contra_account:
          type: string
          description: >
            The other side of the trade. For a customer account: an `inventory`
            account (the firm takes the other side), a `pab` (a correspondent
            does), a `control` account (market settlement, with a later
            `Settlement` event confirming it), or a `custody` account — a
            clearing omnibus, for a firm that clears through another and so
            instructs no settlement of its own. For an `inventory` or `pab`
            account: `control` or `custody` only, since a customer-facing trade
            is entered from the customer side.
          example: PROP1
        security:
          type: string
          description: Security code of the traded instrument.
          example: AAPL
        currency:
          type: string
          description: Currency for the cash consideration.
          example: USD
        quantity:
          type: string
          description: >
            Share quantity as a positive decimal string at full security precision.
            The `buy` field determines direction.
          example: "100.000000"
        price:
          type: string
          description: Trade price per whole share in the given `currency`, as a decimal string.
          example: "195.89"
        buy:
          type: boolean
          description: >
            `true` for a buy (account receives shares, pays cash);
            `false` for a sell (account delivers shares, receives cash).
          example: true
        commission:
          allOf:
            - $ref: "#/components/schemas/CurrencyQuantity"
          description: >
            Commission charged to the customer. Omit for no commission. The
            currency is required — it does **not** default to the trade's
            `currency`.
        sec_fee:
          allOf:
            - $ref: "#/components/schemas/CurrencyQuantity"
          description: >
            SEC Section 31 transaction fee. Typically applied on sells only.
            Assessed in USD whatever the trade is priced in, so its currency is
            stated rather than inherited from `currency`.
        taf_fee:
          allOf:
            - $ref: "#/components/schemas/CurrencyQuantity"
          description: FINRA Trading Activity Fee. Its currency is stated, as for `sec_fee`.
        account_settlement:
          allOf:
            - $ref: "#/components/schemas/CurrencyQuantity"
          description: >
            What the `account` side settles for, when it settles in a currency
            other than the trade's — a US stock priced in USD paid for out of a
            CAD balance. The amount is positive; the direction is the trade's
            own. Omit for the ordinary case, where the side settles
            `quantity × price` in `currency`. The currency must not be
            `currency` — what the trade is worth in its own currency is already
            stated by `quantity` and `price`.
        contra_settlement:
          allOf:
            - $ref: "#/components/schemas/CurrencyQuantity"
          description: >
            The same for the `contra_account` side, and independent of it: the
            usual customer trade settles the account side across currencies and
            leaves the market side in the trade currency, while a firm account
            facing the market is the mirror of that. Whatever the two sides do
            not net out to is posted to the firm's FX clearing account, which is
            where the resulting FX position is kept. If both sides settle in the
            same currency the two amounts must be equal.
        order_ref:
          type: string
          description: Order reference string (e.g. an upstream order ID).
          example: ORD-001
        venue:
          type: string
          description: Trading venue (e.g. `NASDAQ`, `NYSE`).
          example: NASDAQ
        capacity:
          type: string
          description: Broker capacity — `Agent` or `Principal`.
          example: Agent
        order_type:
          type: string
          description: Order type — `Market`, `Limit`, etc.
          example: Market
        associated_person:
          type: string
          description: Rep code of the associated person for this trade.
          example: REP_SMITH

    BondTradeEvent:
      type: object
      required:
        - account
        - contra_account
        - security
        - currency
        - quantity
        - price
        - buy
        - transaction_date
        - value_date
      description: >
        Records a buy or sell of a fixed-income security (`corp_bond` or `govt_bond`) for a customer
        or firm account against a contra account. Generates ledger entries for the cash
        consideration and the bond movement, plus an optional commission, and writes a trade blotter
        row and unlotted lot rows for subsequent lot-matching.


        **Accrued interest is excluded from the money leg** — `price` is the *clean* price. The
        purchased interest implied by the trade is derived from the security's interest rule and
        reported back per item on the response as `purchased_interest_amount` /
        `purchased_interest_currency`; it is not part of the request.
      properties:
        transaction_date:
          type: string
          format: date-time
          description: Trade date.
          example: "2026-06-10T00:00:00Z"
        value_date:
          type: string
          format: date-time
          description: Settlement date.
          example: "2026-06-12T00:00:00Z"
        account:
          type: string
          description: Customer or firm account executing the trade.
          example: JOEBLOGGS
        subaccount:
          type: string
          enum: ["", CASH, MARGIN, FDIC, MM, FREE, SEG]
          description: Subaccount within the account.
          example: CASH
        contra_account:
          type: string
          description: >
            The other side of the trade. For a customer account: an `inventory`
            account (the firm takes the other side), a `pab` (a correspondent
            does), a `control` account (market settlement, with a later
            `Settlement` event confirming it), or a `custody` account — a
            clearing omnibus, for a firm that clears through another and so
            instructs no settlement of its own. For an `inventory` or `pab`
            account: `control` or `custody` only, since a customer-facing trade
            is entered from the customer side.
          example: PROP1
        security:
          type: string
          description: Security code of the bond. Must be a `corp_bond` or `govt_bond`.
          example: USTR2027
        currency:
          type: string
          description: Currency for the cash consideration.
          example: USD
        quantity:
          type: string
          description: >
            **Face value**, as a positive decimal string — not a number of units. The `buy` field
            determines direction.
          example: "100000"
        price:
          type: string
          description: >
            **Clean price as a percentage of face value**, as a decimal string: `"99.50"` means
            99.5% of par, i.e. 99.50 currency units per 100 of face. Accrued interest is not
            included and is derived separately.
          example: "99.50"
        buy:
          type: boolean
          description: >
            `true` for a buy (account receives the bond, pays cash); `false` for a sell (account
            delivers the bond, receives cash).
          example: true
        commission:
          type: string
          description: Commission charged to the customer as a decimal string. Omit or `"0"` for none.
          example: "25.00"
        commission_currency:
          type: string
          description: Currency for the commission. Defaults to `currency` if omitted.
          example: USD
        order_ref:
          type: string
          description: Order reference string (e.g. an upstream order ID).
          example: ORD-114
        venue:
          type: string
          description: Trading venue.
          example: OTC
        capacity:
          type: string
          description: Broker capacity — `Agent` or `Principal`.
          example: Principal
        order_type:
          type: string
          description: Order type — `Market`, `Limit`, etc.
          example: Market
        associated_person:
          type: string
          description: Rep code of the associated person for this trade.
          example: REP_SMITH

    MoneyMarketTradeEvent:
      type: object
      required: [account, settlement_account, omnibus_account, security, quantity, buy, transaction_date]
      description: >
        Records a customer buying or selling shares of a money-market-fund
        (`money_market_fund` type) security. Simpler than an equity trade:
        there is no `price` (NAV is always $1.00 — the currency for the cash
        leg is resolved from the security's own `pricing_currency`), no
        commission or regulatory fees, and no order/confirm metadata (no
        `order_ref`/`venue`/`capacity`/`order_type`/`associated_person`).
        Writes a trade blotter row and ledger entries, but — unlike an
        equity or bond trade — no trading lot rows, since MMF shares are
        NAV-stable and don't need FIFO cost-basis tracking.


        Cash and stock move through two separate relationships, reflecting
        how MMF shares are actually held (they aren't DTC-eligible the way
        equities are): `settlement_account` is the cash correspondent the
        customer's dollars move through; `omnibus_account` is the broker's
        omnibus position at the fund's transfer agent, credited/debited on
        the stock leg (and recorded as the blotter `contra`, since it's the
        real counterparty to the share movement). The customer's own shares
        post to a dedicated `MM` subaccount, separate from their cash
        subaccount.


        Transaction and value date can never differ for this event, so there
        is a single `transaction_date` — not a separate `value_date`.
      properties:
        transaction_date:
          type: string
          format: date-time
          example: "2026-06-10T00:00:00Z"
        account:
          type: string
          description: Customer account executing the trade.
          example: JOEBLOGGS
        subaccount:
          type: string
          enum: ["", "CASH", "MARGIN", "FDIC", "MM", "BORROWED", "ONLOAN", "FREE", "SEG"]
          description: Customer's cash subaccount for the cash leg. The stock leg always posts to the customer's MM subaccount.
          example: CASH
        settlement_account:
          type: string
          description: Cash correspondent account for the cash leg; must be type `custody`.
          example: BNYOPS
        omnibus_account:
          type: string
          description: >
            The broker's omnibus position at the fund's transfer agent, for
            the stock leg; must be type `custody` and must differ from
            `settlement_account`.
          example: VANGD_OMNI
        security:
          type: string
          description: Security code of the money-market fund traded.
          example: VMFXX
        quantity:
          type: string
          description: >
            Fund share quantity as a positive decimal string at full
            security precision. The `buy` field determines direction.
          example: "1000.00"
        buy:
          type: boolean
          description: >
            `true` for a buy (account receives shares, pays cash at $1.00
            NAV); `false` for a sell/redemption (account delivers shares,
            receives cash at $1.00 NAV).
          example: true

    SBLContractEvent:
      type: object
      required: [contract_date, delivery_date, account, lending_contra, control_contra, borrow, opening, security, quantity, currency, collateral, contract_identifier]
      # fee_bps is required on an open and rejected on a close, which `required`
      # cannot say; the description does, and Validate enforces it.
      description: >
        Opens or closes a securities borrow or loan, following Loanet's field
        conventions. Contract date is the transaction date and delivery date the value
        date: the stock and collateral move at the depository on the latter, through
        `control_contra`, cleared by an ordinary `Settlement` exactly as a trade settles.

        **Two contras, not one.** A trade's contra is either its counterparty or its
        settlement venue; a stock loan has both. `lending_contra` is who the contract is
        with (an `sbl` account) and `control_contra` is where the market leg settles (a
        `control` account).

        Borrowing 100 shares against 10,200 of collateral posts two entries — the lending
        contra takes `stock +100, money +10,200` in the `BORROWED` subaccount, the control
        account takes the mirror. Read the lending contra the way a customer account
        reads: positive stock means the holder is long, i.e. the firm owes them shares
        back; positive money is a debit, i.e. they owe the firm its collateral. A loan
        flips every sign and adds a second pair moving the firm's own shares to the
        `ONLOAN` subaccount — they leave the box but stay owned. A borrow adds no such
        pair: there is no position to encumber, and borrowed shares are not the firm's.

        **Borrows and loans facing one counterparty never net.** They are separate
        contracts with separate collateral and separate return obligations, so they sit in
        separate subaccounts; a single balance would report the difference between two
        live exposures as though there were none.

        `borrow` and `opening` are required rather than defaulted, because neither is
        recoverable from the economics — a delivery of stock to a counterparty is either a
        new loan or the return of a borrow, and only the contract says which. A close is
        the open with every sign reversed, sized to the closing quantity, so partial
        closes need nothing special.

        **A close is not checked against what the contract has outstanding.** Closing more
        than is open, or closing a contract this system never saw opened, is accepted and
        leaves the contract negative — which is a true statement about a book that
        disagrees with its counterparty, and how a migrated book or an out-of-order
        contract file legitimately arrives. The discrepancy is raised to an operator at
        the next closing rather than refused here.
      properties:
        contract_date:
          type: string
          format: date-time
          description: When the contract was agreed. The transaction date of every leg.
          example: "2026-06-15T00:00:00Z"
        delivery_date:
          type: string
          format: date-time
          description: >
            When the stock and collateral move at the depository. The value date of every
            leg, and the date the settlement obligation falls due. Must be on or after
            `contract_date`.
          example: "2026-06-16T00:00:00Z"
        account:
          type: string
          description: >
            The firm's own account lending or borrowing; must be type `inventory`. On a
            loan its shares are encumbered into the `ONLOAN` subaccount; on a borrow it is
            attribution only, carried as the lending contra entry's secondary account.
          example: PROP1
        lending_contra:
          type: string
          description: The securities lending counterparty; must be type `sbl`.
          example: SBL_GS
        control_contra:
          type: string
          description: >
            Where the market leg settles; must be type `control` with a `settlement_mode`
            configured. SBL settles by whatever rule that account settles by.
          example: DTC_SBL
        borrow:
          type: boolean
          description: True for stock coming in from the counterparty, false for stock going out.
          example: true
        opening:
          type: boolean
          description: True to establish a contract, false to unwind one (wholly or partly).
          example: true
        security:
          type: string
          description: The security being borrowed or lent. Must be an `ord` security.
          example: AAPL
        quantity:
          type: string
          description: >
            Shares, a positive decimal string at the security's precision. Unsigned —
            direction is carried by `borrow` and `opening`.
          example: "100"
        currency:
          type: string
          description: Currency of the collateral. Must be a `currency` security.
          example: USD
        collateral:
          type: string
          description: >
            Initial collateral posted or received, a non-negative decimal string at the
            currency's precision. Typically the position's market value plus a margin —
            102% is the ordinary convention on a US stock loan.
          example: "10200.00"
        fee_bps:
          type: integer
          description: >
            The lender's fee, in basis points — **not** the rebate rate.

            Under cash collateral the lender pays the borrower interest on the cash (the
            *rebate*) at a rate below what that cash earns, and keeps the difference. So
            `rebate = benchmark − fee`, and the fee is the only half of that anybody
            negotiates. A benchmark of 4% with a 25bp fee is a rebate of 3.75% paid by the
            lender; a 6% fee on a hard-to-borrow name is a rebate of −2%, where the lender
            keeps the 4% and collects 2% from the borrower on top. **Hard to borrow is a
            large positive fee**, not a negative one.

            Signed all the same, for the rare financing trade where stock goes out mainly
            to raise cash cheaply and the lender pays away more than the benchmark to do
            it. That, and only that, is a negative fee.

            **Required on an open, rejected on a close.** A close leaves what remains
            outstanding on the terms already agreed, so a fee there would be a term nothing
            acts on — refused rather than ignored, since a contract file that sends one is
            saying something that would otherwise be silently dropped. Changing the fee on
            a live contract is a re-rate, not a close and reopen.

            Nothing accrues on it yet: it is recorded here and reported on the contract
            snapshot.
          example: 25
        rebate_benchmark:
          type: string
          description: >
            Code of the benchmark the rebate floats against. Set, and the rate in force on
            any day is that day's benchmark less `fee_bps` — so the rebate tracks an
            overnight rate daily, as an open callable loan's does, without a re-rate being
            recorded for it.

            Omitted means there is no rebate leg and the fee is simply charged, which is how
            a non-cash-collateral loan works and how some cash loans are quoted. It does
            **not** mean a fixed rebate. Rejected on a close, like `fee_bps`.
          example: SOFR
        contract_identifier:
          type: string
          description: >
            The contract's identifier, assigned by the lender. Scoped to the counterparty,
            never global, and not unique even there: every close and every mark of a
            contract reuses it, and one identifier can be opened more than once when an
            existing borrow is added to.
          example: GS-2026-0001
        associated_person:
          type: string
          description: Party code of the person responsible for the contract.
          example: TRADER1

    SBLFeeEvent:
      type: object
      required: [billed_date, payment_date, period_start, period_end, account, lending_contra, control_contra, borrow, security, currency, amount, receive, contract_identifier]
      description: >
        Records what one securities borrow or loan was billed for a period — the cash the
        two counterparties settle with each other, monthly and in arrears.

        What passes between them is the **rebate**: interest on the collateral the borrower
        posted, at the benchmark less the fee. So the direction depends on which side the
        firm is and how the rate came out — borrowing at a positive rebate collects,
        lending at one pays away, and a hard-to-borrow name inverts both. `receive` carries
        that, because the statement being booked already says which way it went.

        **The amount is not calculated here.** What a period is worth is the counterparty's
        arithmetic under the lending agreement — day count, tolerance, which days the
        balance was what — which is reconciled against rather than recomputed. Nothing
        checks it against the contract's own `fee_bps`, and nothing here reads that field.

        Two ledger entries: the P&L line under nature `SecuritiesLendingIncome`, carrying
        the counterparty as its secondary account, and the cash at `control_contra`, which
        settles on `payment_date` through an ordinary `Settlement` like the collateral does.

        One caution on that income line: **on a loan it goes negative, and that is not a
        loss**. The firm pays the rebate away and keeps its fee out of what the collateral
        earns — but the earning side needs collateral reinvestment, which is not modelled,
        so this line holds billed cash rather than margin.

        Per contract, not per counterparty. A real statement nets a month of contracts into
        one figure; that netting is presentation, and posting at contract grain is what lets
        anyone answer what a given borrow actually cost.
      properties:
        billed_date:
          type: string
          format: date-time
          description: >
            The statement date, and the transaction date of both legs. Must be on or after
            `period_end`: billing is in arrears, and a statement cannot be raised for days
            that have not happened.
          example: "2026-07-02T00:00:00Z"
        payment_date:
          type: string
          format: date-time
          description: When the cash moves. The value date, and when the obligation falls due.
          example: "2026-07-06T00:00:00Z"
        period_start:
          type: string
          format: date-time
          description: First day the amount covers.
          example: "2026-06-01T00:00:00Z"
        period_end:
          type: string
          format: date-time
          description: >
            Last day the amount covers, inclusive. Carried even though nothing accrues over
            it yet — it is what a future accrual reconciles against, and it cannot be
            recovered from a posted event that did not record it.
          example: "2026-06-30T00:00:00Z"
        account:
          type: string
          description: The firm's own account the contract belongs to; must be type `inventory`. Takes the P&L leg.
          example: PROP1
        lending_contra:
          type: string
          description: >
            The securities lending counterparty; must be type `sbl`. Carried as the income
            leg's secondary account rather than taking a leg of its own — a fee is not
            collateral, so it does not touch the contract's balance.
          example: SBL_GS
        control_contra:
          type: string
          description: Where the cash settles; must be type `control` with a `settlement_mode`.
          example: DTC_SBL
        borrow:
          type: boolean
          description: Which way the contract being billed points. True for a borrow, false for a loan.
          example: true
        security:
          type: string
          description: The security the contract is in; must be an `ord` security.
          example: AAPL
        currency:
          type: string
          description: Currency of the amount. Must be a `currency` security.
          example: USD
        amount:
          type: string
          description: >
            What was billed, a positive decimal string at the currency's precision.
            Unsigned — `receive` carries the direction.
          example: "85.00"
        receive:
          type: boolean
          description: True when the firm collected the amount, false when it paid it away.
          example: true
        contract_identifier:
          type: string
          description: The identifier of the contract billed, as given on its open.
          example: GS-2026-0001
        associated_person:
          type: string
          description: Party code of the person responsible for the contract.
          example: TRADER1

    SBLRerateEvent:
      type: object
      required: [effective_date, account, lending_contra, borrow, security, currency, fee_bps, contract_identifier]
      description: >
        Changes what an open securities borrow or loan is priced at: the lender's fee, and
        the benchmark the rebate on the collateral floats against.

        This is how a stock loan's price moves, and it moves often — a name that goes
        special is re-rated by negotiation, sometimes daily, and disagreement about today's
        rate is one of the commonest breaks a lending desk reconciles. Closing the contract
        and reopening it at the new price is not the alternative it looks like: it would
        return the shares and the collateral through the depository and re-deliver both,
        two settlement cycles and two chances to fail, with the borrower flat in between.
        Here it would also post four settlement obligations and two journals for movements
        that never happened.

        So **a re-rate moves nothing**, and is the only event in the system that posts no
        ledger entries at all. `POST /events/sbl_rerate/simulate` accordingly returns an
        empty entry list on success rather than a preview.

        `account`, `lending_contra`, `borrow`, `security` and `currency` say which contract
        is being re-rated — five of the six columns the contract snapshot groups by, the
        sixth being the identifier. Naming them differently from the open prices a
        different contract, which appears in the snapshot as a second row rather than being
        silently merged.

        **Not checked against the contract it names** — that it exists, that it is open,
        that it was on some other rate before. Event processing reads no business state, so
        a re-rate of a contract with nothing open is recorded and surfaced at the closing.
      properties:
        effective_date:
          type: string
          format: date-time
          description: >
            When the new terms take effect, and the transaction date of the blotter row.
            Market convention re-rates from the next business day rather than the day of
            the negotiation, the day's accrual having already been struck at the old rate —
            so this is the date agreed, not the date agreed *on*.
          example: "2026-06-16T00:00:00Z"
        account:
          type: string
          description: The firm's own account the contract belongs to; must be type `inventory`.
          example: PROP1
        lending_contra:
          type: string
          description: The securities lending counterparty; must be type `sbl`.
          example: SBL_GS
        borrow:
          type: boolean
          description: Which way the contract being re-rated points. True for a borrow, false for a loan.
          example: true
        security:
          type: string
          description: The security the contract is in; must be an `ord` security.
          example: AAPL
        currency:
          type: string
          description: >
            Currency of the contract's collateral. Identity rather than an amount — a
            re-rate moves no money — and part of what files it against the right contract.
          example: USD
        fee_bps:
          type: integer
          description: >
            The new fee in basis points, replacing whatever was agreed before. Required: a
            re-rate that sets no fee has done nothing. See `SBLContractEvent.fee_bps` for
            what a fee is and why hard-to-borrow is a large positive one.
          example: 45
        rebate_benchmark:
          type: string
          description: >
            Code of the benchmark the rebate floats against from here. Omitted moves the
            contract off its benchmark, charging the fee outright with no rebate leg — so
            it is written and read as a pair with `fee_bps`, never carried forward
            separately.
          example: SOFR
        contract_identifier:
          type: string
          description: The identifier of the contract being re-rated, as given on its open.
          example: GS-2026-0001
        associated_person:
          type: string
          description: Party code of the person who agreed the re-rate.
          example: TRADER1

    SBLMarkEvent:
      type: object
      required: [mark_date, delivery_date, account, lending_contra, control_contra, borrow, increase, security, currency, collateral, contract_identifier]
      description: >
        Marks an open securities borrow or loan to market: the collateral posted against
        the contract is topped up or drawn down so it keeps covering the position's market
        value. US stock loan marks every business day, so a contract collects far more
        collateral movements than position ones.

        This is `SBLContractEvent` with the stock legs removed. Nothing about the borrow
        changes — the same shares are owed back on the same terms — so only money moves,
        and between the same two accounts the contract's collateral did: the lending
        contra takes `money +200` in the `BORROWED` subaccount and the control account
        takes the mirror. The cash clears through `control_contra` on `delivery_date` via
        an ordinary `Settlement`, exactly as the contract's collateral does. There is no
        encumbrance pair on a loan and no stock leg on either side.

        **The system records marks, it does not calculate them.** What the collateral
        should be is the counterparty's arithmetic under the lending agreement — which
        rate, struck off which close, rounded how, suppressed below what tolerance — and
        the contract file says what was agreed.

        **`borrow` and `increase` are both required.** Neither says on its own which way
        the cash goes: marking a borrow up and marking a loan down move it identically.
        The pair is also what files the mark against the right contract, since borrows and
        loans facing one counterparty never net.

        **A mark is not checked against the contract it names** — that it has anything
        open, that it is on the side claimed, that it exists here at all. It is accepted
        and leaves collateral posted against no position, which the next closing raises as
        an `sbl_collateral_outstanding` finding rather than refusing here.
      properties:
        mark_date:
          type: string
          format: date-time
          description: When the mark was struck. The transaction date of both legs.
          example: "2026-06-16T00:00:00Z"
        delivery_date:
          type: string
          format: date-time
          description: >
            When the collateral moves at the depository. The value date of both legs, and
            the date the settlement obligation falls due. Must be on or after `mark_date`.
          example: "2026-06-17T00:00:00Z"
        account:
          type: string
          description: >
            The firm's own account the contract belongs to; must be type `inventory`.
            Attribution only, carried as the lending contra entry's secondary account —
            unlike the contract, a mark encumbers nothing.
          example: PROP1
        lending_contra:
          type: string
          description: The securities lending counterparty; must be type `sbl`.
          example: SBL_GS
        control_contra:
          type: string
          description: >
            Where the collateral settles; must be type `control` with a `settlement_mode`
            configured. Ordinarily the same venue the contract settles at.
          example: DTC_SBL
        borrow:
          type: boolean
          description: Which way the contract being marked points. True for a borrow, false for a loan.
          example: true
        increase:
          type: boolean
          description: >
            True when the collateral posted against the contract goes up, false when it
            comes down.
          example: true
        security:
          type: string
          description: >
            The security the contract is in; must be an `ord` security. Required rather
            than looked up from the contract — event processing reads no business state —
            and it is part of what files the mark against the right contract.
          example: AAPL
        currency:
          type: string
          description: Currency of the collateral. Must be a `currency` security.
          example: USD
        collateral:
          type: string
          description: >
            How much the posted collateral moves by — the delta, not the new total — as a
            positive decimal string at the currency's precision. Unsigned: direction is
            carried by `borrow` and `increase`. Must be positive; a mark of nothing is a
            movement that did not happen.
          example: "200.00"
        contract_identifier:
          type: string
          description: The identifier of the contract being marked, as given on its open.
          example: GS-2026-0001
        associated_person:
          type: string
          description: Party code of the person responsible for the contract.
          example: TRADER1

    CustomerFXTradeEvent:
      type: object
      required: [account, buy_currency, buy_amount, sell_currency, sell_amount, transaction_date]
      description: >
        Records a client exchanging one currency for another inside a single account and
        subaccount, with the firm dealing as principal on the other side. Four ledger
        entries, two per currency: the client is credited what they bought and debited
        what they sold, and the firm's FX book takes the mirror of each.

        **The firm's side is not an input.** The firm deals as principal, so the other
        side can only be its FX clearing account — one of the bookkeeping accounts
        provisioned with the firm's role — and it is resolved from the client's firm
        rather than named. It is absent from the response for the same reason: a field
        returned by `GET` that `POST` refuses would read as something you may set.

        **Both amounts are given, not an amount and a rate.** The rate is the ratio
        between them, which keeps it exact at any precision and leaves no rounding
        decision for the two sides to disagree about. It is recorded on the trade blotter
        as that ratio and can be read back from
        `GET /firms/{firm}/events/{seid}` as the two amounts it came from.

        The two sides are classified differently, and deliberately: the client's legs are
        cash (`nature: ""`), their claim in each currency, while the firm's carry
        `nature: "FXDealing"`. No money moved at any bank — the client re-denominated a claim —
        so what the firm holds is a dealing position, not cash, and it stays out of the
        balance-sheet sum. Leaving it in would cancel the firm's legs against the client's
        and report a book with no FX exposure, when taking that exposure is what the firm
        just did.

        There is no market leg, so nothing settles externally and transaction and value
        date can never differ — hence a single `transaction_date`. No trading lots are
        opened either: a client dealing back the other way is a second trade, not a close,
        and realises no P&L here.
      properties:
        transaction_date:
          type: string
          format: date-time
          example: "2026-06-15T00:00:00Z"
        account:
          type: string
          description: Customer account dealing; must be type `customer`.
          example: MTREMBLAY
        subaccount:
          type: string
          enum: ["", "CASH", "MARGIN", "FDIC", "MM", "BORROWED", "ONLOAN", "FREE", "SEG"]
          description: The client's cash subaccount. Both currency legs post to it; must be `CASH` or `MARGIN`.
          example: CASH
        buy_currency:
          type: string
          description: Currency the client receives. Must be a `currency` security, and not `sell_currency`.
          example: USD
        buy_amount:
          type: string
          description: Amount of `buy_currency` received, a positive decimal string at that currency's precision.
          example: "10000.00"
        sell_currency:
          type: string
          description: Currency the client gives up.
          example: CAD
        sell_amount:
          type: string
          description: Amount of `sell_currency` given up, a positive decimal string at that currency's precision.
          example: "13712.00"

    SettlementEvent:
      type: object
      required: [date, control_account]
      description: >
        Records a delivery or receipt of securities (and optionally cash) at a
        custodian. Each of the stock leg and cash leg is independently optional,
        but at least one leg must be present.

        `stock_direction: "deliver"` — stock leaves the custody account (debit);
        `stock_direction: "receive"` — stock arrives at the custody account (credit).
        The same logic applies to `cash_direction` on the cash leg.
      properties:
        date:
          type: string
          format: date-time
          description: Settlement date (RFC3339).
          example: "2026-06-10T00:00:00Z"
        control_account:
          type: string
          description: Settlement control account (e.g. `DTC_CNS`).
          example: DTC_CNS
        trade_seid:
          type: integer
          format: int64
          description: >
            SEID of the trade being settled. Required when `control_account`
            settles trade-for-trade (`tft`), where it identifies which trade's
            lot to relieve; ignored for `cns` accounts, which net obligations
            per security. Recorded in the annotations of every blotter leg the
            settlement writes, so it is returned on `GET /events/{seid}`.
          example: 1411
        stock_security:
          type: string
          description: Security code for the stock leg. Omit if there is no stock movement.
          example: AAPL
        stock_quantity:
          type: string
          description: Share quantity for the stock leg as a positive decimal string.
          example: "100.000000"
        stock_direction:
          type: string
          enum: [deliver, receive]
          description: >
            `deliver` — stock leaves the custody account (debit the custody account).
            `receive` — stock arrives at the custody account (credit the custody account).
          example: receive
        stock_settlement_account:
          type: string
          description: Settlement account for the stock leg (e.g. `DTC_BOX`).
          example: DTC_BOX
        cash_currency:
          type: string
          description: Currency for the cash leg. Omit if there is no cash movement.
          example: USD
        cash_amount:
          type: string
          description: Cash amount for the cash leg as a positive decimal string.
          example: "19589.00"
        cash_direction:
          type: string
          enum: [deliver, receive]
          description: >
            `deliver` — cash leaves the account (debit outgoing).
            `receive` — cash arrives at the account (credit incoming).
          example: deliver
        cash_settlement_account:
          type: string
          description: Settlement account for the cash leg (e.g. `DTC_P`).
          example: DTC_P

    CashTransferEvent:
      type: object
      required: [from_account, to_account, currency, amount, transaction_date]
      description: >
        Records a cash transfer between two accounts (e.g. custody to bank program account
        for FDIC sweep, or between firm accounts). Transaction and value date can never differ
        for this event, so there is a single `transaction_date` — not a separate `value_date`.
      properties:
        transaction_date:
          type: string
          format: date-time
          example: "2026-06-10T00:00:00Z"
        from_account:
          type: string
          description: Account transferring the cash out.
          example: BNYOPS
        to_account:
          type: string
          description: Account receiving the cash.
          example: WF_BANK
        from_subaccount:
          type: string
          description: Subaccount within the from_account.
        to_subaccount:
          type: string
          description: Subaccount within the to_account.
        currency:
          type: string
          description: Currency of the transfer.
          example: USD
        amount:
          type: string
          description: Transfer amount as a positive decimal string.
          example: "50000.00"

    StockSegMoveEvent:
      type: object
      required: [account, from_subaccount, to_subaccount, stock_security, stock_quantity, transaction_date]
      description: >
        Records the depository's confirmation that shares were moved between the
        Free and Seg subaccounts of a custody account (e.g. `DTC_BOX`), in either
        direction. This is the only event that actually moves the Free/Seg balance —
        a pending stock segregation requirement only produces an instruction
        (visible via `GET /stock-instructions`) asking the depository to make the
        move; this event represents the depository's response confirming it
        happened, and is independent of any particular instruction. Transaction and
        value date can never differ for this event, so there is a single
        `transaction_date` — not a separate `value_date`.
      properties:
        transaction_date:
          type: string
          format: date-time
          example: "2026-06-10T00:00:00Z"
        account:
          type: string
          description: Custody account holding the stock at the depository. Must be a `custody`-type account.
          example: DTC_BOX
        from_subaccount:
          type: string
          enum: [FREE, SEG]
          description: Subaccount the shares are moving out of.
          example: FREE
        to_subaccount:
          type: string
          enum: [FREE, SEG]
          description: Subaccount the shares are moving into. Must differ from `from_subaccount`.
          example: SEG
        stock_security:
          type: string
          description: Security code of the shares being moved.
          example: AAPL
        stock_quantity:
          type: string
          description: Share quantity being moved, as a positive decimal string.
          example: "100.000000"

    EventResult:
      type: object
      required: [status]
      description: >
        The outcome of processing a single event in a batch. `status` is `"ok"` on
        success or `"error"` on failure. A failed event has no effect on the ledger —
        its transaction was rolled back.
      properties:
        status:
          type: string
          enum: [ok, error]
          description: Outcome for this event.
          example: ok
        error:
          type: string
          description: >
            The first refusal, in one line. Present only when `status` is `"error"`.
          example: 'account "BADACCT" not found'
        errors:
          type: object
          additionalProperties:
            type: string
          description: >
            The message for each field at fault, keyed by field name. Present only when
            `status` is `"error"`, and only where the event type attributes its
            refusals — see `SimulateResult.errors`, which is the same shape.
          example:
            account: 'account "BADACCT" not found'
        seid:
          type: integer
          format: int64
          description: >
            The system event id assigned to the created event. Present only when
            `status` is `"ok"`.
          example: 12345
        purchased_interest_amount:
          type: string
          description: >
            Accrued (purchased) interest on a bond trade, as a decimal string. Present
            only for `POST /events/bond_trade` items that carry accrued interest.
          example: "12.50"
        purchased_interest_currency:
          type: string
          description: Currency code for `purchased_interest_amount`.
          example: USD

    FillResult:
      type: object
      additionalProperties: true
      description: >
        The response of `POST /events/{type}/fill`: field name to value, for every
        field the server worked out. The body is the patch itself — there is no
        envelope, because it is merged into a form and forgotten rather than stored,
        and fill has no status, no error and nothing to explain that an envelope
        would carry.


        A delta rather than the completed event, for two reasons. The caller has the
        rest, having sent it a moment ago, and merging a delta cannot overwrite what
        was keyed — a field that already has a value is simply absent. And the keys
        are the list of what was filled, which a client cannot obtain by comparing
        two copies of a form, since a filled field and a reformatted one compare
        alike.


        Empty when it worked nothing out, which is an ordinary answer and not an
        error: an unfinished form is a form, and validation belongs to `/simulate`.
      example:
        value_date: "2026-06-11T00:00:00Z"

    SimulateResult:
      type: object
      required: [status]
      description: >
        The result of previewing a single event via `POST /events/{type}/simulate`.
        `status` is `"ok"` with the ledger `entries` the event would post (nothing is
        written), or `"error"` with the validation message — the same `Validate` error
        the real POST would report, so the frontend can validate as-you-go without
        duplicating the business rules.
      properties:
        status:
          type: string
          enum: [ok, error]
          description: Outcome of the simulation.
          example: ok
        error:
          type: string
          description: >
            The **first** refusal, in one line, for a caller with a message line and
            nothing else. Present only when `status` is `"error"`. Never the whole list
            run together: an event with four faults would produce four lines, which is
            a report rather than a message.
          example: 'account "NOSUCH" not found'
        errors:
          type: object
          additionalProperties:
            type: string
          description: >
            The message for each field at fault, keyed by the json name the caller sent
            it under. Present only when `status` is `"error"`, and only for the fields
            a refusal could be attributed to.


            This is what lets a form put the cursor on the mistake and mark the rest,
            which a message string cannot do. A map rather than a list, mirroring
            `POST /events/{type}/fill` — which answers with the *value* for each field
            it worked out, where this answers with the *problem* for each field it
            refused. A client iterates keys and addresses its own fields either way.


            Ordering is deliberately not expressed: which fault to answer first is a
            question about the caller's layout, and a list would only have offered
            server resolution order, which is arbitrary to someone reading a form top
            to bottom. **One message per field** — the first rule to fault a field
            wins, since that is all a form can show anyway.


            Equity trades report every field they can fault in one answer, so a form
            with four mistakes costs one round trip rather than four. Other event types
            report one at a time for now, and a refusal about the event as a whole
            names no field at all — those appear in `error` only, which is why `error`
            is populated for every refusal whether or not this is.
        entries:
          type: array
          description: >
            The ledger entries the event would post, in the same shape as `GET /entries`.
            Present only when `status` is `"ok"`. The entries carry a placeholder SEID of
            0 since nothing is persisted.
          items:
            $ref: "#/components/schemas/Entry"

    WorkItemDesk:
      type: string
      enum: [ops_pricing, ops_reference_data, ops_segregation]
      description: >
        The roles a work item can be assigned to — the operational desks, being exactly
        those holding `work_item:resolve`. Published here rather than fetched because the
        vocabulary lives in Go (`systemRoles`), like `Permission`; a test asserts the two
        stay identical.
      example: ops_pricing

    ResolutionReason:
      type: string
      enum: [data_arrived_late, upstream_fixed, no_action_needed, handled_externally, cured_in_system]
      description: >
        Why a work item was closed. A closed vocabulary rather than free text, because the
        question these exist to answer — "how often is it the feed?" — cannot be counted
        from prose.


        `cured_in_system` is set by the system when a write declares a cure against the
        item (see `work_item_id` on `PUT /prices`) and is not accepted from a caller; the
        subset an operator may send is `SelectableResolutionReason`.
      example: data_arrived_late

    SelectableResolutionReason:
      type: string
      enum: [data_arrived_late, upstream_fixed, no_action_needed, handled_externally]
      description: >
        The reasons an operator may resolve a work item with — `ResolutionReason` less
        `cured_in_system`, which only a declared cure produces. Offering that one by hand
        would let someone claim a fix nothing observed.
      example: data_arrived_late

    Resolution:
      type: object
      required: [reason, resolved_by, resolved_at]
      description: One entry in a work item's resolution log.
      properties:
        reason:
          $ref: "#/components/schemas/ResolutionReason"
        note:
          type: string
          description: Free text recorded with the resolution.
          example: Chased the vendor; file resumed Tuesday.
        resolved_by:
          type: string
          description: Username of whoever recorded it.
          example: admin
        resolved_at:
          type: string
          format: date-time
          example: "2026-06-12T18:05:00Z"
        cure_route:
          type: string
          description: >
            The route a declared cure came in on. Present only when `reason` is
            `cured_in_system`. Provenance — an audit statement, not something to
            dereference.
          example: PUT /prices
        cure_params:
          description: >
            The identifying params of the curing request, as sent. Present only when
            `reason` is `cured_in_system`; its shape is whatever that route writes.
          example:
            - security: DDOG
              currency: USD
              source: INTERNAL
              date: "2026-06-12"
              price: "142.50"

    WorkItem:
      type: object
      required:
        [id, kind, severity, subject_type, subject, status,
         occurrence_count, reopen_count, first_seen, last_seen]
      description: >
        One operational problem needing attention, identified by what it is about rather
        than by each time it occurred.
      properties:
        id:
          type: integer
          format: int64
          description: Work item ID.
          example: 12
        kind:
          type: string
          enum: [mtm_no_price, mtm_stale_price, seg_instruction_short, seg_settlement_short, seg_deficiency, fx_no_rate, fx_stale_rate, sbl_overclosed, sbl_collateral_outstanding]
          description: >
            What kind of problem this is. The `seg_*` kinds come from the custody
            segregation run and are forecasts: `seg_instruction_short` means the box is
            smaller than the 15c3-3 requirement it has to satisfy, `seg_settlement_short`
            that segregation took priority and left less in the Free box than expected
            deliveries need. Neither of those is a confirmed breach.


            `seg_deficiency` is: the start-of-trading check, run once the depository has
            reported what it actually segregated, comparing the requirement in force
            against what is really in the Seg box.
          example: mtm_no_price
        severity:
          type: string
          enum: [info, warning, severe]
          description: >
            How much this matters. Assigned by the system from `kind` and not adjustable.
          example: severe
        subject_type:
          type: string
          enum: [security, firm]
          description: What sort of thing the problem is about.
          example: security
        subject:
          type: string
          description: The subject, resolved to its code.
          example: ACME
        status:
          type: string
          enum: [open, resolved]
          description: Whether the item still needs attention.
          example: open
        assigned_role:
          allOf: [$ref: "#/components/schemas/WorkItemDesk"]
          description: >
            Role that owns the item. Absent when unassigned. A label only — it does not
            gate who may resolve.
          example: ops_pricing
        last_run_seid:
          type: integer
          format: int64
          description: >
            The run that most recently raised this. Closings are the only producers
            today, and a closing's id is its seid, so this is also a closing id.
          example: 331
        last_run_date:
          type: string
          format: date
          description: >
            The business date that run was as of — what an as-of screen needs to show
            the problem. A work item is identified by what it is *about* and carries no
            date of its own, so without this a client can only offer the latest closing,
            which is generally not the one that raised it. Absent if the run was not a
            closing.
          example: "2026-06-12"
        resolution:
          allOf: [$ref: "#/components/schemas/Resolution"]
          description: >
            The most recent resolution, if the item has ever been resolved. Present on a
            *reopened* item too, so read `status` for whether it is still outstanding
            rather than inferring it from this.
        occurrence_count:
          type: integer
          description: >
            How many runs have raised this problem. One run contributes exactly one
            occurrence however many positions it affected.
          example: 20
        reopen_count:
          type: integer
          description: >
            How many times the problem has recurred after being resolved. Non-zero means
            a resolution was overtaken by the condition coming back.
          example: 0
        first_seen:
          type: string
          format: date-time
          description: When this problem was first raised.
          example: "2026-01-02T17:00:00Z"
        last_seen:
          type: string
          format: date-time
          description: When it was most recently raised.
          example: "2026-01-29T17:00:00Z"
