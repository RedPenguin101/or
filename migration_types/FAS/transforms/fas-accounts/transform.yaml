transform: fas-accounts
version: 2
description: >
  FAS Account Master to Qniform parties and accounts. FAS has no party file, so
  every party the target requires is derived from the account records, and the
  ledger an account belongs to — encoded in its number range, not in
  ACCT-TYPE-CD — decides what kind of party that is.

inputs:
  # A list of one today. Declared as a list so nothing can grow a 1:1
  # dataset-to-endpoint assumption by accident.
  - source_system: FAS
    schema: ACCOUNT-MASTER
    as: account_master

# A rule is the whole chain: the source it reads, the identity it mints, the SQL
# that flattens it, and the shape of the payload that leaves. Nothing downstream
# renames, reinterprets or reshapes what a rule produces.
#
# Load order is not declared here. Qniform's referential dependencies fix it for
# every migration (see qniform.go), so restating it per project would only give
# it somewhere to drift.
rules:
  - name: counterparties
    title: Counterparties
    summary: >
      Every account that records a relationship with someone outside the firm
      gets a party for the other end of it, and the account number range decides
      who that is: a customer on the customer ledger, a custodian on the broker
      safekeeping ledger, a program bank on the bank ledger. One source column,
      CUST-NAME-1, becomes three different kinds of party — Qniform keeps the
      roles apart because a client relationship, a safekeeping obligation and a
      deposit liability are different things, and each account type accepts only
      its own. The proprietary and control ledgers are skipped: they have no
      other side, and Qniform rejects a counterparty on them outright.


      FAS has no party key — the other side exists only as a name on the
      account — so identity can only be per-account: two accounts for the same
      person are two parties until something better arrives. A joint holding is
      one party, not two, because a Qniform account names exactly one
      counterparty whatever its legal form.
    from: [{ source_system: FAS, schema: ACCOUNT-MASTER }]
    to: PUT /parties
    mints:
      entity: party
      prefix: FAS_CPTY_
      from: [ACCT-NO]
    binding:
      row_key: code
      fields:
        code: {}
        name: {}
        pre_name: {}
        # The role varies by ledger, so it comes from a column rather than being
        # stated as a literal.
        roles:
          key_from: role

  - name: reps
    title: Representatives and desks
    summary: >
      One party per distinct REP-ID, on the two ledgers whose accounts may name a
      responsible party at all. The same column means two different things: on a
      customer account it is a registered rep, on a proprietary account it is a
      trading desk, and Qniform will not accept one where it wants the other — so
      the role is decided by the account number range, not by the column itself.
      A REP-ID left on a bank, custody or control record is stale
      denormalisation rather than a party, and is ignored.


      REP-NAME is denormalised onto every account and is not kept consistent, so
      the same REP-ID arrives with several spellings; that disagreement
      quarantines the party rather than being silently resolved.
    from: [{ source_system: FAS, schema: ACCOUNT-MASTER }]
    to: PUT /parties
    mints:
      entity: party
      prefix: FAS_REP_
      from: [REP-ID]
      conflict:
        on: [name]
        resolve: error
    binding:
      row_key: code
      fields:
        code: {}
        name: {}
        pre_name: {}
        roles:
          key_from: role

  - name: accounts
    title: Accounts
    summary: >
      One account per source record, with its Qniform type read from the account
      number range. FAS keeps eight ledgers and Qniform has one type for each
      except three that collapse onto `control`; a number in no known range
      yields no type at all and the account is withheld, rather than guessed at.


      The ledger also decides which optional slots may be filled, and Qniform is
      strict about it in both directions: a counterparty is required on custody
      and bank, optional on customer, and rejected outright on inventory and
      control; a responsible party is required on customer, optional on
      inventory, and rejected on the rest. Filling a slot the type forbids fails
      the whole request rather than the item, so the rule cannot leave it to the
      target to sort out. COST-METHOD-CD maps to the lot relief method; a blank
      means none rather than absent.
    from: [{ source_system: FAS, schema: ACCOUNT-MASTER }]
    to: PUT /firms/{firm}/accounts
    mints:
      entity: account
      prefix: ""            # Qniform account codes are the FAS account numbers
      from: [ACCT-NO]
    binding:
      row_key: code
      fields:
        code: {}
        name: {}
        type: {}
        allocation_method: {}
        # The model carries the raw source key; the referenced rule's prefix is
        # applied here, so the mint expression is written once and cannot drift.
        counterparty:
          references: counterparties
        responsible_party:
          references: reps
