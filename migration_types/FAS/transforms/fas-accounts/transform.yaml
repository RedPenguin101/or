transform: fas-accounts
version: 1
description: >
  FAS Account Master to Qniform parties and accounts. FAS has no party file, so
  every party the target requires is derived from the account records.

inputs:
  # A list of one today. Declared as a list so nothing can grow a 1:1
  # dataset-to-endpoint assumption by accident.
  - schema: FAS/ACCOUNT-MASTER
    as: account_master

# A rule is the whole chain: the source it reads, the identity it mints, the SQL
# that flattens it, and the shape of the payload that leaves. Nothing downstream
# renames, reinterprets or reshapes what a rule produces.
#
# Load order is not declared here. Qniform's referential dependencies fix it for
# every migration (see qniform.go), so restating it per project would only give
# it somewhere to drift.
rules:
  - name: customers
    title: Customers
    summary: >
      Every account holder becomes a party. FAS has no customer key — the holder
      exists only as a name on the account — so identity can only be per-account:
      two accounts for the same person are two parties until something better
      arrives. A joint holding is one party, not two, because Qniform's model has
      a customer account name exactly one counterparty whatever its legal form.
      House accounts have no holder and are skipped.
    from: [FAS/ACCOUNT-MASTER]
    to: PUT /parties
    mints:
      entity: party
      prefix: FAS_CUST_
      from: [ACCT-NO]
    binding:
      row_key: code
      fields:
        code: {}
        name: {}
        pre_name: {}
        # This rule only ever makes customers, so it says so outright instead of
        # carrying a column to vary something that never varies.
        roles:
          object: { customer: {} }

  - name: reps
    title: Representatives and desks
    summary: >
      One party per distinct REP-ID. The same column means two different things:
      on a customer account it is a registered rep, on a house account it is a
      trading desk, and Qniform will not accept one where it wants the other — so
      the role is decided by ACCT-TYPE-CD, not by the column itself. REP-NAME is
      denormalised onto every account and is not kept consistent, so the same
      REP-ID arrives with several spellings; that disagreement quarantines the
      party rather than being silently resolved.
    from: [FAS/ACCOUNT-MASTER]
    to: PUT /parties
    mints:
      entity: party
      prefix: FAS_REP_
      from: [REP-ID]
      conflict:
        on: [name]
        resolve: error
    binding:
      row_key: code
      fields:
        code: {}
        name: {}
        pre_name: {}
        # Here the role genuinely varies by row, so it comes from a column.
        roles:
          key_from: role

  - name: accounts
    title: Accounts
    summary: >
      One account per source record. ACCT-TYPE-CD is the pivot: H becomes a
      Qniform inventory account, everything else a customer account. That choice
      also decides whether a counterparty is permitted at all — sending one on an
      inventory account is refused outright — and which role the responsible
      party has to hold. COST-METHOD-CD maps to the lot relief method; a blank
      means none rather than absent.
    from: [FAS/ACCOUNT-MASTER]
    to: PUT /firms/{firm}/accounts
    mints:
      entity: account
      prefix: ""            # Qniform account codes are the FAS account numbers
      from: [ACCT-NO]
    binding:
      row_key: code
      fields:
        code: {}
        name: {}
        type: {}
        allocation_method: {}
        # The model carries the raw source key; the referenced rule's prefix is
        # applied here, so the mint expression is written once and cannot drift.
        counterparty:
          references: customers
        responsible_party:
          references: reps
