target: PUT /firms/{firm}/accounts
batch:
  max_items: 500
  failure_mode: per_item
row_key: code

# Field names are model column names are Qniform field names — one name from end
# to end. There is no `from`, because renaming here would be a second place to
# make a semantic decision, and no `omit_when`, because absence is a NULL in the
# model. What remains cannot express a business rule.
fields:
  code: {}
  name: {}
  type: {}
  allocation_method: {}

  # counterparty is rejected outright on inventory accounts — sending one fails
  # the whole request with a 400. The model says so by producing NULL, and a NULL
  # column is an omitted key.
  counterparty:
    references: party

  responsible_party:
    references: party
