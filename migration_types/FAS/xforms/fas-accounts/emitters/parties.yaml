target: PUT /parties
batch:
  max_items: 500
  failure_mode: per_item
row_key: code

fields:
  code: {}
  name: {}
  pre_name: {}

  # The one thing SQL cannot produce: a *value* in the `role` column becoming a
  # *key* in the request body. A role is held by virtue of its key being present,
  # so the key has to come from the row.
  roles:
    map:
      key_from: role
